[quests]
OreToPowerChapter=Od rudy do mocy
Welcome=Witamy w Evospace
WelcomeDesc1=Aim at ore, rock or a tree and mine it with <blue>{key:ActionPrimary}</>.
WelcomeDesc2=This log lists what to do next and opens with <blue>{key:QuestBook}</>. The map is <blue>{key:ToggleMap}</>.
WelcomeDesc3=Przedmiot bierze się do ręki za pomocą klawisza na pasku skrótów: <blue>{key:ActiveSlot1}</> – multinarzędzie, <blue>{key:ActiveSlot2}</> – {item:BasicPlatform}. W ręce używa się go za pomocą <blue>{key:ActionPrimary}</>.
WelcomeDesc4=Ekwipunek otwiera się za pomocą <blue>{key:ToggleInventory}</>: kliknięcie bierze przedmiot do ręki, kliknięcie na slocie paska szybkiego dostępu przypisuje go do tego slotu.
ObjOpenQuestBook=Otwórz dziennik zadań za pomocą {key:QuestBook}
ObjReturnToWorld=Powrót do świata
GatherCopperOre=Zbierz rudę miedzi
GatherCopperOreDesc=Na powierzchni widać rudę miedzi. Wydobądź ją za pomocą multinarzędzia.
GatherCopperOreDesc2=Znajdujące się w pobliżu złoże jest wyświetlane na kompasie u góry ekranu, a na mapie (<blue>{key:ToggleMap}</>) zaznaczone są złoża wokół Ciebie.
ObjGatherCopperOre=Wykop {item:ChalcopiryteOre} lub {item:MalachiteOre}
GatherFuel=Zbierz paliwo
GatherFuelDesc=Węgiel wydobywa się jak rudę, kłody pochodzą z drzew. Piec spala oba.
ObjGatherCoal=Zbierz {count} × {item:CoalOre}
ObjGatherLogs=Zbierz {count} × {item:Log}
OpenInventory=Otwórz swój ekwipunek
OpenInventoryDesc1=Otwórz swój ekwipunek za pomocą <blue>{key:Toggle Inventory</>. To, co nosisz, znajduje się po lewej stronie, a baza danych przedmiotów po prawej.
OpenInventoryDesc2=Znajdź element w bazie danych i zamów go. Ten sam klawisz zamyka okno.
ObjOpenInventory=Otwórz ekwipunek za pomocą {key:Toggle Inventory}
MineStone=Zbierz kamień
MineStoneDesc=Wydobywaj <blue>{item:StoneSurface}</> ze skał, głazów i ścian klifów za pomocą swojego multinarzędzia.
ObjMineStone=Zbierz {item:StoneSurface}
ReturnHome=Powrót do bazy
ReturnHomeDesc1=Zanieś rudę z powrotem do punktu startowego.
ReturnHomeDesc2=Kompas u góry ekranu wskazuje punkt startowy, a <blue>{key:Escape}</> otwiera menu z opcją „Teleport to Home”.
ObjReturnHome=Wróć do punktu startowego
CraftFirstBlocks=Stwórz piece i hutę
CraftFirstBlocksDesc=Stwórz <blue>{item:StoneFurnace}</> i <blue>{item:StoneSmelter}</>. Jeden piec ogrzewa hutę, kolejny idzie do elektrowni.
ObjCraftStoneFurnace=Wybuduj 2 × {item:StoneFurnace}
ObjCraftStoneSmelter=Wybuduj {item:StoneSmelter}
BuildFirstSmelter=Wybuduj swoją pierwszą hutę
BuildFirstSmelterDesc1=Wybierz miejsce z wolną przestrzenią wokół
BuildFirstSmelterDesc2=Umieść <blue>{item:StoneFurnace}</>. Mając <blue>{item:StoneSmelter}</> w dłoni, wyceluj w piec: piec dokuje po stronie grzewczej.
ObjBuildStoneFurnace=Zbuduj {item:StoneFurnace}
ObjStackStoneSmelter=Postaw {item:StoneSmelter} bezpośrednio na {item:StoneFurnace}
SmeltCopperPlates=Wytop miedź
SmeltCopperPlatesDesc1=Załaduj paliwo do <blue>{item:StoneFurnace}</>, a rudę miedzi do <blue>{item:StoneSmelter}</>.
SmeltCopperPlatesDesc2=Wyjmij płyty z wylotu pieca, gdy ten się zapełni.
ObjSmeltCopperPlates=Wytop {item: CopperPlate}
CraftMachines=Od ciepła do badań
CraftMachinesDesc=Stwórz <blue>{item:CopperStirlingEngine}</>, <blue>{item:CopperCompactGenerator}</> oraz <blue>{item:CopperComputer}</>.
ObjCraftStirlingEngine=Stwórz {item:CopperStirlingEngine}
ObjCraftCompactGenerator=Stwórz {item:CopperCompactGenerator}
ObjCraftComputer=Stwórz {item:CopperComputer}
BuildFirstPowerPlant=Zbuduj elektrownię
BuildFirstPowerPlantDesc1=Umieść drugi <blue>{item:StoneFurnace}</>. Wyceluj w niego <blue>{item:CopperStirlingEngine}</> w dłoni, a następnie zadokuj <blue>{item:CopperCompactGenerator}</> do silnika, a <blue>{item:CopperComputer}</> do generatora.
BuildFirstPowerPlantDesc2=<blue>{key:ActionRotate}</> przełącza między pozycjami dokowania. Załaduj paliwo do pieca, aby uruchomić instalację.
ObjBuildPowerPlant=Połącz piec, {item:CopperStirlingEngine}, {item:CopperCompactGenerator} i {item:CopperComputer} w jedną działającą linię
AutomationChapter=Automatyzacja
ResearchBasicMachines=Otwórz drzewo badań
ResearchBasicMachinesDesc1=Otwórz drzewo badań za pomocą <blue>{key:Journal}</> lub przycisku badań na pasku po lewej stronie. Przycisk pokazuje również czas pozostały do ​​zakończenia trwającego badania.
ResearchBasicMachinesDesc2=Uruchom {research:BasicMachines}. Komputer wytwarza punkty badań, dopóki ma prąd ; the recipes appear when the research is done.
ObjResearchBasicMachines=Badania {research:BasicMachines}
ResearchAutomaticMining=Badania automatyzacji górnictwa
ResearchAutomaticMiningDesc1={research:Automatization} odblokowuje maszyny, które przemieszczają przedmioty między urządzeniami. {research:AutomaticMining} tego wymaga i odblokowuje {item:CopperDrillingRig}, który automatycznie wydobywa rudę.
ResearchAutomaticMiningDesc2=Przechowuj paliwo w piecu, dopóki działają oba urządzenia: komputer generuje punkty tylko wtedy, gdy jest zasilany.
ObjResearchAutomatization=Badania {research:Automatization}
ObjResearchAutomaticMining=Badania {research:AutomaticMining}
BuildAutomaticMine=Skonfiguruj automatyczną kopalnię
BuildAutomaticMineDesc1=Find an ore deposit on the map, walk to it and stand a <blue>{item:CopperDrillingRig}</> on it.
BuildAutomaticMineDesc2=Place a <blue>{item:StoneFurnace}</> next to the rig and a <blue>{item:CopperStirlingEngine}</> on it. Connect the engine kinetic output to the rig kinetic input and load fuel into the furnace.
BuildAutomaticMineDesc3=Research {research:Chest} and place a <blue>{item:StoneChest}</> at the rig output side. Mined ore goes into the chest.
ObjPowerDrillingRig=Drive the {item:CopperDrillingRig} from a {item:CopperStirlingEngine} on a fuelled furnace
ObjDockMineChest=Stand a chest against the rig's output side
ObjCraftLineChests=Craft 2 {item:StoneChest}
ObjCraftLineHammer=Craft a {item:CopperAutomaticHammer}
ObjCraftLineSmelter=Craft a {item:StoneSmelter}
ObjCraftLineEngine=Craft a {item:CopperStirlingEngine}
ObjCraftLineFurnaces=Craft 2 {item:StoneFurnace}
CraftOreMultiplication=Rozmnóż rudę
CraftOreMultiplicationDesc1=A <blue>{item:StoneSmelter}</> gives 1 plate from 1 ore. The <blue>{item:CopperAutomaticHammer}</> crushes ore into impure gravel with a 50% {tips:Productivity} bonus, the <blue>{item:CopperMacerator}</> grinds the gravel into ore dust with another 50%. Smelting the dust gives about 2.25 plates from the same ore.
CraftOreMultiplicationDesc2=Jeden młot wytwarza ilość żwiru wystarczającą dla dwóch rozdrabniarek.
ObjCraftMultiplierMacerators=Craft 2 {item:CopperMacerator}
ObjCraftMultiplierArms=Craft 5 {item:CopperRobotArm}
ResearchCircuits=Zbadaj obwód scalony
ResearchCircuitsDesc1=Następnym ważnym krokiem jest produkcja własnego obwodu: {research:CircuitBoard}, {research:Triod}, {research:Circuit}. {research:Constructor} odblokowuje maszynę, która automatycznie tworzy receptury ręczne.
ObjResearchCircuitBoard=Badania {research:CircuitBoard}
ObjResearchTriod=Badania {research:Triod}
ObjResearchCircuit=Badania {research:Circuit}
ObjResearchConstructor=Badania {research:Constructor}
SteelChapter=Stal i para
AutomateFuel=Więcej paliwa
AutomateFuelDesc1=Zautomatyzuj wydobycie węgla kamiennego ({item:CoalOre}) za pomocą wiertnicy ({item:CopperDrillingRig}).
AutomateFuelDesc2=Kłoda ({item:Log}) spala się szybciej niż węgiel kamienny, ale autofarma ({item:CopperAutomaticFarm}) zapewnia odnawialne źródło drewna. Odblokowuje ją badanie {research:AutomaticFarm}. Wymaga wody ({item:Water}) doprowadzonej rurą z zanurzonej pompy ({item:CopperPump}) lub kondensatora atmosferycznego ({item:CopperAtmosphericCondenser}).
AutomateFuelDesc3=Retorta ({item:CopperOven}) przetwarza węgiel kamienny lub kłody na koks ({item:Coke}), który pali się dłużej niż oba te paliwa.
ObjDrillCoalOre=Wydobądź wiertnicami {count} × {item:CoalOre}
ObjFarmLogs=Wyprodukuj na autofarmach {count} × {item:Log}
MakeCoke=Produkcja koksu
MakeCokeDesc1=Kamienny piec ({item:StoneFurnace}) daje za mało ciepła dla retorty ({item:CopperOven}); użyj miedzianego pieca ({item:CopperFurnace}). Retorta przyjmuje węgiel kamienny ({item:CoalOre}), jego żwir lub pył. Więcej: {tips:Energy}.
MakeCokeDesc2=Koks z drewna powstaje w dwóch etapach: {item:Log} → {item:Coal} → {item:Coke}.
MakeCokeDesc3=Retorta wytwarza też kreozot ({item:Creosote}) i zatrzymuje się, jeśli nie można go odprowadzić. Rura na wyjściu płynów lub pompa ({item:CopperPump}) kieruje go do pieca fluidyzacyjnego ({item:CopperFluidFurnace}) jako paliwo albo do recyklera ({item:CopperDestroyer}) w celu usunięcia.
ObjProduceCoke=Wytwórz {count} × {item:Coke}
MineIron=Wydobycie żelaza
MineIronDesc1=Żelazo do produkcji stali można uzyskać z rudy magnetytu ({item:MagnetiteOre}) lub pirytu ({item:PyriteOre}).
MineIronDesc2=Żelazną blachę ({item:IronPlate}) można wytopić bezpośrednio z rudy. Młoty pneumatyczne i rozdrabniacze zwiększają uzysk.
ObjSmeltIronPlate=Wytop {count} × {item:IronPlate}
SmeltSteel=Pierwsza stal
SmeltSteelDesc1=Wielki piec ({item:CopperBlastFurnace}) wytwarza stal z żelaznych blach ({item:IronPlate}) i koksu ({item:Coke}). Nie wymaga zewnętrznego zasilania.
ObjSmeltSteelPlate=Wytop {count} × {item:SteelPlate}
SteamIndustry=Siła pary
SteamIndustryDesc1=Zbadaj {research:Boiler} i {research:SteamEngine}. Kocioł ({item:SteelBoiler}) wykorzystuje <red>ciepło</> do zamiany wody ({item:Water}) w parę ({item:Steam}). Silnik parowy ({item:SteelSteamEngine}) przekształca parę w <yellow>energię kinetyczną</>. Generator kompaktowy ({item:SteelCompactGenerator}), odblokowany przez {research:PowerGeneration1}, zamienia ją w <blue>elektryczność</>.
SteamIndustryDesc2=Para przepływa bez strat przez rury na płyny i może być przechowywana w zbiornikach na płyny.
SteamIndustryDesc3=Następnie zbadaj {research:Resistor} i {research:AdvancedCircuit}, aby przyspieszyć badania. Więcej: {tips:Research}.
ObjResearchBoiler=Zbadaj {research:Boiler}
ObjResearchSteamEngine=Zbadaj {research:SteamEngine}
ObjResearchResistor=Zbadaj {research:Resistor}
ObjResearchAdvancedCircuit=Zbadaj {research:AdvancedCircuit}
AdvancedCircuits=Zaawansowane układy scalone
AdvancedCircuitsDesc1=Przepis: 1 × {item:CircuitBoard} + 2 × {item:Resistor} + 3 × {item:Circuit} → 1 × {item:AdvancedCircuit}. Zwykłe układy scalone mogą pochodzić z istniejącej linii produkcyjnej.
AdvancedCircuitsDesc2=Rezystor: 1 × {item:CoalDust} + 4 × {item:CopperWire}. Rezystory zwiększą zużycie przewodu miedzianego, który jest potrzebny także do triod.
AdvancedCircuitsDesc3=Badanie {research:Dynamo} odblokowuje stalowy komputer ({item:SteelComputer}). Z zaawansowanymi układami scalonymi wytwarza on 100 punktów badań na sekundę.
ObjResearchDistributedComputing1=Zbadaj {research:Dynamo}
ObjProduceAdvancedCircuit=Wytwórz w konstruktorach {count} × {item:AdvancedCircuit}
ResearchAluminium=Odblokuj produkcję aluminium
ResearchAluminiumDesc1=Elektrolizer ({item:SteelElectrolyzer}) wytwarza pył aluminium, a huta indukcyjna ({item:SteelArcSmelter}) przetapia go na blachy. Obie maszyny potrzebują prądu. Badanie {research:AluminiumProduction} wymaga {research:AdvancedSmelting} i {research:AluminiumReduction}.
ObjResearchAluminiumProduction=Zbadaj {research:AluminiumProduction}
AluminiumChapter=Aluminium
MineAluminiumOre=Wydobycie rudy aluminium
MineAluminiumOreDesc1=Aluminium uzyskuje się z rudy boksytu ({item:BauxiteOre}) lub rubinu ({item:RubyOre}).
ObjDrillAluminiumOre=Wydobądź wiertnicami {count} × {item:BauxiteOre} lub {item:RubyOre}
ProcessAluminiumOre=Obróbka rudy aluminium
ProcessAluminiumOreDesc1=Przetapianie rudy aluminium daje sproszkowany boksyt ({item:BauxiteDust}) lub rubin ({item:RubyDust}).
ProcessAluminiumOreDesc2=Bez rozdrabniania cały proces daje około jednej aluminiowej blachy na dwie jednostki rudy. Młoty pneumatyczne i rozdrabniacze zwiększają uzysk. Huta przyjmuje rudę, żwir i sproszkowaną rudę; rozdzielacz ({item:SteelSeparator}) tylko sproszkowaną rudę.
ObjProduceAluminiumOreDust=Wytwórz {count} × {item:BauxiteDust} lub {item:RubyDust}
Electrolysis=Elektroliza
ElectrolysisDesc1=Elektrolizer ({item:SteelElectrolyzer}) przetwarza sproszkowany boksyt ({item:BauxiteDust}) lub rubin ({item:RubyDust}) na pył tlenku glinu ({item:AluminiumOxideDust}). Ponowna elektroliza daje pył aluminium ({item:AluminiumDust}).
ElectrolysisDesc2=Pierwszy etap daje też tlen ({item:Oxygen}) oraz pył tlenku tytanu ({item:TitaniumOxideDust}) z boksytu lub pył chromu ({item:ChromiumDust}) z rubinu. Elektrolizer zatrzymuje się, jeśli tlen nie jest odprowadzany. Rura lub pompa ({item:CopperPump}) może skierować go do recyklera ({item:CopperDestroyer}).
ElectrolysisDesc3=Ładowarka ({item:CopperLoader}) odbiera wszystkie przedmioty ze slotów wyjściowych. Sortownik ({item:SteelSorter}) kieruje tlenek do drugiego etapu elektrolizy, a produkty uboczne na regał ({item:CopperItemRack}) lub do recyklera.
ObjProduceAluminiumDust=Wytwórz {count} × {item:AluminiumDust}
