[quests]
OreToPowerChapter=From Ore to Power
Welcome=Welcome to Evospace
WelcomeDesc1=Aim at ore, rock or a tree and mine it with <blue>{key:ActionPrimary}</>.
WelcomeDesc2=This log lists what to do next and opens with <blue>{key:QuestBook}</>. The map is <blue>{key:ToggleMap}</>.
WelcomeDesc3=An item is taken in hand with a hotbar key: <blue>{key:ActiveSlot1}</> the multitool, <blue>{key:ActiveSlot2}</> the {item:BasicPlatform}. In hand it is used with <blue>{key:ActionPrimary}</>.
WelcomeDesc4=The inventory opens with <blue>{key:ToggleInventory}</>: a click takes an item in hand, a click on a hotbar slot assigns it to that slot.
ObjOpenQuestBook=Open the quest log with {key:QuestBook}
ObjReturnToWorld=Return to the world
GatherCopperOre=Gather Copper Ore
GatherCopperOreDesc=Copper ore shows on the surface. Mine it with your multitool.
GatherCopperOreDesc2=A deposit close by shows on the compass at the top of the screen, and the map (<blue>{key:ToggleMap}</>) marks the deposits around you.
ObjGatherCopperOre=Mine {item:ChalcopyriteOre} or {item:MalachiteOre}
GatherFuel=Gather Fuel
GatherFuelDesc=Coal is mined like ore, logs come from trees. A furnace burns both.
ObjGatherCoal=Gather {count} × {item:CoalOre}
ObjGatherLogs=Gather {count} × {item:Log}
OpenInventory=Open Your Inventory
OpenInventoryDesc1=Open your inventory with <blue>{key:ToggleInventory}</>. What you carry is on the left, the item database is on the right.
OpenInventoryDesc2=Find an item in the database and order it. The same key closes the window.
ObjOpenInventory=Open the inventory with {key:ToggleInventory}
MineStone=Gather Stone
MineStoneDesc=Mine <blue>{item:StoneSurface}</> from rocks, boulders and cliff faces with your multitool.
ObjMineStone=Gather {item:StoneSurface}
ReturnHome=Vissza a bázisra
ReturnHomeDesc1=Vidd vissza az ércet a kezdőpontodra.
ReturnHomeDesc2=A képernyő tetején lévő iránytű a kezdőpontra mutat, a <blue>{key:Escape}</> pedig megnyitja a menüt a „Teleport to Home” gombbal.
ObjReturnHome=Térj vissza a kezdőpontra
CraftFirstBlocks=Craft the Furnaces and the Smelter
CraftFirstBlocksDesc=Craft the <blue>{item:StoneFurnace}</> and the <blue>{item:StoneSmelter}</>. One furnace heats the smelter, another goes to the power plant.
ObjCraftStoneFurnace=Craft 2 × {item:StoneFurnace}
ObjCraftStoneSmelter=Craft a {item:StoneSmelter}
BuildFirstSmelter=Build Your First Smelter
BuildFirstSmelterDesc1=Choose a place with free space around it.
BuildFirstSmelterDesc2=Place a <blue>{item:StoneFurnace}</>. With the <blue>{item:StoneSmelter}</> in hand, aim at the furnace: the smelter docks onto its heat side.
ObjBuildStoneFurnace=Build a {item:StoneFurnace}
ObjStackStoneSmelter=Stand a {item:StoneSmelter} directly on the {item:StoneFurnace}
SmeltCopperPlates=Smelt Copper
SmeltCopperPlatesDesc1=Load fuel into the <blue>{item:StoneFurnace}</> and copper ore into the <blue>{item:StoneSmelter}</>.
SmeltCopperPlatesDesc2=Take the plates out of the smelter's output when it fills up.
ObjSmeltCopperPlates=Smelt {item:CopperPlate}
CraftMachines=From Heat to Research
CraftMachinesDesc=Craft a <blue>{item:CopperStirlingEngine}</>, a <blue>{item:CopperCompactGenerator}</> and a <blue>{item:CopperComputer}</>.
ObjCraftStirlingEngine=Craft a {item:CopperStirlingEngine}
ObjCraftCompactGenerator=Craft a {item:CopperCompactGenerator}
ObjCraftComputer=Craft a {item:CopperComputer}
BuildFirstPowerPlant=Build the Power Plant
BuildFirstPowerPlantDesc1=Place the second <blue>{item:StoneFurnace}</>. Aim at it with the <blue>{item:CopperStirlingEngine}</> in hand, then dock the <blue>{item:CopperCompactGenerator}</> onto the engine and the <blue>{item:CopperComputer}</> onto the generator.
BuildFirstPowerPlantDesc2=<blue>{key:ActionRotate}</> switches between the docking positions. Load fuel into the furnace to start the plant.
ObjBuildPowerPlant=Join furnace, {item:CopperStirlingEngine}, {item:CopperCompactGenerator} and {item:CopperComputer} into one working line
AutomationChapter=Automation
ResearchBasicMachines=Open the Research Tree
ResearchBasicMachinesDesc1=Open the research tree with <blue>{key:Journal}</> or the research button on the left bar. The button also shows the time left on the running research.
ResearchBasicMachinesDesc2=Start {research:AutomaticHammer}. The computer produces its research points while it has electricity ; the recipes appear when the research is done.
ObjResearchBasicMachines=Research {research:AutomaticHammer}
ResearchAutomaticMining=Research Automatic Mining
ResearchAutomaticMiningDesc1={research:Automatization} unlocks the machines that move items between devices. {research:AutomaticMining} requires it and unlocks the {item:CopperDrillingRig}, which mines ore automatically.
ResearchAutomaticMiningDesc2=Select {research:Automatization} and press <blue>Start Research</>, then do the same for {research:AutomaticMining}. Both go into the queue, and computers research them in order. Keep fuel in the furnace until both are complete. Learn more: {tips:Research}.
ObjResearchAutomatization=Research {research:Automatization}
ObjResearchAutomaticMining=Research {research:AutomaticMining}
BuildAutomaticMine=Set Up the Automatic Mine
BuildAutomaticMineDesc1=Find an ore deposit on the map, walk to it and stand a <blue>{item:CopperDrillingRig}</> on it.
BuildAutomaticMineDesc2=Place a <blue>{item:StoneFurnace}</> next to the rig and a <blue>{item:CopperStirlingEngine}</> on it. Connect the engine kinetic output to the rig kinetic input and load fuel into the furnace.
BuildAutomaticMineDesc3=Research {research:Chest} and place a <blue>{item:StoneChest}</> at the rig output side. Mined ore goes into the chest.
ObjPowerDrillingRig=Drive the {item:CopperDrillingRig} from a {item:CopperStirlingEngine} on a fuelled furnace
ObjDockMineChest=Stand a chest against the rig's output side
ObjCraftLineHammer=Craft a {item:CopperAutomaticHammer}
ObjCraftLineSmelter=Craft a {item:StoneSmelter}
ObjCraftLineEngine=Craft {count} × {item:CopperStirlingEngine}
ObjCraftLineFurnaces=Craft {count} × {item:StoneFurnace}
CraftOreMultiplication=Multiply the Ore
CraftOreMultiplicationDesc1=Smelting ore directly gives 1 plate per ore. The {item:CopperAutomaticHammer} crushes ore into impure gravel, and the {item:CopperMacerator} grinds the gravel into ore dust. Each step adds 25% {tips:Productivity}, so the dust smelts into about 1.56 plates per ore.
CraftOreMultiplicationDesc2=One hammer supplies two macerators, and one {item:StoneSmelter} smelts their dust. Dock a {item:CopperStirlingEngine} standing on a {item:StoneFurnace} to the hammer and to each macerator. Stand the smelter on its own furnace. Robot arms carry ore to the hammer, gravel to the macerators and dust to the smelter.
ObjCraftMultiplierMacerators=Craft 2 {item:CopperMacerator}
ObjCraftMultiplierArms=Craft 5 {item:CopperRobotArm}
ResearchCircuits=Research the Circuit
ResearchCircuitsDesc1=The next big step is your own circuit production: {research:CircuitBoard}, {research:Triod}, {research:Circuit}. {research:Constructor} unlocks a machine that crafts hand recipes automatically.
ObjResearchCircuitBoard=Research {research:CircuitBoard}
ObjResearchTriod=Research {research:Triod}
ObjResearchCircuit=Research {research:Circuit}
ObjResearchConstructor=Research {research:Constructor}
SteelChapter=Acél és gőz
AutomateFuel=Több üzemanyag
AutomateFuelDesc1=Automatizáld a kőszén ({item:CoalOre}) kitermelését bányászgéppel ({item:CopperDrillingRig}).
AutomateFuelDesc2=A rönk ({item:Log}) hamarabb elég, mint a kőszén, de automatikus farmon ({item:CopperAutomaticFarm}) folyamatosan termelhető. A farmhoz az {research:AutomaticFarm} kutatás és csövön érkező víz ({item:Water}) kell, víz alatti szivattyúból ({item:CopperPump}) vagy légköri kondenzátorból ({item:CopperAtmosphericCondenser}).
AutomateFuelDesc3=A kokszolókemence ({item:CopperOven}) kőszénből vagy rönkökből kokszot ({item:Coke}) készít. A koksz tovább ég, mint a kőszén vagy a fa.
ObjDrillCoalOre=Bányássz {count} × {item:CoalOre} bányászgépekkel
ObjFarmLogs=Termelés automatikus farmokon: {count} × {item:Log}
MakeCoke=Kokszgyártás
MakeCokeDesc1=A kőkemence ({item:StoneFurnace}) nem ad elég hőt a kokszolókemencének ({item:CopperOven}); használj rézkemencét ({item:CopperFurnace}). A kokszolókemence kőszenet ({item:CoalOre}), annak kavicsát vagy porát dolgozza fel. Bővebben: {tips:Energy}.
MakeCokeDesc2=A rönkökből két lépésben készül koksz: {item:Log} → {item:Coal} → {item:Coke}.
MakeCokeDesc3=A kemence kreozotot ({item:Creosote}) is termel, és leáll, ha az nem tud távozni. A folyadékkimenethez csatlakozó cső vagy egy szivattyú ({item:CopperPump}) folyadékégető kemencébe ({item:CopperFluidFurnace}) vezetheti elégetésre, vagy újrahasznosítóba ({item:CopperDestroyer}) megsemmisítésre.
ObjProduceCoke=Készíts {count} × {item:Coke}
MineIron=Vasbányászat
MineIronDesc1=Az acélhoz szükséges vas magnetitércből ({item:MagnetiteOre}) vagy piritércből ({item:PyriteOre}) nyerhető ki.
MineIronDesc2=Az érc közvetlenül vaslemezzé ({item:IronPlate}) olvasztható. Az automatikus kalapácsok és az őrlőgépek növelik a kihozatalt.
ObjSmeltIronPlate=Olvassz {count} × {item:IronPlate}
SmeltSteel=Az első acél
SmeltSteelDesc1=A nagyolvasztó ({item:CopperBlastFurnace}) vaslemezből ({item:IronPlate}) vagy vasporból ({item:IronDust}) és kokszból ({item:Coke}) készít acélt. Külső energiaellátást nem igényel.
ObjSmeltSteelPlate=Olvassz {count} × {item:SteelPlate}
SteamIndustry=Gőzenergia
SteamIndustryDesc1=Szükséges kutatások: {research:Boiler} és {research:SteamEngine}. A kazán ({item:SteelBoiler}) <red>hővel</> alakítja a vizet ({item:Water}) gőzzé ({item:Steam}). A gőzgép ({item:SteelSteamEngine}) ezt <yellow>mozgási energiává</> alakítja.
SteamIndustryDesc2=A gőz veszteség nélkül halad a folyadékcsövekben, és folyadéktartályokban tárolható.
ObjResearchBoiler=Kutatás: {research:Boiler}
ObjResearchSteamEngine=Kutatás: {research:SteamEngine}
ObjResearchResistor=Kutatás: {research:Resistor}
ObjResearchAdvancedCircuit=Kutatás: {research:AdvancedCircuit}
AdvancedCircuits=Fejlett áramkörök
AdvancedCircuitsDesc1=Recept: 1 × {item:CircuitBoard} + 2 × {item:Resistor} + 3 × {item:Circuit} → 1 × {item:AdvancedCircuit}. Az alapáramköröket a meglévő gyártósorod is biztosíthatja.
AdvancedCircuitsDesc2=Ellenállás: 1 × {item:CoalDust} + 4 × {item:CopperWire}. Az ellenállások növelik a rézhuzaligényt; rézhuzalra a triódákhoz is szükség van.
AdvancedCircuitsDesc3=A {research:Dynamo} kutatás feloldja az acélszámítógépet ({item:SteelComputer}). Fejlett áramkörökkel másodpercenként 100 kutatási pontot termel.
ObjResearchDistributedComputing1=Kutatás: {research:Dynamo}
ObjProduceAdvancedCircuit=Készíts {count} × {item:AdvancedCircuit} gépgyártókban
ResearchAluminium=Alumíniumgyártás feloldása
ResearchAluminiumDesc1=Az elektrolizátor ({item:SteelElectrolyzer}) alumíniumport készít, az ívkohó ({item:SteelArcSmelter}) pedig lemezzé olvasztja. Mindkettő árammal működik. Az {milestone:Aluminium} minden kísérlete egy elektrolizátort ({item:SteelElectrolyzer}) és egy szeparátort ({item:SteelSeparator}) használ fel.
AluminiumChapter=Alumínium
MineAluminiumOre=Alumíniumérc bányászata
MineAluminiumOreDesc1=Az alumínium alapanyaga bauxitérc ({item:BauxiteOre}) vagy rubinérc ({item:RubyOre}).
ObjDrillAluminiumOre=Bányássz {count} × {item:BauxiteOre} vagy {item:RubyOre} bányászgépekkel
ProcessAluminiumOre=Alumíniumérc feldolgozása
ProcessAluminiumOreDesc1=Az alumíniumérc olvasztásakor bauxitpor ({item:BauxiteDust}) vagy rubinpor ({item:RubyDust}) keletkezik.
ProcessAluminiumOreDesc2=Aprítás nélkül a teljes feldolgozás két egység ércből nagyjából egy alumíniumlemezt ad. Az automatikus kalapácsok és az őrlőgépek növelik a kihozatalt. A kohó ércet, kavicsot és ércport is fogad; a szétválasztó ({item:SteelSeparator}) csak ércport.
ObjProduceAluminiumOreDust=Készíts {count} × {item:BauxiteDust} vagy {item:RubyDust}
Electrolysis=Elektrolízis
ElectrolysisDesc1=Az elektrolizátor ({item:SteelElectrolyzer}) bauxitporból ({item:BauxiteDust}) vagy rubinporból ({item:RubyDust}) alumínium-oxid-port ({item:AluminiumOxideDust}) állít elő. Újabb elektrolízissel ebből alumíniumpor ({item:AluminiumDust}) lesz.
ElectrolysisDesc2=Az első lépésben oxigén ({item:Oxygen}) is keletkezik, továbbá bauxitból titán-oxid-por ({item:TitaniumOxideDust}), rubinból krómpor ({item:ChromiumDust}). Az elektrolizátor leáll, ha az oxigént nem vezetik el. Cső vagy szivattyú ({item:CopperPump}) juttathatja az újrahasznosítóba ({item:CopperDestroyer}).
ElectrolysisDesc3=A betöltő ({item:CopperLoader}) minden tárgyat kivesz a kimeneti helyekről. A válogató ({item:SteelSorter}) az oxidot az elektrolízis második lépésére küldi, a melléktermékeket pedig tárgyraktárba ({item:CopperItemRack}) vagy az újrahasznosítóba.
ObjProduceAluminiumDust=Készíts {count} × {item:AluminiumDust}
