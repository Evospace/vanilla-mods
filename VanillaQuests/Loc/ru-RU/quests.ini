[quests]
OreToPowerChapter=От руды к энергии
Welcome=Добро пожаловать в Evospace
WelcomeDesc1=Мультитулом можно добывать руду и камень, а также рубить деревья. Для этого удерживайте <blue>{key:ActionPrimary}</>.
WelcomeDesc2=Откройте журнал заданий клавишей <blue>{key:QuestBook}</>, а карту — клавишей <blue>{key:ToggleMap}</>.
WelcomeDesc3=Выберите предмет клавишей панели быстрого доступа: <blue>{key:ActiveSlot1}</> — мультитул, <blue>{key:ActiveSlot2}</> — {item:BasicPlatform}. Используйте выбранный предмет с помощью <blue>{key:ActionPrimary}</>.
WelcomeDesc4=Инвентарь открывается клавишей <blue>{key:ToggleInventory}</>: по клику предмет берётся в руку.
ObjOpenQuestBook=Открыть журнал заданий клавишей {key:QuestBook}
ObjReturnToWorld=Вернуться в мир
GatherCopperOre=Добыча медной руды
GatherCopperOreDesc=Медная руда выходит на поверхность. Добывается мультитулом.
GatherCopperOreDesc2=Ближнее месторождение показывает компас наверху экрана, а карта (<blue>{key:ToggleMap}</>) отмечает месторождения вокруг.
ObjGatherCopperOre=Добыть {count} × {item:ChalcopyriteOre} или {item:MalachiteOre}
GatherFuel=Добыча топлива
GatherFuelDesc=Уголь добывается как руда, брёвна — с деревьев. Печь сжигает и то, и другое.
ObjGatherCoal=Добыть {count} × {item:CoalOre}
ObjGatherLogs=Добыть {count} × {item:Log}
OpenInventory=Открыть инвентарь
OpenInventoryDesc1=Инвентарь открывается клавишей <blue>{key:ToggleInventory}</>. Слева — ваш инвентарь, справа — база предметов.
OpenInventoryDesc2=Предмет находится в базе и заказывается оттуда. Та же клавиша закрывает окно.
ObjOpenInventory=Открыть инвентарь клавишей {key:ToggleInventory}
ItemDatabase=База предметов
ItemDatabaseDesc1=Число на значке показывает, сколько предметов можно создать из материалов в инвентаре. Подробнее: {tips:ItemDatabase}.
ItemDatabaseDesc2=Рецепты предмета под курсором открываются клавишей <blue>{key:Recipe}</>. Подробнее: {tips:Recipes}.
ObjRecipesStoneFurnace=Открыть рецепты ({key:Recipe}): {item:StoneFurnace}
MineStone=Добыча камня
MineStoneDesc={item:StoneSurface} добывается мультитулом из скал, валунов и обрывов.
ObjMineStone=Добыть {count} × {item:StoneSurface}
ReturnHome=Назад на базу
ReturnHomeDesc1=Отнесите руду обратно к точке старта.
ReturnHomeDesc2=Компас наверху экрана указывает на точку старта, а <blue>{key:Escape}</> открывает меню с телепортом на базу.
ObjReturnHome=Вернуться к точке старта
BuildPlatforms=Расширить платформу
BuildPlatformsDesc1=Откройте окно декора клавишей <blue>{key:Decor}</>. Здесь собраны платформы, кирпичи, стекло и другие строительные блоки. Нажмите на блок, чтобы взять его в руку. Для строительства расходуется {item:BuildingMaterial}.
BuildPlatformsDesc2=Расширьте стартовую площадку, чтобы хватило места для машин. Одна {item:BasicPlatform} стоит одну единицу строительного материала. Если разобрать платформу мультитулом, материал вернётся.
BuildPlatformsDesc3=Создайте строительный материал в инвентаре (<blue>{key:ToggleInventory}</>). Рецепт: 1 × {item:StoneSurface} → 1 × {item:BuildingMaterial}.
ObjOpenDecor=Открыть окно декора клавишей {key:Decor}
ObjBuildPlatforms=Построить {count} × {item:BasicPlatform}
ObjOrderBuildingMaterial=Создать {count} × {item:BuildingMaterial}
CraftFirstBlocks=Создать печи и плавильню
CraftFirstBlocksDesc=Создайте 2 × {item:StoneFurnace} и 1 × {item:StoneSmelter}. Используйте 1 печь для нагрева плавильни, а другую — для электростанции.
CraftFirstBlocksDesc2=Левый клик по предмету в базе ставит в очередь одну штуку. <blue>Shift</> + левый клик — сколько позволяют материалы, но не больше одной стопки. Подробнее: {tips:CraftQueue}.
ObjCraftStoneFurnace=Создать {count} × {item:StoneFurnace}
ObjCraftStoneSmelter=Создать {count} × {item:StoneSmelter}
PinToHotbar=Закрепить на панели быстрого доступа
PinToHotbarDesc1=Нажмите на печь в инвентаре, затем на свободный слот панели быстрого доступа. Теперь её можно выбрать клавишей этого слота.
PinToHotbarDesc2=Правый клик по слоту очищает его.
ObjPinToHotbar=Закрепить {item:StoneFurnace} или {item:StoneSmelter} на панели быстрого доступа
BuildFirstSmelter=Построить первую плавильню
BuildFirstSmelterDesc1=Выберите место, вокруг которого достаточно свободного пространства.
BuildFirstSmelterDesc2=Поставьте {item:StoneFurnace}. Выберите «{item:StoneSmelter}» и наведите прицел на печь, чтобы совместить тепловой вход плавильни с тепловым выходом печи, затем установите плавильню. Подробнее о режимах строительства: {tips:BuildingModes}.
ObjBuildStoneFurnace=Построить {item:StoneFurnace}
ObjStackStoneSmelter=Поставить {item:StoneSmelter} на {item:StoneFurnace}
SmeltCopperPlates=Выплавить медь
SmeltCopperPlatesDesc1=Загрузите топливо в печь ({item:StoneFurnace}), а медную руду — в плавильню ({item:StoneSmelter}).
SmeltCopperPlatesDesc2=Заберите медные пластины из выходных слотов плавильни. Оставляйте в них свободное место, чтобы плавка продолжалась.
ObjSmeltCopperPlates=Выплавить {count} × {item:CopperPlate}
CraftMachines=От тепла к исследованиям
CraftMachinesDesc=Создайте {item:CopperStirlingEngine}, {item:CopperCompactGenerator} и {item:CopperComputer}.
ObjCraftStirlingEngine=Создать {count} × {item:CopperStirlingEngine}
ObjCraftCompactGenerator=Создать {count} × {item:CopperCompactGenerator}
ObjCraftComputer=Создать {count} × {item:CopperComputer}
BuildFirstPowerPlant=Построить электростанцию
BuildFirstPowerPlantDesc1=Поставьте вторую {item:StoneFurnace}. Пристыкуйте к ней {item:CopperStirlingEngine}, к двигателю — {item:CopperCompactGenerator}, а к генератору — {item:CopperComputer}.
BuildFirstPowerPlantDesc2=<blue>{key:ActionRotate}</> переключает положения стыковки. Подробнее: {tips:Energy}.
ObjBuildPowerPlant=Соединить печь, {item:CopperStirlingEngine}, {item:CopperCompactGenerator} и {item:CopperComputer}
StartPowerPlant=Запустить электростанцию
StartPowerPlantDesc1=Загрузите топливо в печь электростанции. Проверьте, что двигатель, генератор и компьютер получают энергию. Подробнее: {tips:Energy}.
StartPowerPlantDesc2=Если компьютер не получает питание, откройте подсказку {tips:NoPower}.
ObjPlantFurnace=Разжечь печь
ObjPlantEngine=Запустить двигатель: {item:CopperStirlingEngine}
ObjPlantGenerator=Получить электричество: {item:CopperCompactGenerator}
ObjPlantComputer=Подать питание: {item:CopperComputer}
AutomationChapter=Автоматизация
RunExperiments=Микроэлектроника в лаборатории
RunExperimentsDesc1=Откройте «{experiment:Transistor}» в дереве исследований и нажмите «Начать исследование». Опыты ставит {item:CopperResearchLaboratory}.
RunExperimentsDesc2=Загрузите в лабораторию {item:Circuit} и {item:CopperWire}. После опытов компьютеры смогут исследовать «{research:Resistor}».
BuildEngineeringLaboratory=Построить исследовательскую лабораторию
BuildEngineeringLaboratoryDesc1=Исследуйте «{research:ResearchLaboratory}». Создайте {item:CopperResearchLaboratory} и поставьте её.
BuildEngineeringLaboratoryDesc2=Электричество подводится к задней стороне лаборатории. Подробнее: {tips:Energy}.
ObjResearchEngineeringLaboratory=Исследовать {research:ResearchLaboratory}
ObjCraftEngineeringLaboratory=Создать {count} × {item:CopperResearchLaboratory}
ObjBuildEngineeringLaboratory=Поставить {item:CopperResearchLaboratory}
RunSteelExperiments=Сталь в лаборатории
RunSteelExperimentsDesc1=Откройте «{experiment:Steel}» в дереве исследований и нажмите «Начать исследование». Опыты ставит {item:CopperResearchLaboratory}.
RunSteelExperimentsDesc2=Загрузите в лабораторию {item:Triod}, {item:CopperPipe} и {item:CopperConveyor}. После опытов компьютеры смогут исследовать «{research:SteelProduction}» — оно открывает {item:CopperBlastFurnace}.
ObjRunSteelExperiments=Провести {count} опытов «{experiment:Steel}»
ResearchBasicMachines=Открыть дерево исследований
ResearchBasicMachinesDesc1=Дерево исследований открывается клавишей <blue>{key:Journal}</> или кнопкой исследований на левой панели. На кнопке видно время до конца текущего исследования.
ResearchBasicMachinesDesc2=Запустите исследование «{research:AutomaticHammer}». Компьютер производит очки исследований, пока получает электричество. Завершение исследования открывает рецепты.
ObjResearchBasicMachines=Исследовать {research:AutomaticHammer} ({key:Journal})
ObjOpenResearch=Открыть дерево исследований клавишей {key:Journal}
ResearchAutomaticMining=Исследовать автоматическую добычу
ResearchAutomaticMiningDesc1={research:Automatization} открывает машины, которые перемещают предметы между устройствами. После неё можно исследовать «{research:AutomaticMining}». Это исследование открывает бурильную установку ({item:CopperDrillingRig}), которая автоматически добывает руду.
ResearchAutomaticMiningDesc2=Выберите «{research:Automatization}» и нажмите «Начать исследование», затем то же для «{research:AutomaticMining}». Оба встанут в очередь, и компьютеры исследуют их по порядку. Поддерживайте запас топлива в печи, пока оба исследования не завершатся. Подробнее: {tips:Research}.
ObjResearchAutomatization=Исследовать {research:Automatization}
ObjResearchAutomaticMining=Исследовать {research:AutomaticMining}
BuildPortalFoundation=Заложить фундамент портала
BuildPortalFoundationDesc1=Поставьте портал ({item:Portal}) из инвентаря. Он занимает 8 × 8 блоков.
BuildPortalFoundationDesc2=Откройте портал и загрузите в его ячейки {item:BuildingMaterial} и {item:StoneSurface}.
ObjBuildPortalFoundation=Заполнить ячейки портала
BuildAutomaticMine=Наладить автоматическую шахту
BuildAutomaticMineDesc1=Найдите месторождение руды на карте и доберитесь до него. Поставьте бурильную установку ({item:CopperDrillingRig}) рядом с месторождением. Подсказка при размещении покажет, какую руду она будет добывать.
BuildAutomaticMineDesc2=Пристыкуйте {item:CopperStirlingEngine} к кинетическому входу установленной бурильной установки. Затем поставьте {item:StoneFurnace} под двигатель, совместив тепловой выход печи с тепловым входом двигателя. Загрузите топливо в печь.
BuildAutomaticMineDesc3=Создайте {item:StoneChest} и поставьте его вплотную к выходу предметов бурильной установки. Добытая руда будет автоматически поступать в сундук.
ObjPowerDrillingRig=Запитать {item:CopperDrillingRig} от {item:CopperStirlingEngine} и {item:StoneFurnace}
ObjDockMineChest=Поставить сундук к выходной грани установки
ObjResearchMacerator=Исследовать {research:Macerator}
ObjCraftLineHammer=Создать {count} × {item:CopperAutomaticHammer}
ObjCraftLineSmelter=Создать {count} × {item:StoneSmelter}
ObjCraftLineEngine=Создать {count} × {item:CopperStirlingEngine}
ObjCraftLineFurnaces=Создать {count} × {item:StoneFurnace}
CraftOreMultiplication=Подготовить линию переработки руды
CraftOreMultiplicationDesc1=При прямой плавке из 1 единицы руды получается 1 пластина. {item:CopperAutomaticHammer} дробит руду в неочищенный гравий, {item:CopperMacerator} измельчает гравий в рудную пыль. Каждый шаг добавляет 25% продуктивности ({tips:Productivity}), поэтому после плавки пыли выходит в среднем 1,56 пластины на 1 единицу руды.
CraftOreMultiplicationDesc2=Одного автомолота хватает на 2 измельчителя, а их пыль переплавляет одна плавильня ({item:StoneSmelter}). Пристыкуйте к молоту и к каждому измельчителю {item:CopperStirlingEngine}, стоящий на печи ({item:StoneFurnace}). Плавильню поставьте на отдельную печь. Роборуки подают руду в молот, гравий в измельчители и пыль в плавильню.
ObjCraftMultiplierMacerators=Создать {count} × {item:CopperMacerator}
ObjCraftMultiplierArms=Создать {count} × {item:CopperRobotArm}
RunOreProcessingLine=Запустить линию переработки руды
RunOreProcessingLineDesc1=Расставьте машины, соедините их роборуками, заправьте печи и подайте руду в молот.
ObjSmeltOreDust=Переплавить {count} рудной пыли в пластины
ResearchCircuits=Исследовать микросхему
ResearchCircuitsDesc1=Исследуйте «{research:CircuitBoard}», «{research:Triod}» и «{research:Circuit}», чтобы открыть производство микросхем. Исследование «{research:Constructor}» открывает машину, которая автоматически изготавливает предметы по рецептам ручного крафта.
ObjResearchCircuitBoard=Исследовать {research:CircuitBoard}
ObjResearchTriod=Исследовать {research:Triod}
ObjResearchCircuit=Исследовать {research:Circuit}
ObjResearchConstructor=Исследовать {research:Constructor}
CircuitsChapter=Производство микросхем
BuildConstructor=Запустить конструктор
BuildConstructorDesc1={item:CopperConstructor} автоматически изготавливает предметы по рецептам ручного крафта. Откройте его окно, выберите рецепт «{item:CopperWire}» и загрузите медные пластины ({item:CopperPlate}) во входной слот. Подробнее: {tips:Constructor}.
ObjCraftConstructor=Создать {count} × {item:CopperConstructor}
ObjBuildConstructor=Построить {item:CopperConstructor}
ObjProduceCopperWire=Сделать в конструкторе {count} × {item:CopperWire}
SmeltGlass=Выплавить стекло
SmeltGlassDesc=Для изготовления триодов ({item:Triod}) нужно стекло ({item:Glass}). Добудьте песок ({item:SandSurface}) мультитулом и переплавьте его в каменной плавильне ({item:StoneSmelter}).
ObjMineSand=Добыть {count} × {item:SandSurface}
ObjSmeltGlass=Выплавить {count} × {item:Glass}
MachineCircuits=Линия микросхем
MachineCircuitsDesc1=Рецепт микросхемы: 1 × {item:CircuitBoard} + 3 × {item:Triod} → 1 × {item:Circuit}. Для изготовления этих триодов нужны 3 × {item:Glass} и 9 × {item:CopperWire}.
MachineCircuitsDesc2=Выделите отдельные конструкторы для каждого рецепта и переносите компоненты между ними манипуляторами ({item:CopperRobotArm}). Сколько конструкторов нужно для каждого компонента, описано в подсказке {tips:Constructor}.
ObjProduceTriod=Сделать в конструкторах {count} × {item:Triod}
ObjProduceCircuit=Сделать в конструкторах {count} × {item:Circuit}
BuildRadio=Запустить радио
BuildRadioDesc1=Исследуйте «{research:Radio}» в дереве исследований (<blue>{key:Journal}</>). Создайте {item:CopperRadio}, поставьте его и подведите электричество к задней стороне.
ObjBuildRadio=Подать питание: {item:CopperRadio}
BoostResearch=Ускорить исследования
BoostResearchDesc1={item:CopperComputer} имеет слот на 3 микросхемы ({item:Circuit}). Каждая микросхема на 30 секунд увеличивает скорость исследований с 1 до 10 очков в секунду.
BoostResearchDesc2=Подавайте микросхемы из конструктора в компьютер с помощью манипулятора ({item:CopperRobotArm}). Добавляйте исследования в очередь, чтобы компьютер продолжал расходовать микросхемы и производить очки исследований. Подробнее: {tips:Research}.
ObjBoostComputer=Израсходовать в компьютерах {count} × {item:Circuit}
ObjResearchSteelProduction=Исследовать {research:SteelProduction}
SteelChapter=Сталь и пар
AutomateFuel=Нужно больше топлива
AutomateFuelDesc1=Автоматизируйте добычу угля ({item:CoalOre}) бурильной установкой ({item:CopperDrillingRig}).
AutomateFuelDesc2=Брёвна ({item:Log}) сгорают быстрее угольной руды, зато их можно получать на автоферме ({item:CopperAutomaticFarm}) из исследования «{research:AutomaticFarm}». Ферме нужна вода ({item:Water}) по трубе от погружённой помпы ({item:CopperPump}) или атмосферного конденсатора ({item:CopperAtmosphericCondenser}).
AutomateFuelDesc3=В коксовой печи ({item:CopperOven}) из угольной руды или брёвен получают кокс ({item:Coke}). Он горит дольше исходного топлива.
ObjDrillCoalOre=Добыть бурильными установками {count} × {item:CoalOre}
ObjFarmLogs=Вырастить на автофермах {count} × {item:Log}
MakeCoke=Угольный кокс
MakeCokeDesc1=Коксовой печи ({item:CopperOven}) нужно больше тепла, чем даёт каменная ({item:StoneFurnace}): используйте медную ({item:CopperFurnace}). Сырьё — угольная руда ({item:CoalOre}), её гравий или пыль. Подробнее: {tips:Energy}.
MakeCokeDesc2=Из брёвен кокс получают в два этапа: {item:Log} → {item:Coal} → {item:Coke}.
MakeCokeDesc3=При переработке выделяется креозот ({item:Creosote}). Без отвода жидкости печь останавливается. Труба на жидкостном выходе или помпа ({item:CopperPump}) отводит его в жидкостную печь ({item:CopperFluidFurnace}) для сжигания или в утилизатор ({item:CopperDestroyer}).
ObjProduceCoke=Сделать {count} × {item:Coke}
MineIron=Добыча железа
MineIronDesc1=Железо для стали получают из магнетитовой ({item:MagnetiteOre}) или пиритовой руды ({item:PyriteOre}).
MineIronDesc2=Руду можно сразу переплавить в железные пластины ({item:IronPlate}). Автомолот и измельчитель увеличивают выход пластин.
ObjSmeltIronPlate=Выплавить {count} × {item:IronPlate}
SmeltSteel=Первая сталь
SmeltSteelDesc1=Доменная печь ({item:CopperBlastFurnace}) выплавляет сталь из кокса ({item:Coke}) и железных пластин ({item:IronPlate}) или железной пыли ({item:IronDust}). Внешнее питание не требуется.
ObjSmeltSteelPlate=Выплавить {count} × {item:SteelPlate}
RunSteamExperiments=Пар в лаборатории
RunSteamExperimentsDesc1=Откройте «{experiment:Steam}» в дереве исследований и нажмите «Начать исследование». Опыты ставит {item:CopperResearchLaboratory}.
RunSteamExperimentsDesc2=Загрузите в лабораторию {item:CopperPump} и {item:SteelPipe}. После опытов компьютеры смогут исследовать «{research:Boiler}».
ObjRunSteamExperiments=Провести {count} опытов «{experiment:Steam}»
SteamIndustry=Паровая индустриализация
SteamIndustryDesc1=Нужны исследования «{research:Boiler}» и «{research:SteamEngine}». Бойлер ({item:SteelBoiler}) превращает <red>тепло</> и воду ({item:Water}) в пар ({item:Steam}). Паровой двигатель ({item:SteelSteamEngine}) превращает пар в <yellow>кинетику</>.
SteamIndustryDesc2=Пар идёт по жидкостным трубам без потерь и хранится в жидкостных контейнерах.
ObjResearchBoiler=Исследовать {research:Boiler}
ObjResearchSteamEngine=Исследовать {research:SteamEngine}
ObjResearchResistor=Исследовать {research:Resistor}
ObjResearchAdvancedCircuit=Исследовать {research:AdvancedCircuit}
RunElectricityExperiments=Электричество в лаборатории
RunElectricityExperimentsDesc1=Откройте «{experiment:Electricity}» в дереве исследований и нажмите «Начать исследование». Опыты ставит {item:CopperResearchLaboratory}.
RunElectricityExperimentsDesc2=Загрузите в лабораторию {item:SteelBoiler} и {item:SteelSteamEngine}. После опытов компьютеры смогут исследовать «{research:BasicCoil}».
ObjRunElectricityExperiments=Провести {count} опытов «{experiment:Electricity}»
ObjResearchBasicCoil=Исследовать {research:BasicCoil}
AdvancedCircuits=Продвинутые микросхемы
AdvancedCircuitsDesc1=Рецепт: 1 × {item:CircuitBoard} + 2 × {item:Resistor} + 3 × {item:Circuit} → 1 × {item:AdvancedCircuit}. Обычные микросхемы можно брать с существующей линии.
AdvancedCircuitsDesc2=Резистор: 1 × {item:CoalDust} + 4 × {item:CopperWire}. Резисторы увеличат расход медной проволоки, которая нужна и для триодов.
AdvancedCircuitsDesc3=Исследуйте «{research:SteelComputer}». С продвинутыми микросхемами стальной компьютер ({item:SteelComputer}) даёт 100 очков исследований в секунду.
ObjResearchDistributedComputing1=Исследовать {research:SteelComputer}
ObjProduceAdvancedCircuit=Сделать в конструкторах {count} × {item:AdvancedCircuit}
ResearchAluminium=Открыть производство алюминия
ResearchAluminiumDesc1=Электролизер ({item:SteelElectrolyzer}) получает пыль алюминия, а дуговая плавильня ({item:SteelArcSmelter}) переплавляет её в пластины. Оба устройства работают на электричестве. Каждый опыт «{experiment:Aluminium}» расходует электролизер ({item:SteelElectrolyzer}) и сепаратор ({item:SteelSeparator}).
ObjResearchElectrolyzer=Исследовать {research:Electrolyzer}
ObjResearchAdvancedSmelting=Исследовать {research:AdvancedSmelting}
ObjResearchSeparator=Исследовать {research:Separator}
AluminiumChapter=Алюминий
RunAluminiumExperiments=Алюминий в лаборатории
RunAluminiumExperimentsDesc1=Откройте «{experiment:Aluminium}» в дереве исследований и нажмите «Начать исследование». Опыты ставит {item:CopperResearchLaboratory}.
RunAluminiumExperimentsDesc2=Загрузите в лабораторию {item:SteelElectrolyzer} и {item:SteelSeparator}. После опытов компьютеры смогут исследовать «{research:AluminiumReduction}» — оно открывает рецепт пыли алюминия ({item:AluminiumDust}) в электролизере.
ObjRunAluminiumExperiments=Провести {count} опытов «{experiment:Aluminium}»
ObjResearchAluminiumReduction=Исследовать {research:AluminiumReduction}
MineAluminiumOre=Добыча алюминиевой руды
MineAluminiumOreDesc1=Сырьё для алюминия — бокситовая ({item:BauxiteOre}) или рубиновая руда ({item:RubyOre}).
ObjDrillAluminiumOre=Добыть бурильными установками {count} × {item:BauxiteOre} или {item:RubyOre}
ProcessAluminiumOre=Обработка алюминиевой руды
ProcessAluminiumOreDesc1=При плавке алюминиевой руды получается пыль боксита ({item:BauxiteDust}) или рубиновая пыль ({item:RubyDust}).
ProcessAluminiumOreDesc2=Без дробления вся цепочка переработки даёт примерно одну пластину на две единицы руды. Автомолот и измельчитель увеличивают выход. Плавильня принимает руду, гравий и рудную пыль; сепаратор ({item:SteelSeparator}) — только рудную пыль.
ObjProduceAluminiumOreDust=Сделать {count} × {item:BauxiteDust} или {item:RubyDust}
Electrolysis=Электролиз
ElectrolysisDesc1=Электролизер ({item:SteelElectrolyzer}) превращает пыль боксита ({item:BauxiteDust}) или рубиновую пыль ({item:RubyDust}) в пыль оксида алюминия ({item:AluminiumOxideDust}). Второй проход через электролизер превращает оксид в пыль алюминия ({item:AluminiumDust}).
ElectrolysisDesc2=Первый этап даёт также кислород ({item:Oxygen}) и побочный продукт: пыль оксида титана ({item:TitaniumOxideDust}) из боксита или пыль хрома ({item:ChromiumDust}) из рубина. Без отвода кислорода электролизер останавливается. Газ можно направить трубой или помпой ({item:CopperPump}) в утилизатор ({item:CopperDestroyer}).
ElectrolysisDesc3=Погрузчик ({item:CopperLoader}) забирает все предметы из выходных слотов. Сортировщик ({item:SteelSorter}) направляет оксид на второй этап электролиза, а побочные продукты — на полку ({item:CopperItemRack}) или в утилизатор.
ObjProduceAluminiumDust=Сделать {count} × {item:AluminiumDust}
ProcessorResearch=Исследования на процессорах
ProcessorResearchDesc1=Исследуйте «{research:AluminiumComputer}». Каждый процессор ({item:Processor}) в слоте на 30 секунд поднимает скорость исследований до 1000 очков в секунду — вдесятеро больше, чем продвинутая микросхема ({item:AdvancedCircuit}) в стальном компьютере ({item:SteelComputer}).
ProcessorResearchDesc2=Один алюминиевый компьютер с процессорами заменяет десять стальных. В ассемблере каждый процессор требует 2 × {item:Capacitor}: не останавливайте линию конденсаторов, построенную для портала.
ObjResearchAluminiumComputer=Исследовать {research:AluminiumComputer}
ObjBoostProcessor=Израсходовать в компьютерах {count} × {item:Processor}
