[quests]
OreToPowerChapter=От руды к энергии
Welcome=Добро пожаловать в Evospace
WelcomeDesc1=Мультитулом можно добывать руду и камень, а также рубить деревья. Для этого удерживайте <blue>{key:ActionPrimary}</>.
WelcomeDesc2=Откройте журнал заданий клавишей <blue>{key:QuestBook}</>, а карту — клавишей <blue>{key:ToggleMap}</>.
WelcomeDesc3=Выберите предмет клавишей панели быстрого доступа: <blue>{key:ActiveSlot1}</> — мультитул, <blue>{key:ActiveSlot2}</> — {item:BasicPlatform}. Используйте выбранный предмет с помощью <blue>{key:ActionPrimary}</>.
WelcomeDesc4=Инвентарь открывается клавишей <blue>{key:ToggleInventory}</>: по клику предмет берётся в руку.
ObjOpenQuestBook=Открыть журнал заданий клавишей {key:QuestBook}
ObjReturnToWorld=Вернуться в мир
GatherCopperOre=Добыча медной руды
GatherCopperOreDesc=Медная руда выходит на поверхность. Добывается мультитулом.
GatherCopperOreDesc2=Ближнее месторождение показывает компас наверху экрана, а карта (<blue>{key:ToggleMap}</>) отмечает месторождения вокруг.
ObjGatherCopperOre=Добыть {count} × {item:ChalcopyriteOre} или {item:MalachiteOre}
GatherFuel=Добыча топлива
GatherFuelDesc=Уголь добывается как руда, брёвна — с деревьев. Печь сжигает и то, и другое.
ObjGatherCoal=Добыть {count} × {item:CoalOre}
ObjGatherLogs=Добыть {count} × {item:Log}
OpenInventory=Открыть инвентарь
OpenInventoryDesc1=Инвентарь открывается клавишей <blue>{key:ToggleInventory}</>. Слева — ваш инвентарь, справа — база предметов.
OpenInventoryDesc2=Предмет находится в базе и заказывается оттуда. Та же клавиша закрывает окно.
ObjOpenInventory=Открыть инвентарь клавишей {key:ToggleInventory}
ItemDatabase=База предметов
ItemDatabaseDesc1=Число на значке показывает, сколько предметов можно создать из материалов в инвентаре. Подробнее: {tips:ItemDatabase}.
ItemDatabaseDesc2=Рецепты предмета под курсором открываются клавишей <blue>{key:Recipe}</>. Подробнее: {tips:Recipes}.
ObjRecipesStoneFurnace=Открыть рецепты ({key:Recipe}): {item:StoneFurnace}
MineStone=Добыча камня
MineStoneDesc={item:StoneSurface} добывается мультитулом из скал, валунов и обрывов.
ObjMineStone=Добыть {count} × {item:StoneSurface}
ReturnHome=Назад на базу
ReturnHomeDesc1=Отнесите руду на стартовую платформу. На ней находится {item:LandingPad} — она понадобится позже.
ReturnHomeDesc2=Компас наверху экрана указывает на точку старта, а <blue>{key:Escape}</> открывает меню с телепортом на базу.
ObjReturnHome=Вернуться на базу
BuildPlatforms=Расширить платформу
BuildPlatformsDesc1=Откройте окно декора клавишей <blue>{key:Decor}</>. Здесь собраны платформы, кирпичи, стекло и другие строительные блоки. Нажмите на блок, чтобы взять его в руку. Для строительства расходуется {item:BuildingMaterial}.
BuildPlatformsDesc2=Расширьте стартовую площадку, чтобы хватило места для машин. Одна {item:BasicPlatform} стоит одну единицу строительного материала. Если разобрать платформу мультитулом, материал вернётся.
BuildPlatformsDesc3=Создайте строительный материал в инвентаре (<blue>{key:ToggleInventory}</>). Рецепт: 1 × {item:StoneSurface} → 1 × {item:BuildingMaterial}.
ObjOpenDecor=Открыть окно декора клавишей {key:Decor}
ObjBuildPlatforms=Построить {count} × {item:BasicPlatform}
ObjOrderBuildingMaterial=Создать {count} × {item:BuildingMaterial}
CraftFirstBlocks=Создать печи и плавильню
CraftFirstBlocksDesc=Создайте 2 × {item:StoneFurnace} и 1 × {item:StoneSmelter}. Используйте 1 печь для нагрева плавильни, а другую — для электростанции.
CraftFirstBlocksDesc2=Левый клик по предмету в базе ставит в очередь одну штуку. <blue>Shift</> + левый клик — сколько позволяют материалы, но не больше одной стопки. Подробнее: {tips:CraftQueue}.
ObjCraftStoneFurnace=Создать {count} × {item:StoneFurnace}
ObjCraftStoneSmelter=Создать {count} × {item:StoneSmelter}
PinToHotbar=Закрепить на панели быстрого доступа
PinToHotbarDesc1=Нажмите на печь в инвентаре, затем на свободный слот панели быстрого доступа. Теперь её можно выбрать клавишей этого слота.
PinToHotbarDesc2=Правый клик по слоту очищает его.
ObjPinToHotbar=Закрепить {item:StoneFurnace} или {item:StoneSmelter} на панели быстрого доступа
BuildFirstSmelter=Построить первую плавильню
BuildFirstSmelterDesc1=Выберите место, вокруг которого достаточно свободного пространства.
BuildFirstSmelterDesc2=Поставьте {item:StoneFurnace}. Выберите «{item:StoneSmelter}» и наведите прицел на печь, чтобы совместить тепловой вход плавильни с тепловым выходом печи, затем установите плавильню. Подробнее о режимах строительства: {tips:BuildingModes}.
ObjBuildStoneFurnace=Построить {item:StoneFurnace}
ObjStackStoneSmelter=Поставить {item:StoneSmelter} на {item:StoneFurnace}
SmeltCopperPlates=Выплавить медь
SmeltCopperPlatesDesc1=Загрузите топливо в печь ({item:StoneFurnace}), а медную руду — в плавильню ({item:StoneSmelter}).
SmeltCopperPlatesDesc2=Заберите медные пластины из выходных слотов плавильни. Оставляйте в них свободное место, чтобы плавка продолжалась.
ObjSmeltCopperPlates=Выплавить {count} × {item:CopperPlate}
CraftMachines=От тепла к исследованиям
CraftMachinesDesc=Создайте {item:CopperStirlingEngine}, {item:CopperCompactGenerator} и {item:CopperComputer}.
ObjCraftStirlingEngine=Создать {count} × {item:CopperStirlingEngine}
ObjCraftCompactGenerator=Создать {count} × {item:CopperCompactGenerator}
ObjCraftComputer=Создать {count} × {item:CopperComputer}
BuildFirstPowerPlant=Построить электростанцию
BuildFirstPowerPlantDesc1=Поставьте вторую {item:StoneFurnace}. Пристыкуйте к ней {item:CopperStirlingEngine}, к двигателю — {item:CopperCompactGenerator}, а к генератору — {item:CopperComputer}.
BuildFirstPowerPlantDesc2=<blue>{key:ActionRotate}</> переключает положения стыковки. Подробнее: {tips:Energy}.
ObjBuildPowerPlant=Соединить печь, {item:CopperStirlingEngine}, {item:CopperCompactGenerator} и {item:CopperComputer}
StartPowerPlant=Запустить электростанцию
StartPowerPlantDesc1=Загрузите топливо в печь электростанции. Проверьте, что двигатель, генератор и компьютер получают энергию. Подробнее: {tips:Energy}.
StartPowerPlantDesc2=Если компьютер не получает питание, откройте подсказку {tips:NoPower}.
ObjPlantFurnace=Разжечь печь
ObjPlantEngine=Запустить двигатель: {item:CopperStirlingEngine}
ObjPlantGenerator=Получить электричество: {item:CopperCompactGenerator}
ObjPlantComputer=Подать питание: {item:CopperComputer}
AutomationChapter=Автоматизация
ResearchBasicMachines=Открыть дерево исследований
ResearchBasicMachinesDesc1=Дерево исследований открывается клавишей <blue>{key:Journal}</> или кнопкой исследований на левой панели. На кнопке видно время до конца текущего исследования.
ResearchBasicMachinesDesc2=Запустите исследование «{research:BasicMachines}». Компьютер производит очки исследований, пока получает электричество. Завершение исследования открывает рецепты.
ObjResearchBasicMachines=Исследовать {research:BasicMachines} ({key:Journal})
ObjOpenResearch=Открыть дерево исследований клавишей {key:Journal}
ResearchAutomaticMining=Исследовать автоматическую добычу
ResearchAutomaticMiningDesc1={research:Automatization} открывает машины, которые перемещают предметы между устройствами. После неё можно исследовать «{research:AutomaticMining}». Это исследование открывает бурильную установку ({item:CopperDrillingRig}), которая автоматически добывает руду.
ResearchAutomaticMiningDesc2=Поддерживайте запас топлива в печи, пока оба исследования не завершатся.
ObjResearchAutomatization=Исследовать {research:Automatization}
ObjResearchAutomaticMining=Исследовать {research:AutomaticMining}
BuildAutomaticMine=Наладить автоматическую шахту
BuildAutomaticMineDesc1=Найдите месторождение руды на карте, доберитесь до него и установите на нём бурильную установку ({item:CopperDrillingRig}).
BuildAutomaticMineDesc2=Поставьте {item:StoneFurnace} рядом с бурильной установкой, а на печь — {item:CopperStirlingEngine}. Соедините кинетический выход двигателя с кинетическим входом установки и загрузите топливо в печь.
BuildAutomaticMineDesc3=Создайте {item:StoneChest} и поставьте его вплотную к выходу предметов бурильной установки. Добытая руда будет автоматически поступать в сундук.
ObjPowerDrillingRig=Запитать {item:CopperDrillingRig} от {item:CopperStirlingEngine} и {item:StoneFurnace}
ObjDockMineChest=Поставить сундук к выходной грани установки
ObjCraftLineChests=Создать {count} × {item:StoneChest}
ObjCraftLineHammer=Создать {count} × {item:CopperAutomaticHammer}
ObjCraftLineSmelter=Создать {count} × {item:StoneSmelter}
ObjCraftLineEngine=Создать {count} × {item:CopperStirlingEngine}
ObjCraftLineFurnaces=Создать {count} × {item:StoneFurnace}
CraftOreMultiplication=Подготовить линию переработки руды
CraftOreMultiplicationDesc1=При прямой плавке в плавильне ({item:StoneSmelter}) из 1 единицы руды получается 1 пластина. {item:CopperAutomaticHammer} дробит руду в неочищенный гравий с бонусом продуктивности 50% ({tips:Productivity}). {item:CopperMacerator} превращает этот гравий в рудную пыль с таким же бонусом. После плавки пыли получается в среднем 2,25 пластины на 1 единицу исходной руды.
CraftOreMultiplicationDesc2=Используйте 1 автомолот вместе с 2 измельчителями.
ObjCraftMultiplierMacerators=Создать {count} × {item:CopperMacerator}
ObjCraftMultiplierArms=Создать {count} × {item:CopperRobotArm}
ResearchCircuits=Исследовать микросхему
ResearchCircuitsDesc1=Исследуйте «{research:CircuitBoard}», «{research:Triod}» и «{research:Circuit}», чтобы открыть производство микросхем. Исследование «{research:Constructor}» открывает машину, которая автоматически изготавливает предметы по рецептам ручного крафта.
ObjResearchCircuitBoard=Исследовать {research:CircuitBoard}
ObjResearchTriod=Исследовать {research:Triod}
ObjResearchCircuit=Исследовать {research:Circuit}
ObjResearchConstructor=Исследовать {research:Constructor}
CircuitsChapter=Производство микросхем
BuildConstructor=Запустить конструктор
BuildConstructorDesc1={item:CopperConstructor} автоматически изготавливает предметы по рецептам ручного крафта. Откройте его окно, выберите рецепт «{item:CopperWire}» и загрузите медные пластины ({item:CopperPlate}) во входной слот. Подробнее: {tips:Constructor}.
BuildConstructorDesc2=Конструктору и компьютеру вместе нужны 1,2 кВт, а 1 генератор выдаёт только 1 кВт. Постройте вторую электростанцию, чтобы оба устройства работали на полной скорости. Подробнее: {tips:Energy}.
ObjCraftConstructor=Создать {count} × {item:CopperConstructor}
ObjBuildConstructor=Построить {item:CopperConstructor}
ObjProduceCopperWire=Сделать в конструкторе {count} × {item:CopperWire}
SmeltGlass=Выплавить стекло
SmeltGlassDesc=Для изготовления триодов ({item:Triod}) нужно стекло ({item:Glass}). Добудьте песок ({item:SandSurface}) мультитулом и переплавьте его в каменной плавильне ({item:StoneSmelter}).
ObjMineSand=Добыть {count} × {item:SandSurface}
ObjSmeltGlass=Выплавить {count} × {item:Glass}
MachineCircuits=Линия микросхем
MachineCircuitsDesc1=Рецепт микросхемы: 1 × {item:CircuitBoard} + 3 × {item:Triod} → 1 × {item:Circuit}. Для изготовления этих триодов нужны 3 × {item:Glass} и 9 × {item:CopperWire}.
MachineCircuitsDesc2=Выделите отдельные конструкторы для каждого рецепта и переносите компоненты между ними манипуляторами ({item:CopperRobotArm}). Сколько конструкторов нужно для каждого компонента, описано в подсказке {tips:Constructor}.
ObjProduceTriod=Сделать в конструкторах {count} × {item:Triod}
ObjProduceCircuit=Сделать в конструкторах {count} × {item:Circuit}
BoostResearch=Ускорить исследования
BoostResearchDesc1={item:CopperComputer} имеет слот на 3 микросхемы ({item:Circuit}). Каждая микросхема на 30 секунд увеличивает скорость исследований с 1 до 10 очков в секунду.
BoostResearchDesc2=Подавайте микросхемы из конструктора в компьютер с помощью манипулятора ({item:CopperRobotArm}). Добавляйте исследования в очередь, чтобы компьютер продолжал расходовать микросхемы и производить очки исследований. Подробнее: {tips:Research}.
ObjBoostComputer=Израсходовать в компьютерах {count} × {item:Circuit}
QueueResearch=Очередь исследований
QueueResearchDesc1=Для исследования «{research:SteelProduction}» нужна «{research:Oven}», а для неё — «{research:Furnace}» и «{research:FluidTransfer}». Сначала добавьте в очередь необходимые исследования, затем «Коксовую печь» и «Производство стали». Выбирайте каждое исследование и нажимайте кнопку запуска. Подробнее: {tips:Research}.
QueueResearchDesc2=Компьютеры проходят очередь по порядку. {research:SteelProduction} открывает {item:CopperBlastFurnace} для выплавки стали.
ObjResearchOven=Исследовать {research:Oven}
ObjResearchSteelProduction=Исследовать {research:SteelProduction}
