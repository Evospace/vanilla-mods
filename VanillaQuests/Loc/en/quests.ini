[quests]
OreToPowerChapter=From Ore to Power
Welcome=Welcome to Evospace
WelcomeDesc1=Use the multitool to mine ore and stone and cut down trees. Hold <blue>{key:ActionPrimary}</> to use it.
WelcomeDesc2=Open the quest log with <blue>{key:QuestBook}</> and the map with <blue>{key:ToggleMap}</>.
WelcomeDesc3=Use the hotbar keys to select an item: <blue>{key:ActiveSlot1}</> for the multitool, <blue>{key:ActiveSlot2}</> for the {item:BasicPlatform}. Use the selected item with <blue>{key:ActionPrimary}</>.
WelcomeDesc4=The inventory opens with <blue>{key:ToggleInventory}</>: a click takes an item in hand.
ObjOpenQuestBook=Open the quest log with {key:QuestBook}
ObjReturnToWorld=Return to the world
GatherCopperOre=Gather Copper Ore
GatherCopperOreDesc=Copper ore shows on the surface. Mine it with your multitool.
GatherCopperOreDesc2=A deposit close by shows on the compass at the top of the screen, and the map (<blue>{key:ToggleMap}</>) marks the deposits around you.
ObjGatherCopperOre=Mine {count} × {item:ChalcopyriteOre} or {item:MalachiteOre}
GatherFuel=Gather Fuel
GatherFuelDesc=Mine coal like ore, get logs from trees. A furnace burns both.
ObjGatherCoal=Gather {count} × {item:CoalOre}
ObjGatherLogs=Gather {count} × {item:Log}
OpenInventory=Open Your Inventory
OpenInventoryDesc1=Open your inventory with <blue>{key:ToggleInventory}</>. What you carry is on the left, the item database is on the right.
OpenInventoryDesc2=Find an item in the database and order it. The same key closes the window.
ObjOpenInventory=Open the inventory with {key:ToggleInventory}
ItemDatabase=The Item Database
ItemDatabaseDesc1=The number on an icon shows how many items you can craft with the materials in your inventory. Learn more: {tips:ItemDatabase}.
ItemDatabaseDesc2=Hover over an item and press <blue>{key:Recipe}</> to open its recipes. Learn more: {tips:Recipes}.
ObjRecipesStoneFurnace=Open recipes ({key:Recipe}): {item:StoneFurnace}
MineStone=Gather Stone
MineStoneDesc=Mine {item:StoneSurface} from rocks, boulders and cliff faces with your multitool.
ObjMineStone=Gather {count} × {item:StoneSurface}
ReturnHome=Back to the Base
ReturnHomeDesc1=Bring the ore back to your spawn point.
ReturnHomeDesc2=The compass at the top of the screen points to the spawn, and <blue>{key:Escape}</> opens the menu with Teleport to Home.
ObjReturnHome=Return to the spawn point
BuildPlatforms=Extend the Platform
BuildPlatformsDesc1=Open the decor window with <blue>{key:Decor}</>. It contains platforms, bricks, glass and other building blocks. Click a block to select it. Building uses {item:BuildingMaterial}.
BuildPlatformsDesc2=Extend the starting platform to make room for machines. Each {item:BasicPlatform} costs one building material. Remove a platform with the multitool to get the material back.
BuildPlatformsDesc3=Craft building material in your inventory (<blue>{key:ToggleInventory}</>). Recipe: 1 × {item:StoneSurface} → 1 × {item:BuildingMaterial}.
ObjOpenDecor=Open the decor window with {key:Decor}
ObjBuildPlatforms=Build {count} × {item:BasicPlatform}
ObjOrderBuildingMaterial=Craft {count} × {item:BuildingMaterial}
CraftFirstBlocks=Craft the Furnaces and the Smelter
CraftFirstBlocksDesc=Craft 2 × {item:StoneFurnace} and 1 × {item:StoneSmelter}. Use 1 furnace to heat the smelter and the other for the power plant.
CraftFirstBlocksDesc2=Left-click an item in the database to queue one. <blue>Shift</> + left click queues as many as your materials allow, up to one stack. Learn more: {tips:CraftQueue}.
ObjCraftStoneFurnace=Craft {count} × {item:StoneFurnace}
ObjCraftStoneSmelter=Craft {count} × {item:StoneSmelter}
PinToHotbar=Pin to the Hotbar
PinToHotbarDesc1=Click the furnace in your inventory, then click an empty hotbar slot. Press the slot's key to select the furnace.
PinToHotbarDesc2=A right click on a slot clears it.
ObjPinToHotbar=Pin {item:StoneFurnace} or {item:StoneSmelter} to the hotbar
BuildFirstSmelter=Build Your First Smelter
BuildFirstSmelterDesc1=Choose a place with free space around it.
BuildFirstSmelterDesc2=Place a {item:StoneFurnace}. Select the {item:StoneSmelter} and aim at the furnace to align the smelter's heat input with the furnace's heat output, then place the smelter. Learn about the different building modes: {tips:BuildingModes}.
ObjBuildStoneFurnace=Build a {item:StoneFurnace}
ObjStackStoneSmelter=Place a {item:StoneSmelter} on the {item:StoneFurnace}
SmeltCopperPlates=Smelt Copper
SmeltCopperPlatesDesc1=Load fuel into the {item:StoneFurnace} and copper ore into the {item:StoneSmelter}.
SmeltCopperPlatesDesc2=Collect the copper plates from the smelter's output slots. Keep space available there so smelting can continue.
ObjSmeltCopperPlates=Smelt {count} × {item:CopperPlate}
CraftMachines=From Heat to Research
CraftMachinesDesc=Craft a {item:CopperStirlingEngine}, a {item:CopperCompactGenerator} and a {item:CopperComputer}.
ObjCraftStirlingEngine=Craft {count} × {item:CopperStirlingEngine}
ObjCraftCompactGenerator=Craft {count} × {item:CopperCompactGenerator}
ObjCraftComputer=Craft {count} × {item:CopperComputer}
BuildFirstPowerPlant=Build the Power Plant
BuildFirstPowerPlantDesc1=Place the second {item:StoneFurnace}. Dock the {item:CopperStirlingEngine} onto the furnace, the {item:CopperCompactGenerator} onto the engine and the {item:CopperComputer} onto the generator.
BuildFirstPowerPlantDesc2=<blue>{key:ActionRotate}</> switches between docking positions. Learn more: {tips:Energy}.
ObjBuildPowerPlant=Connect the furnace, {item:CopperStirlingEngine}, {item:CopperCompactGenerator} and {item:CopperComputer}
StartPowerPlant=Start the Power Plant
StartPowerPlantDesc1=Load fuel into the power plant's furnace. Check that the engine, generator and computer receive energy. Learn more: {tips:Energy}.
StartPowerPlantDesc2=If the computer has no power, open the {tips:NoPower} tip.
ObjPlantFurnace=Fire the furnace
ObjPlantEngine=Run the {item:CopperStirlingEngine}
ObjPlantGenerator=Get electricity from the {item:CopperCompactGenerator}
ObjPlantComputer=Power the {item:CopperComputer}
AutomationChapter=Automation
RunExperiments=Microelectronics in the Laboratory
RunExperimentsDesc1=Open {milestone:Transistor} in the research tree and press <blue>Start Research</>. Its experiments run in the {item:CopperResearchLaboratory}.
RunExperimentsDesc2=Load {item:Circuit} and {item:CopperWire} into the laboratory. After the experiments computers can research {research:Resistor}.
BuildEngineeringLaboratory=Build the Research Laboratory
BuildEngineeringLaboratoryDesc1=Research {research:ResearchLaboratory}. Craft the {item:CopperResearchLaboratory} and place it.
BuildEngineeringLaboratoryDesc2=Electricity enters the laboratory at its back side. Learn more: {tips:Energy}.
ObjResearchEngineeringLaboratory=Research {research:ResearchLaboratory}
ObjCraftEngineeringLaboratory=Craft {count} × {item:CopperResearchLaboratory}
ObjBuildEngineeringLaboratory=Place the {item:CopperResearchLaboratory}
RunSteelExperiments=Steel in the Laboratory
RunSteelExperimentsDesc1=Open {milestone:Steel} in the research tree and press <blue>Start Research</>. Its experiments run in the {item:CopperResearchLaboratory}.
RunSteelExperimentsDesc2=Load {item:Triod}, {item:CopperPipe} and {item:CopperConveyor} into the laboratory. After the experiments computers can research {research:SteelProduction}, which unlocks the {item:CopperBlastFurnace}.
ObjRunSteelExperiments=Run {count} experiments of {milestone:Steel}
ResearchBasicMachines=Open the Research Tree
ResearchBasicMachinesDesc1=Open the research tree with <blue>{key:Journal}</> or the research button on the left bar. The button also shows the time left on the running research.
ResearchBasicMachinesDesc2=Start {research:AutomaticHammer}. The computer produces research points while it has electricity. Completing the research unlocks the recipes.
ObjResearchBasicMachines=Research {research:AutomaticHammer} ({key:Journal})
ObjOpenResearch=Open the research tree with {key:Journal}
ResearchAutomaticMining=Research Automatic Mining
ResearchAutomaticMiningDesc1={research:Automatization} unlocks the machines that move items between devices. {research:AutomaticMining} requires it and unlocks the {item:CopperDrillingRig}, which mines ore automatically.
ResearchAutomaticMiningDesc2=Select {research:Automatization} and press <blue>Start Research</>, then do the same for {research:AutomaticMining}. Both go into the queue, and computers research them in order. Keep fuel in the furnace until both are complete. Learn more: {tips:Research}.
ObjResearchAutomatization=Research {research:Automatization}
ObjResearchAutomaticMining=Research {research:AutomaticMining}
BuildPortalFoundation=Lay the Portal Foundation
BuildPortalFoundationDesc1=Place the {item:Portal} from your inventory. It takes 8 × 8 blocks.
BuildPortalFoundationDesc2=Open the portal and load {item:BuildingMaterial} and {item:StoneSurface} into its cells.
ObjBuildPortalFoundation=Fill the cells of the {item:Portal}
BuildAutomaticMine=Set Up the Automatic Mine
BuildAutomaticMineDesc1=Find an ore deposit on the map and travel to it. Place a {item:CopperDrillingRig} near the deposit. The placement tooltip shows which ore the rig will mine.
BuildAutomaticMineDesc2=With the rig in place, dock a {item:CopperStirlingEngine} to its kinetic input. Then place a {item:StoneFurnace} under the engine, connecting the furnace's heat output to the engine's heat input. Load fuel into the furnace.
BuildAutomaticMineDesc3=Craft a {item:StoneChest} and place it against the drilling rig's item output. The rig will transfer mined ore into the chest automatically.
ObjPowerDrillingRig=Power the {item:CopperDrillingRig} from a {item:CopperStirlingEngine} and a {item:StoneFurnace}
ObjDockMineChest=Place a chest at the rig output side
ObjResearchMacerator=Research {research:Macerator}
ObjCraftLineHammer=Craft {count} × {item:CopperAutomaticHammer}
ObjCraftLineSmelter=Craft {count} × {item:StoneSmelter}
ObjCraftLineEngine=Craft {count} × {item:CopperStirlingEngine}
ObjCraftLineFurnaces=Craft {count} × {item:StoneFurnace}
CraftOreMultiplication=Prepare an Ore-Processing Line
CraftOreMultiplicationDesc1=Smelting ore directly gives 1 plate per ore. The {item:CopperAutomaticHammer} crushes ore into impure gravel, and the {item:CopperMacerator} grinds the gravel into ore dust. Each step adds 25% {tips:Productivity}, so the dust smelts into about 1.56 plates per ore.
CraftOreMultiplicationDesc2=One hammer supplies two macerators, and one {item:StoneSmelter} smelts their dust. Dock a {item:CopperStirlingEngine} standing on a {item:StoneFurnace} to the hammer and to each macerator. Stand the smelter on its own furnace. Robot arms carry ore to the hammer, gravel to the macerators and dust to the smelter.
ObjCraftMultiplierMacerators=Craft {count} × {item:CopperMacerator}
ObjCraftMultiplierArms=Craft {count} × {item:CopperRobotArm}
RunOreProcessingLine=Start the Ore-Processing Line
RunOreProcessingLineDesc1=Place the machines, connect them with robot arms, fuel the furnaces and feed ore to the hammer.
ObjSmeltOreDust=Smelt {count} ore dust into plates
ResearchCircuits=Research the Circuit
ResearchCircuitsDesc1=Research {research:CircuitBoard}, {research:Triod} and {research:Circuit} to unlock circuit production. {research:Constructor} unlocks a machine that automatically crafts items using hand-crafting recipes.
ObjResearchCircuitBoard=Research {research:CircuitBoard}
ObjResearchTriod=Research {research:Triod}
ObjResearchCircuit=Research {research:Circuit}
ObjResearchConstructor=Research {research:Constructor}
CircuitsChapter=Circuit Production
BuildConstructor=Start the Constructor
BuildConstructorDesc1=The {item:CopperConstructor} automatically crafts items using hand-crafting recipes. Open its window, select the {item:CopperWire} recipe, then load {item:CopperPlate} into the input slot. Learn more: {tips:Constructor}.
ObjCraftConstructor=Craft {count} × {item:CopperConstructor}
ObjBuildConstructor=Build a {item:CopperConstructor}
ObjProduceCopperWire=Make {count} × {item:CopperWire} in a constructor
SmeltGlass=Smelt Glass
SmeltGlassDesc=Crafting a {item:Triod} requires {item:Glass}. Mine {item:SandSurface} with the multitool and smelt it in a {item:StoneSmelter} to make glass.
ObjMineSand=Gather {count} × {item:SandSurface}
ObjSmeltGlass=Smelt {count} × {item:Glass}
MachineCircuits=Circuit Line
MachineCircuitsDesc1=Each {item:Circuit} requires 1 × {item:CircuitBoard} and 3 × {item:Triod}. Making those triodes takes 3 × {item:Glass} and 9 × {item:CopperWire}.
MachineCircuitsDesc2=Use separate constructors for each recipe and {item:CopperRobotArm} units to transfer components between them. See {tips:Constructor} for the number of constructors needed for each component.
ObjProduceTriod=Make {count} × {item:Triod} in constructors
ObjProduceCircuit=Make {count} × {item:Circuit} in constructors
BuildRadio=Start the Radio
BuildRadioDesc1=Research {research:Radio} in the research tree (<blue>{key:Journal}</>). Craft the {item:CopperRadio}, place it and connect electricity to its back side.
ObjBuildRadio=Power the {item:CopperRadio}
BoostResearch=Boost the Research
BoostResearchDesc1=The {item:CopperComputer}'s circuit slot holds 3 × {item:Circuit}. Each circuit increases its research rate from 1 to 10 points per second for 30 seconds.
BoostResearchDesc2=Use a {item:CopperRobotArm} to transfer circuits from the constructor to the computer. Keep research projects queued so the computer continues consuming circuits and producing research points. Learn more: {tips:Research}.
ObjBoostComputer=Have computers consume {count} × {item:Circuit}
ObjResearchSteelProduction=Research {research:SteelProduction}
SteelChapter=Steel and Steam
AutomateFuel=More Fuel
AutomateFuelDesc1=Automate {item:CoalOre} mining with a {item:CopperDrillingRig}.
AutomateFuelDesc2=A {item:Log} burns faster than coal ore, but a {item:CopperAutomaticFarm} provides a renewable supply. The farm is unlocked by {research:AutomaticFarm} and needs {item:Water} piped from a submerged {item:CopperPump} or a {item:CopperAtmosphericCondenser}.
AutomateFuelDesc3=A {item:CopperOven} processes coal ore or logs into {item:Coke}, which burns longer than either fuel.
ObjDrillCoalOre=Mine {count} × {item:CoalOre} with drilling rigs
ObjFarmLogs=Produce {count} × {item:Log} with automatic farms
MakeCoke=Coke Production
MakeCokeDesc1=A {item:StoneFurnace} cannot supply enough heat for a {item:CopperOven}; use a {item:CopperFurnace}. The oven accepts {item:CoalOre}, coal ore gravel or coal ore dust. Learn more: {tips:Energy}.
MakeCokeDesc2=Logs become coke in two stages: {item:Log} → {item:Coal} → {item:Coke}.
MakeCokeDesc3=The oven also produces {item:Creosote} and stops if the fluid cannot drain. A pipe connected to the fluid outlet or a {item:CopperPump} can carry it to a {item:CopperFluidFurnace} for fuel or a {item:CopperDestroyer} for disposal.
ObjProduceCoke=Make {count} × {item:Coke}
MineIron=Iron Mining
MineIronDesc1=Either {item:MagnetiteOre} or {item:PyriteOre} can supply the iron for steel.
MineIronDesc2=An {item:IronPlate} can be smelted directly from ore. Automatic hammers and macerators increase the yield.
ObjSmeltIronPlate=Smelt {count} × {item:IronPlate}
SmeltSteel=First Steel
SmeltSteelDesc1=A {item:CopperBlastFurnace} makes steel from {item:Coke} and {item:IronPlate} or {item:IronDust}. It needs no external power.
ObjSmeltSteelPlate=Smelt {count} × {item:SteelPlate}
RunSteamExperiments=Steam in the Laboratory
RunSteamExperimentsDesc1=Open {milestone:Steam} in the research tree and press <blue>Start Research</>. Its experiments run in the {item:CopperResearchLaboratory}.
RunSteamExperimentsDesc2=Load {item:CopperPump} and {item:SteelPipe} into the laboratory. After the experiments computers can research {research:Boiler}.
ObjRunSteamExperiments=Run {count} experiments of {milestone:Steam}
SteamIndustry=Steam Power
SteamIndustryDesc1=Research {research:Boiler} and {research:SteamEngine}. A {item:SteelBoiler} uses <red>heat</> to turn {item:Water} into {item:Steam}. A {item:SteelSteamEngine} converts steam into <yellow>kinetic energy</>.
SteamIndustryDesc2=Steam travels through fluid pipes without loss and can be stored in fluid containers.
ObjResearchBoiler=Research {research:Boiler}
ObjResearchSteamEngine=Research {research:SteamEngine}
ObjResearchResistor=Research {research:Resistor}
ObjResearchAdvancedCircuit=Research {research:AdvancedCircuit}
RunElectricityExperiments=Electricity in the Laboratory
RunElectricityExperimentsDesc1=Open {milestone:Electricity} in the research tree and press <blue>Start Research</>. Its experiments run in the {item:CopperResearchLaboratory}.
RunElectricityExperimentsDesc2=Load {item:SteelBoiler} and {item:SteelSteamEngine} into the laboratory. After the experiments computers can research {research:BasicCoil}.
ObjRunElectricityExperiments=Run {count} experiments of {milestone:Electricity}
ObjResearchBasicCoil=Research {research:BasicCoil}
AdvancedCircuits=Advanced Circuits
AdvancedCircuitsDesc1=Each {item:AdvancedCircuit} takes 1 × {item:CircuitBoard}, 2 × {item:Resistor} and 3 × {item:Circuit}. Use regular circuits from your existing line.
AdvancedCircuitsDesc2=A resistor takes 1 × {item:CoalDust} and 4 × {item:CopperWire}. Resistors increase demand for copper wire, which triodes also need.
AdvancedCircuitsDesc3=Research {research:SteelComputer}. With advanced circuits, the {item:SteelComputer} generates 100 research points per second.
ObjResearchDistributedComputing1=Research {research:SteelComputer}
ObjProduceAdvancedCircuit=Make {count} × {item:AdvancedCircuit} in constructors
ResearchAluminium=Unlock Aluminium Production
ResearchAluminiumDesc1=A {item:SteelElectrolyzer} produces aluminium dust, and a {item:SteelArcSmelter} smelts it into plates. Both use electricity. Each experiment of {milestone:Aluminium} takes a {item:SteelElectrolyzer} and a {item:SteelSeparator}.
ObjResearchElectrolyzer=Research {research:Electrolyzer}
ObjResearchAdvancedSmelting=Research {research:AdvancedSmelting}
ObjResearchSeparator=Research {research:Separator}
AluminiumChapter=Aluminium
RunAluminiumExperiments=Aluminium in the Laboratory
RunAluminiumExperimentsDesc1=Open {milestone:Aluminium} in the research tree and press <blue>Start Research</>. Its experiments run in the {item:CopperResearchLaboratory}.
RunAluminiumExperimentsDesc2=Load {item:SteelElectrolyzer} and {item:SteelSeparator} into the laboratory. After the experiments computers can research {research:AluminiumReduction}, which unlocks the {item:AluminiumDust} recipe of the electrolyzer.
ObjRunAluminiumExperiments=Run {count} experiments of {milestone:Aluminium}
ObjResearchAluminiumReduction=Research {research:AluminiumReduction}
MineAluminiumOre=Aluminium Ore Mining
MineAluminiumOreDesc1=Aluminium is extracted from {item:BauxiteOre} or {item:RubyOre}.
ObjDrillAluminiumOre=Mine {count} × {item:BauxiteOre} or {item:RubyOre} with drilling rigs
ProcessAluminiumOre=Aluminium Ore Processing
ProcessAluminiumOreDesc1=Smelting aluminium ore produces {item:BauxiteDust} or {item:RubyDust}.
ProcessAluminiumOreDesc2=Without crushing, the full process yields about one aluminium plate per two units of ore. Automatic hammers and macerators increase the yield. A smelter accepts ore, gravel and ore dust; a {item:SteelSeparator} accepts only ore dust.
ObjProduceAluminiumOreDust=Make {count} × {item:BauxiteDust} or {item:RubyDust}
Electrolysis=Electrolysis
ElectrolysisDesc1=A {item:SteelElectrolyzer} turns {item:BauxiteDust} or {item:RubyDust} into {item:AluminiumOxideDust}. A second pass through the electrolyzer turns the oxide into {item:AluminiumDust}.
ElectrolysisDesc2=The first stage also produces {item:Oxygen}, plus {item:TitaniumOxideDust} from bauxite or {item:ChromiumDust} from ruby. Production stops if oxygen cannot be removed. A pipe or a {item:CopperPump} can carry it to a {item:CopperDestroyer}.
ElectrolysisDesc3=A {item:CopperLoader} removes all items from the output slots. A {item:SteelSorter} routes the oxide to the second stage of electrolysis and the byproducts to a {item:CopperItemRack} or the recycler.
ObjProduceAluminiumDust=Make {count} × {item:AluminiumDust}
