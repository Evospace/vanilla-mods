[quests]
OreToPowerChapter=From Ore to Power
Welcome=Welcome to Evospace
WelcomeDesc1=Use the multitool to mine ore and stone and cut down trees. Hold <blue>{key:ActionPrimary}</> to use it.
WelcomeDesc2=Open the quest log with <blue>{key:QuestBook}</> and the map with <blue>{key:ToggleMap}</>.
WelcomeDesc3=Use the hotbar keys to select an item: <blue>{key:ActiveSlot1}</> for the multitool, <blue>{key:ActiveSlot2}</> for the {item:BasicPlatform}. Use the selected item with <blue>{key:ActionPrimary}</>.
WelcomeDesc4=The inventory opens with <blue>{key:ToggleInventory}</>: a click takes an item in hand.
ObjOpenQuestBook=Open the quest log with {key:QuestBook}
ObjReturnToWorld=Return to the world
GatherCopperOre=Gather Copper Ore
GatherCopperOreDesc=Copper ore shows on the surface. Mine it with your multitool.
GatherCopperOreDesc2=A deposit close by shows on the compass at the top of the screen, and the map (<blue>{key:ToggleMap}</>) marks the deposits around you.
ObjGatherCopperOre=Mine {count} × {item:ChalcopyriteOre} or {item:MalachiteOre}
GatherFuel=Gather Fuel
GatherFuelDesc=Mine coal like ore, get logs from trees. A furnace burns both.
ObjGatherCoal=Gather {count} × {item:CoalOre}
ObjGatherLogs=Gather {count} × {item:Log}
OpenInventory=Open Your Inventory
OpenInventoryDesc1=Open your inventory with <blue>{key:ToggleInventory}</>. What you carry is on the left, the item database is on the right.
OpenInventoryDesc2=Find an item in the database and order it. The same key closes the window.
ObjOpenInventory=Open the inventory with {key:ToggleInventory}
ItemDatabase=The Item Database
ItemDatabaseDesc1=The number on an icon shows how many items you can craft with the materials in your inventory. Learn more: {tips:ItemDatabase}.
ItemDatabaseDesc2=Hover over an item and press <blue>{key:Recipe}</> to open its recipes. Learn more: {tips:Recipes}.
ObjRecipesStoneFurnace=Open recipes ({key:Recipe}): {item:StoneFurnace}
MineStone=Gather Stone
MineStoneDesc=Mine {item:StoneSurface} from rocks, boulders and cliff faces with your multitool.
ObjMineStone=Gather {count} × {item:StoneSurface}
ReturnHome=Back to the Base
ReturnHomeDesc1=Bring the ore back to the starting platform. The {item:LandingPad} there will be needed later.
ReturnHomeDesc2=The compass at the top of the screen points to the spawn, and <blue>{key:Escape}</> opens the menu with Teleport to Home.
ObjReturnHome=Return to the base
BuildPlatforms=Extend the Platform
BuildPlatformsDesc1=Open the decor window with <blue>{key:Decor}</>. It contains platforms, bricks, glass and other building blocks. Click a block to select it. Building uses {item:BuildingMaterial}.
BuildPlatformsDesc2=Extend the starting platform to make room for machines. Each {item:BasicPlatform} costs one building material. Remove a platform with the multitool to get the material back.
BuildPlatformsDesc3=Craft building material in your inventory (<blue>{key:ToggleInventory}</>). Recipe: 1 × {item:StoneSurface} → 1 × {item:BuildingMaterial}.
ObjOpenDecor=Open the decor window with {key:Decor}
ObjBuildPlatforms=Build {count} × {item:BasicPlatform}
ObjOrderBuildingMaterial=Craft {count} × {item:BuildingMaterial}
CraftFirstBlocks=Craft the Furnaces and the Smelter
CraftFirstBlocksDesc=Craft 2 × {item:StoneFurnace} and 1 × {item:StoneSmelter}. Use 1 furnace to heat the smelter and the other for the power plant.
CraftFirstBlocksDesc2=Left-click an item in the database to queue one. <blue>Shift</> + left click queues as many as your materials allow, up to one stack. Learn more: {tips:CraftQueue}.
ObjCraftStoneFurnace=Craft {count} × {item:StoneFurnace}
ObjCraftStoneSmelter=Craft {count} × {item:StoneSmelter}
PinToHotbar=Pin to the Hotbar
PinToHotbarDesc1=Click the furnace in your inventory, then click an empty hotbar slot. Press the slot's key to select the furnace.
PinToHotbarDesc2=A right click on a slot clears it.
ObjPinToHotbar=Pin {item:StoneFurnace} or {item:StoneSmelter} to the hotbar
BuildFirstSmelter=Build Your First Smelter
BuildFirstSmelterDesc1=Choose a place with free space around it.
BuildFirstSmelterDesc2=Place a {item:StoneFurnace}. Select the {item:StoneSmelter} and aim at the furnace to align the smelter's heat input with the furnace's heat output, then place the smelter. Learn about the different building modes: {tips:BuildingModes}.
ObjBuildStoneFurnace=Build a {item:StoneFurnace}
ObjStackStoneSmelter=Place a {item:StoneSmelter} on the {item:StoneFurnace}
SmeltCopperPlates=Smelt Copper
SmeltCopperPlatesDesc1=Load fuel into the {item:StoneFurnace} and copper ore into the {item:StoneSmelter}.
SmeltCopperPlatesDesc2=Collect the copper plates from the smelter's output slots. Keep space available there so smelting can continue.
ObjSmeltCopperPlates=Smelt {count} × {item:CopperPlate}
CraftMachines=From Heat to Research
CraftMachinesDesc=Craft a {item:CopperStirlingEngine}, a {item:CopperCompactGenerator} and a {item:CopperComputer}.
ObjCraftStirlingEngine=Craft {count} × {item:CopperStirlingEngine}
ObjCraftCompactGenerator=Craft {count} × {item:CopperCompactGenerator}
ObjCraftComputer=Craft {count} × {item:CopperComputer}
BuildFirstPowerPlant=Build the Power Plant
BuildFirstPowerPlantDesc1=Place the second {item:StoneFurnace}. Dock the {item:CopperStirlingEngine} onto the furnace, the {item:CopperCompactGenerator} onto the engine and the {item:CopperComputer} onto the generator.
BuildFirstPowerPlantDesc2=<blue>{key:ActionRotate}</> switches between docking positions. Learn more: {tips:Energy}.
ObjBuildPowerPlant=Connect the furnace, {item:CopperStirlingEngine}, {item:CopperCompactGenerator} and {item:CopperComputer}
StartPowerPlant=Start the Power Plant
StartPowerPlantDesc1=Load fuel into the power plant's furnace. Check that the engine, generator and computer receive energy. Learn more: {tips:Energy}.
StartPowerPlantDesc2=If the computer has no power, open the {tips:NoPower} tip.
ObjPlantFurnace=Fire the furnace
ObjPlantEngine=Run the {item:CopperStirlingEngine}
ObjPlantGenerator=Get electricity from the {item:CopperCompactGenerator}
ObjPlantComputer=Power the {item:CopperComputer}
AutomationChapter=Automation
ResearchBasicMachines=Open the Research Tree
ResearchBasicMachinesDesc1=Open the research tree with <blue>{key:Journal}</> or the research button on the left bar. The button also shows the time left on the running research.
ResearchBasicMachinesDesc2=Start {research:BasicMachines}. The computer produces research points while it has electricity. Completing the research unlocks the recipes.
ObjResearchBasicMachines=Research {research:BasicMachines} ({key:Journal})
ObjOpenResearch=Open the research tree with {key:Journal}
ResearchAutomaticMining=Research Automatic Mining
ResearchAutomaticMiningDesc1={research:Automatization} unlocks the machines that move items between devices. {research:AutomaticMining} requires it and unlocks the {item:CopperDrillingRig}, which mines ore automatically.
ResearchAutomaticMiningDesc2=Keep fuel in the furnace until both research projects are complete.
ObjResearchAutomatization=Research {research:Automatization}
ObjResearchAutomaticMining=Research {research:AutomaticMining}
BuildAutomaticMine=Set Up the Automatic Mine
BuildAutomaticMineDesc1=Find an ore deposit on the map, travel to it and place a {item:CopperDrillingRig} on the deposit.
BuildAutomaticMineDesc2=Place a {item:StoneFurnace} next to the rig and a {item:CopperStirlingEngine} on the furnace. Connect the engine's kinetic output to the rig's kinetic input and load fuel into the furnace.
BuildAutomaticMineDesc3=Craft a {item:StoneChest} and place it against the drilling rig's item output. The rig will transfer mined ore into the chest automatically.
ObjPowerDrillingRig=Power the {item:CopperDrillingRig} from a {item:CopperStirlingEngine} and a {item:StoneFurnace}
ObjDockMineChest=Place a chest at the rig output side
ObjCraftLineChests=Craft {count} × {item:StoneChest}
ObjCraftLineHammer=Craft {count} × {item:CopperAutomaticHammer}
ObjCraftLineSmelter=Craft {count} × {item:StoneSmelter}
ObjCraftLineEngine=Craft {count} × {item:CopperStirlingEngine}
ObjCraftLineFurnaces=Craft {count} × {item:StoneFurnace}
CraftOreMultiplication=Prepare an Ore-Processing Line
CraftOreMultiplicationDesc1=Direct smelting in a {item:StoneSmelter} produces 1 plate per ore. The {item:CopperAutomaticHammer} turns ore into impure gravel with a 50% {tips:Productivity} bonus. The {item:CopperMacerator} turns that gravel into ore dust with another 50% bonus. Together, these steps yield an average of 2.25 plates per ore after smelting.
CraftOreMultiplicationDesc2=Use 1 automatic hammer with 2 macerators.
ObjCraftMultiplierMacerators=Craft {count} × {item:CopperMacerator}
ObjCraftMultiplierArms=Craft {count} × {item:CopperRobotArm}
ResearchCircuits=Research the Circuit
ResearchCircuitsDesc1=Research {research:CircuitBoard}, {research:Triod} and {research:Circuit} to unlock circuit production. {research:Constructor} unlocks a machine that automatically crafts items using hand-crafting recipes.
ObjResearchCircuitBoard=Research {research:CircuitBoard}
ObjResearchTriod=Research {research:Triod}
ObjResearchCircuit=Research {research:Circuit}
ObjResearchConstructor=Research {research:Constructor}
CircuitsChapter=Circuit Production
BuildConstructor=Start the Constructor
BuildConstructorDesc1=The {item:CopperConstructor} automatically crafts items using hand-crafting recipes. Open its window, select the {item:CopperWire} recipe, then load {item:CopperPlate} into the input slot. Learn more: {tips:Constructor}.
BuildConstructorDesc2=The constructor and computer need 1.2 kW in total, but 1 generator supplies only 1 kW. Build a second power plant to run both at full speed. Learn more: {tips:Energy}.
ObjCraftConstructor=Craft {count} × {item:CopperConstructor}
ObjBuildConstructor=Build a {item:CopperConstructor}
ObjProduceCopperWire=Make {count} × {item:CopperWire} in a constructor
SmeltGlass=Smelt Glass
SmeltGlassDesc=Crafting a {item:Triod} requires {item:Glass}. Mine {item:SandSurface} with the multitool and smelt it in a {item:StoneSmelter} to make glass.
ObjMineSand=Gather {count} × {item:SandSurface}
ObjSmeltGlass=Smelt {count} × {item:Glass}
MachineCircuits=Circuit Line
MachineCircuitsDesc1=Each {item:Circuit} requires 1 × {item:CircuitBoard} and 3 × {item:Triod}. Making those triodes takes 3 × {item:Glass} and 9 × {item:CopperWire}.
MachineCircuitsDesc2=Use separate constructors for each recipe and {item:CopperRobotArm} units to transfer components between them. See {tips:Constructor} for the number of constructors needed for each component.
ObjProduceTriod=Make {count} × {item:Triod} in constructors
ObjProduceCircuit=Make {count} × {item:Circuit} in constructors
BoostResearch=Boost the Research
BoostResearchDesc1=The {item:CopperComputer}'s circuit slot holds 3 × {item:Circuit}. Each circuit increases its research rate from 1 to 10 points per second for 30 seconds.
BoostResearchDesc2=Use a {item:CopperRobotArm} to transfer circuits from the constructor to the computer. Keep research projects queued so the computer continues consuming circuits and producing research points. Learn more: {tips:Research}.
ObjBoostComputer=Have computers consume {count} × {item:Circuit}
QueueResearch=Queue the Research
QueueResearchDesc1={research:SteelProduction} requires {research:Oven}, which requires {research:Furnace} and {research:FluidTransfer}. Queue the prerequisite research projects first, then add Oven and Steel Production. Select each project and click <blue>Start Research</>. Learn more: {tips:Research}.
QueueResearchDesc2=Computers work through the queue in order. {research:SteelProduction} unlocks the {item:CopperBlastFurnace} for steel.
ObjResearchOven=Research {research:Oven}
ObjResearchSteelProduction=Research {research:SteelProduction}
