[quests]
OreToPowerChapter="From Ore to Power"
OreToPowerChapterDesc="Everything the colony builds later stands on this chapter. You will dig copper out of the ground, burn fuel to turn it into metal, and end with a fire driving a computer — the first machine that pays you back in research."

GatherCopperOre="Gather Copper Ore"
GatherCopperOreDesc1="Copper comes from two ores: <blue>{item:ChalcopyriteOre}</> and <blue>{item:MalachiteOre}</>. Both smelt into copper, so gather whichever you find."
GatherCopperOreDesc2="Look for ore visible on the surface — there is usually more nearby or just below. Mine it with your multitool."
ObjGatherCopperOre="Mine {item:ChalcopyriteOre} or {item:MalachiteOre}"

GatherFuel="Gather Fuel"
GatherFuelDesc="Nothing smelts cold. A furnace burns <blue>{item:CoalOre}</> or a plain <blue>{item:Log}</> — coal lasts far longer, so one coal is worth two logs. Mine coal, chop trees, or bring a mix of both."
ObjGatherFuel="Gather fuel: 20 × {item:CoalOre} or 40 × {item:Log}"

OpenInventory="Open Your Inventory"
OpenInventoryDesc1="Everything you mine goes into your own pockets, and it is also where you build things by hand. Open the window with <blue>{key:ToggleInventory}</> — what you carry is on the left, the list of everything you can make is beside it."
OpenInventoryDesc2="Pick a recipe and order it. Whatever smaller parts the recipe is built from are made along the way, so you ask for the finished thing and keep the raw material on you. The same key closes the window."
ObjOpenInventory="Open the inventory with {key:ToggleInventory}"

MineStone="Gather Stone"
MineStoneDesc1="Ore and fuel are worth nothing until there is something to burn them in, and everything you build first is made of stone. <blue>{item:StoneSurface}</> comes out of the rocks and boulders lying about — hit one with your multitool and it breaks into stone."
MineStoneDesc2="A big boulder is worth the walk: it carries far more stone than the furnace and the smelter need together. And where a mountain or a cliff cuts through the ground, the stone is bare and you can mine it straight out of the slope."
ObjMineStone="Gather {item:StoneSurface}"

CraftFirstBlocks="Craft the Furnace and the Smelter"
CraftFirstBlocksDesc1="Ore is not metal yet, and two blocks make it one: a <blue>{item:StoneFurnace}</> that burns fuel into heat, and a <blue>{item:StoneSmelter}</> that turns copper ore into plates on that heat."
CraftFirstBlocksDesc2="Both are stone: <blue>4 × {item:BuildingMaterial}</> each, and one building material is one block of <blue>{item:StoneSurface}</>. You already carry the stone — order the furnace and the smelter in the crafting list, and the building material is made along the way."
ObjCraftStoneFurnace="Craft a {item:StoneFurnace}"
ObjCraftStoneSmelter="Craft a {item:StoneSmelter}"

BuildFirstSmelter="Build Your First Smelter"
BuildFirstSmelterDesc1="Ore is not metal yet. A <blue>{item:StoneSmelter}</> turns copper ore into ingots, but it makes no heat of its own — it only runs on heat fed from below."
BuildFirstSmelterDesc2="Place a <blue>{item:StoneFurnace}</> and put the smelter in the cell directly above it. Fuel goes into the furnace, ore into the smelter."
ObjBuildStoneFurnace="Build a {item:StoneFurnace}"
ObjStackStoneSmelter="Stand a {item:StoneSmelter} directly on the {item:StoneFurnace}"

SmeltCopperPlates="Smelt Copper"
SmeltCopperPlatesDesc1="The stack is built, now feed it. Put fuel — <blue>{item:CoalOre}</> or <blue>{item:Log}</> — into the <blue>{item:StoneFurnace}</> below, and copper ore into the <blue>{item:StoneSmelter}</> above."
SmeltCopperPlatesDesc2="The furnace burns fuel into heat and the smelter takes that heat from below, so neither works without the other. Every ore turns into one <blue>{item:CopperPlate}</>; take them out of the smelter's output before it fills up and stops."
ObjSmeltCopperPlates="Smelt {item:CopperPlate}"

CraftMachines="From Heat to Research"
CraftMachinesDesc1="Fire alone earns nothing — three machines carry it the rest of the way. A <blue>{item:CopperStirlingEngine}</> turns heat into rotation, a <blue>{item:CopperCompactGenerator}</> turns rotation into electricity, and a <blue>{item:CopperComputer}</> turns electricity into research points."
CraftMachinesDesc2="All three are made by hand from the copper you have already smelted — <blue>23 × {item:CopperPlate}</> for the set. Ask for a machine and everything smaller it is built from is made along the way, so there is nothing to prepare first: keep the plates on you and order the machine itself."
ObjCraftStirlingEngine="Craft a {item:CopperStirlingEngine}"
ObjCraftCompactGenerator="Craft a {item:CopperCompactGenerator}"
ObjCraftComputer="Craft a {item:CopperComputer}"

BuildFirstPowerPlant="Wire Up the Power Plant"
BuildFirstPowerPlantDesc1="Your only furnace has the smelter standing on it, so begin with a second <blue>{item:StoneFurnace}</> — four {item:BuildingMaterial}, same as the first. Break another rock if you spent all your stone."
BuildFirstPowerPlantDesc2="Heat, rotation and power cross where two blocks touch. Each block takes its resource in on one side and hands it on from another, and those sides are drawn on the model. A furnace gives heat <blue>upwards</>, so the <blue>{item:CopperStirlingEngine}</> stands directly on it, exactly like the smelter. The engine passes rotation out <blue>sideways</>: put the <blue>{item:CopperCompactGenerator}</> against that side, and the <blue>{item:CopperComputer}</> against the generator's far side."
BuildFirstPowerPlantDesc3="The generator carries power straight through, in at the front and out at the back, but the computer takes power in at its own back — turn it around with <blue>{key:ActionRotate}</> so its input faces the generator. Fuel in the furnace, and the computer starts earning research points."
ObjBuildPowerPlant="Wire furnace, {item:CopperStirlingEngine}, {item:CopperCompactGenerator} and {item:CopperComputer} into one working line"

AutomationChapter="Automation"
AutomationChapterDesc="The plant pays you back in research points, and research is what stops you from digging every ore by hand. Three nodes stand between the computer you just lit and a drill that mines on its own."

ResearchBasicMachines="Open the Research Tree"
ResearchBasicMachinesDesc1="Your <blue>{item:CopperComputer}</> is earning research points, and points are spent in the <blue>research tree</>. Open it with <blue>{key:Journal}</>, or with the research button on the bar down the left of the screen — the same button shows how long the running research still needs."
ResearchBasicMachinesDesc2="The tree is a map of everything the colony can learn. Pick a node you can afford and start it: the computer works it off on its own while you keep playing, and the moment it finishes its recipes appear in your crafting list. Research already spent stays spent, so nothing is lost by starting the cheapest node first."
ResearchBasicMachinesDesc3="Start with <blue>{research:BasicMachines}</>. It is the first node past the power plant and it opens the <blue>{item:CopperMacerator}</> and the <blue>{item:CopperAutomaticHammer}</> — two machines that do by fire what you have been doing by hand."
ObjResearchBasicMachines="Research {research:BasicMachines}"

ResearchAutomaticMining="Research Automatic Mining"
ResearchAutomaticMiningDesc1="Two nodes remain between you and a mine that runs without you. <blue>{research:Automatization}</> opens the <blue>{item:CopperConveyor}</>, the <blue>{item:CopperSplitter}</> and the <blue>{item:CopperRobotArm}</> — the parts that carry items between machines instead of your hands."
ResearchAutomaticMiningDesc2="Behind it stands <blue>{research:AutomaticMining}</> and the <blue>{item:CopperDrillingRig}</>: a machine that stands over ore and digs it out on its own. Keep fuel in the furnace while both run — a computer with no power under it earns nothing, and the research simply stops where it is."
ObjResearchAutomatization="Research {research:Automatization}"
ObjResearchAutomaticMining="Research {research:AutomaticMining}"
