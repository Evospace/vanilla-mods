[quests]
CopperProductionChapter="Copper Production"
CopperProductionChapterDesc="Copper is the backbone of your first machines. In this chapter you will find copper ore, smelt it, and bootstrap your first production line."

GatherCopperOre="Gather Copper Ore"
GatherCopperOreDesc1="Copper comes from two ores: <blue>Chalcopyrite</> and <blue>Malachite</>. Both smelt into copper, so gather whichever you find."
GatherCopperOreDesc2="Look for ore visible on the surface — there is usually more nearby or just below. Mine it with your multitool."
ObjGatherCopperOre="Mine chalcopyrite or malachite ore"

GatherFuel="Gather Fuel"
GatherFuelDesc="Nothing smelts cold. A furnace burns <blue>Coal Ore</> or plain <blue>Logs</> — coal lasts far longer, so one coal is worth two logs. Mine coal, chop trees, or bring a mix of both."
ObjGatherFuel="Gather fuel: 20 coal ore or 40 logs"

BuildFirstSmelter="Build Your First Smelter"
BuildFirstSmelterDesc1="Ore is not metal yet. A <blue>Stone Smelter</> turns copper ore into ingots, but it makes no heat of its own — it only runs on heat fed from below."
BuildFirstSmelterDesc2="Place a <blue>Stone Furnace</> and put the smelter in the cell directly above it. Fuel goes into the furnace, ore into the smelter."
ObjBuildStoneFurnace="Build a stone furnace"
ObjStackStoneSmelter="Stand a stone smelter directly on the furnace"
