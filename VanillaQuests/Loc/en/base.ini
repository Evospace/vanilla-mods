[quests]
CopperProductionChapter="Copper Production"
CopperProductionChapterDesc="Copper is the backbone of your first machines. In this chapter you will find copper ore, smelt it, and bootstrap your first power generation."

GatherCopperOre="Gather Copper Ore"
GatherCopperOreDesc1="Copper comes from two ores: <blue>Chalcopyrite</> and <blue>Malachite</>. Both smelt into copper, so gather whichever you find."
GatherCopperOreDesc2="Look for ore visible on the surface — there is usually more nearby or just below. Mine it with your multitool."
ObjGatherCopperOre="Mine chalcopyrite or malachite ore"

StockpileCopperOre="Stockpile Copper Ore"
StockpileCopperOreDesc="One smelt is not enough. Build up a reserve of copper ore so you never run dry while setting up your first production line."
ObjStockpileCopperOre="Mine more chalcopyrite or malachite ore"
