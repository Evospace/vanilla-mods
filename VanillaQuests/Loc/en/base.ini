[quests]
OreToPowerChapter="From Ore to Power"
OreToPowerChapterDesc="Everything you build later stands on this chapter. You will dig copper out of the ground, burn fuel to turn it into metal, and end with a fire driving a computer — the first machine that pays you back in research."

GatherCopperOre="Gather Copper Ore"
GatherCopperOreDesc1="Copper comes from two ores: <blue>{item:ChalcopyriteOre}</> and <blue>{item:MalachiteOre}</>. Both smelt into copper, so gather whichever you find."
GatherCopperOreDesc2="Look for ore visible on the surface — there is usually more nearby or just below. Mine it with your multitool."
ObjGatherCopperOre="Mine {item:ChalcopyriteOre} or {item:MalachiteOre}"

GatherFuel="Gather Fuel"
GatherFuelDesc="A furnace burns <blue>{item:CoalOre}</> or a plain <blue>{item:Log}</>, and one coal is worth two logs. Mine coal, chop trees, or bring a mix of both."
ObjGatherFuel="Gather fuel: 20 × {item:CoalOre} or 40 × {item:Log}"

OpenInventory="Open Your Inventory"
OpenInventoryDesc1="Everything you mine goes into your own pockets, and it is also where you build things by hand. Open the window with <blue>{key:ToggleInventory}</> — what you carry is on the left, the list of everything you can make is beside it."
OpenInventoryDesc2="Pick a recipe and order it. The same key closes the window."
ObjOpenInventory="Open the inventory with {key:ToggleInventory}"

MineStone="Gather Stone"
MineStoneDesc1="<blue>{item:StoneSurface}</> comes out of the rocks and boulders lying about — hit one with your multitool and it breaks into stone."
MineStoneDesc2="A big boulder is worth the walk: it carries far more stone than the furnace and the smelter need together. And where a mountain or a cliff cuts through the ground, the stone is bare and you can mine it straight out of the slope."
ObjMineStone="Gather {item:StoneSurface}"

CraftFirstBlocks="Craft the Furnace and the Smelter"
CraftFirstBlocksDesc1="Craft a <blue>{item:StoneFurnace}</> and a <blue>{item:StoneSmelter}</> — the pair that turns your copper ore into metal."
CraftFirstBlocksDesc2="<blue>4 × {item:BuildingMaterial}</> each, and one building material is one block of <blue>{item:StoneSurface}</>."
ObjCraftStoneFurnace="Craft a {item:StoneFurnace}"
ObjCraftStoneSmelter="Craft a {item:StoneSmelter}"

BuildFirstSmelter="Build Your First Smelter"
BuildFirstSmelterDesc1="Pick a spot with room around it and put the pair you crafted down there."
BuildFirstSmelterDesc2="Place a <blue>{item:StoneFurnace}</> on the ground. Take the <blue>{item:StoneSmelter}</>, aim at the furnace, and it snaps into place. Fuel goes into the furnace, ore into the smelter."
ObjBuildStoneFurnace="Build a {item:StoneFurnace}"
ObjStackStoneSmelter="Stand a {item:StoneSmelter} directly on the {item:StoneFurnace}"

SmeltCopperPlates="Smelt Copper"
SmeltCopperPlatesDesc1="Put fuel — <blue>{item:CoalOre}</> or <blue>{item:Log}</> — into the <blue>{item:StoneFurnace}</> below, and copper ore into the <blue>{item:StoneSmelter}</> above."
SmeltCopperPlatesDesc2="Every ore turns into one <blue>{item:CopperPlate}</>. Take the plates out of the smelter's output as they pile up, so it keeps running."
ObjSmeltCopperPlates="Smelt {item:CopperPlate}"

CraftMachines="From Heat to Research"
CraftMachinesDesc1="Craft three machines: a <blue>{item:CopperStirlingEngine}</>, a <blue>{item:CopperCompactGenerator}</> and a <blue>{item:CopperComputer}</>. Together they carry the furnace's heat all the way to research points."
CraftMachinesDesc2="<blue>23 × {item:CopperPlate}</> for the set."
ObjCraftStirlingEngine="Craft a {item:CopperStirlingEngine}"
ObjCraftCompactGenerator="Craft a {item:CopperCompactGenerator}"
ObjCraftComputer="Craft a {item:CopperComputer}"

BuildFirstPowerPlant="Wire Up the Power Plant"
BuildFirstPowerPlantDesc1="Craft a second <blue>{item:StoneFurnace}</> — four {item:BuildingMaterial}, same as the first. Break another rock for the stone."
BuildFirstPowerPlantDesc2="Aim at a machine already standing with the next one in hand, and it snaps into place: the <blue>{item:CopperStirlingEngine}</> onto the furnace, the <blue>{item:CopperCompactGenerator}</> onto the engine, the <blue>{item:CopperComputer}</> onto the generator."
BuildFirstPowerPlantDesc3="<blue>{key:ActionRotate}</> walks the placements a machine offers. Fuel in the furnace, and the computer starts earning research points."
ObjBuildPowerPlant="Wire furnace, {item:CopperStirlingEngine}, {item:CopperCompactGenerator} and {item:CopperComputer} into one working line"

AutomationChapter="Automation"
AutomationChapterDesc="The plant pays you back in research points, and research turns hand-digging into machines that mine for you. Three nodes stand between the computer you just lit and a drill that works on its own."

ResearchBasicMachines="Open the Research Tree"
ResearchBasicMachinesDesc1="Research points are spent in the <blue>research tree</>. Open it with <blue>{key:Journal}</>, or with the research button on the bar down the left of the screen — the same button shows how long the running research still needs."
ResearchBasicMachinesDesc2="The tree is a map of everything you can learn. Pick the cheapest node you can afford and start it: the computer works it off on its own while you keep playing, and the moment it finishes its recipes appear in your crafting list."
ResearchBasicMachinesDesc3="Start with <blue>{research:BasicMachines}</>. It is the first node past the power plant and it opens the <blue>{item:CopperMacerator}</> and the <blue>{item:CopperAutomaticHammer}</> — two machines that do by fire what you have been doing by hand."
ObjResearchBasicMachines="Research {research:BasicMachines}"

ResearchAutomaticMining="Research Automatic Mining"
ResearchAutomaticMiningDesc1="Two nodes remain between you and a mine that runs on its own. <blue>{research:Automatization}</> opens the <blue>{item:CopperConveyor}</>, the <blue>{item:CopperSplitter}</> and the <blue>{item:CopperRobotArm}</> — the parts that carry items between machines instead of your hands."
ResearchAutomaticMiningDesc2="Behind it stands <blue>{research:AutomaticMining}</> and the <blue>{item:CopperDrillingRig}</>: a machine that stands over ore and digs it out on its own. Keep fuel in the furnace while both run: the computer earns points for as long as it has power."
ObjResearchAutomatization="Research {research:Automatization}"
ObjResearchAutomaticMining="Research {research:AutomaticMining}"
