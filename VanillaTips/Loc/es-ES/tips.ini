[tips]
StackTransfers=Stack transfers
StackTransfersDescription=<blue>Shift + Left-click</>: Transfers a single stack\n<blue>Shift + Right-click</>: Transfers a half of stack\n\n<blue>Control + Left-click</>: Transfers all stacks of the given type\n<blue>Control + Right-click</>: Transfers half of items of the given type\n\n<blue>Control + Left-click on empty slot</>: transfer the whole inventory\n<blue>Control + Right-click on empty slot</>: transfer a half of whole inventory\n\n<blue>Alt + Left-click</>: transfer five items\n<blue>Alt + Right-click</>: transfer one item
ChestLimiting=Chest limiting
ChestLimitingDescription=
Screwdriver=Screwdriver
ScrewdriverDescription=Press <blue>Left Mouse Button</> while holding a <blue>Screwdriver</> and drag to one of arrow directions then release button to rotate block. At the moment only single cell blocks can be rotatared with this method.\n\nRotation depends on the plane you are hovering over.\nAfter releasing the button, the plane will rotate in such a way that it replaces the plane indicated by the selected arrow
RotationWhileBuilding=Rotation while building
RotationWhileBuildingDescription=Press <blue>R</> to rotate the block around vertical axis.\nYou can change this axis by holding <blue>Shift</> or <blue>Alt</> key.\nActive axis will be shown with green arrow and axis like in piclure above.\n\nWhile holding some buildable item you can hold <blue>Right Mouse Button</> and drag to one of arrow directions then release button to rotate block. This method allows rotation of blocks with any size.
BlockPipette=Block pipette
BlockPipetteDescription=Press <blue>Q</> to copy hovered block with its rotation. Press <blue>Q</> again to clear selection.\nIt is always working in Creative mode and only when you have same item in inventory in Normal mode\n\nPress <blue>Ctrl+C</> to copy settings from hovered block\nPress <blue>Ctrl+V</> to paste setting from clipboard to hovered block\n\nBlock settings availible not for all blocks. All block settings is just a text.
FirstSteps=First steps
FirstStepsDescription=Finding and Smelting Copper Ore (Malachite, Chalcopyrite)\n\n1. First, locate copper ore: Malachite or Chalcopyrite. Areas where ore is visible on the ground usually have more deposits nearby or just below the surface.\n2. Gather the copper ore.\n3. Use basic blocks from your inventory to create a platform for convenience.\n4. Craft a furnace and a smelter. Place the smelter above the furnace.\n5. Put fuel in the furnace and place the copper ore in the smelter.\n6. Once the smelting process is complete, collect the copper ingots.\n\nBuilding Essential Machinery\n\n1. Create another furnace, a Stirling engine, a compact generator, and a computer.\n2. Arrange these components according to their inputs and outputs.\n3. Once the computer is operational, you can start researching new technologies.
Interface=Interface
Map=Map
InterfaceDescription1=<blue>1) Hotbar</>\n\nAt the beginning, the currently held item is displayed along with its name above it.\nAfter it, quick access slots are shown. These can be selected by mouse click or the corresponding number key.\nThe hotbar holds items by type and draws them directly from the player's inventory.\n
InterfaceDescription2=<blue>2) Player Inventory</>\n\nThe main section consists of a grid of item slots.\nLeft-click an item to pick it up. Click on a slot again to place the item there. Click on another item to swap them.\n\nAt the bottom, there are dedicated slots for the jetpack, lighting, inventory sorting, and dropping items on the ground.\nBelow that are the tools: a multitool for digging and a screwdriver for rotating blocks.\n
InterfaceDescription3=<blue>3) Miscellaneous</>\n\nThe top row contains time control buttons for the in-game time. Currently, these only affect visuals. At the end of the row is a button that stops the day-night cycle.\n\nThe second row includes a button showing research progress, followed by the tutorial button that opens this guide.\nNext is the creative mode toggle (invisible in non-creative games), then a flight mode toggle, and finally a button to highlight block inputs and outputs.\n
InterfaceDescription4=<blue>4) Player Crafting Window</>\n\nThis row contains the tab selection for the section below.\nFirst is the list of all unlocked items. Next is the Favorites tab. To add or remove an item from Favorites, right-click the item in the list below and select Toggle Favourite from the dropdown menu.\nThen comes the tab for all items available in the game. Finally, there is the Search Results tab and a text field for item search.\n
InterfaceDescription5=<blue>5) Selected Tab Contents</>\n\nDisplays the items from the selected tab, grouped into categories.\nThe number in each cell shows how many of that item can currently be crafted.\n\nLeft-clicking an item will queue 1 unit if enough resources are available, Shift + left-click queues as many as the resources allow.\n\nRight-clicking opens a context menu where you can queue multiple items, open the recipe window (Show Recipes), add all components of the item to the search (Context Search), or mark the item as a favorite (Toggle Favourite).\n
InterfaceDescription6=<blue>6) Selected Block Window</>\n\nRight-clicking a block while aiming at it opens the block's interface.\nAt the top, you'll find the power toggle and settings buttons, followed by the block’s name and tier.\nBelow that is the input inventory, along with a status indicator and a current recipe indicator (hover over it for details).\nNext comes the progress bar for the active recipe. Some machines also have a second bar that shows bonus production.\nWhen the main progress bar is full, the recipe is completed. When the bonus bar is full, a bonus item is produced.\nBelow that is the output inventory.\nAt the very bottom, other block statuses are displayed.\n
InterfaceDescription7=<blue>7) Block Minipanel (Under Crosshair)</>\n\nDisplays the name, icon, and brief information about the block the player is currently looking at.\n
MapDescription=Press <blue>M</> to open the map. The map shows explored regions, your position, and any markers.
Research=Research
ResearchDescription=Research unlocks new recipes and blocks. Earn research points to progress through the tech tree.
ResearchComputersDescription1=Research points are produced by computers only. A computer consumes electricity and adds points to the selected research once per second. Without electricity it produces nothing.
ResearchComputersDescription2=The rate depends on the computer tier: {item:CopperComputer} — 1 point per second, {item:SteelComputer} — 2, each next tier twice as much. Points of all working computers go into the same research and sum up.
ResearchComputersDescription3=Every computer has a chip slot for 3 chips of its own tier: {item:Circuit} for {item:CopperComputer}, {item:AdvancedCircuit} for {item:SteelComputer}. One chip is consumed per 30 seconds of boost, and the next chip is taken only after the current boost ends.
ResearchComputersDescription4=Boosted rate: {item:CopperComputer} — 10 points per second, {item:SteelComputer} — 100, each next tier ten times as much.
Productivity=Productivity
ProductivityDescription1=The second progress bar next to the recipe bar is Productivity. The bar fills while the machine works, and when it is full the machine gives one extra output. The extra output costs no input.
ProductivityDescription2=Productivity works on ore recipes of {machine:AutomaticHammer}, {machine:Macerator}, {machine:OreWasher}. Ore processed in them gives more plates than ore smelted directly.
BuildingModes=Building modes
BuildingModesDescription1=Machines and most blocks are built in a line: hold <blue>Left Mouse Button</> and drag away from the first cell, release to place the whole line at once.
BuildingModesDescription2=Platforms and other simple blocks fill a plane: hold <blue>Left Mouse Button</> and drag, the plane is picked by the direction you move first.
BuildingModesDescription3=Conveyors, pipes and cables are built as a run in two clicks: the first click anchors the start, the second builds the run, <blue>Right Mouse Button</> cancels it. Hold <blue>Shift</> to route the run around obstacles.\n\n<blue>Mouse Wheel</> raises and lowers the aim in every mode.
Trains=Trenes
TrainsDescription1=Completa {research:Railway} para desbloquear las recetas de {item:SteelRail}, {item:RailStation}, {item:Locomotive}, {item:CargoWagon} y {item:TankWagon}. Las señales {item:RailSignal} y {item:RailChainSignal} estarán disponibles tras investigar {research:RailSignals}.
TrainsDescription2=<blue>Primera línea</>\n\nEmpieza con dos estaciones unidas por un circuito de vías. Construye dos andenes por estación, uno a continuación del otro y orientados en el mismo sentido. Orienta las estaciones de modo que el tren entre por el extremo sin luces y avance hacia ellas.\n\nColoca una {item:Locomotive} en la primera estación y un {item:CargoWagon} detrás. Pon un cargador o un brazo robótico junto al andén del vagón en cada estación: para cargar en la primera y descargar en la segunda.\n\nAñade la segunda estación al itinerario y activa «Repetir el itinerario». Establece <blue>L = 1</> como condición de salida en la estación de carga y <blue>E = 1</> en la de descarga. Así el tren esperará a estar completamente cargado o descargado antes de salir. Consulta «Condiciones de salida» para configurar estas condiciones.\n\nPon combustible en la locomotora para poner el tren en marcha.
TrainsDescription3=Pulsa <blue>{key:Trains}</> para abrir la lista de trenes y estaciones.
TrainsRails=Vías
TrainsRailsDescription1=Con {item:SteelRail} en la mano, pulsa <blue>{key:ActionPrimary}</> en el lugar elegido para colocar un nodo de vía. Cada nodo nuevo se conecta al anterior. Al comenzar una nueva cadena, el juego intenta conectar el primer nodo al más cercano en un radio de 24 casillas.\n\nComprueba la vista previa antes de colocar el nodo: el verde indica que la conexión puede construirse; el rojo, que no encaja. Usa la <blue>rueda del ratón</> para ajustar la altura.
TrainsRailsDescription2=Pulsa <blue>{key:ActionSecondary}</> para terminar la cadena. Para prolongar la vía desde un nodo existente, apunta hacia él y pulsa <blue>{key:ActionPrimary}</>. Después, haz clic en otro nodo para unirlos. Si ya están conectados, el clic elimina ese tramo de vía.
TrainsRailsDescription3=Los nodos pueden conectarse a una distancia horizontal de entre 1 y 32 casillas. Las curvas necesitan un radio mínimo de 3 casillas y cada tramo puede girar hasta 120°. La pendiente máxima es del 25%. Si una conexión no puede construirse, un mensaje explica el motivo.
TrainsRailsDescription4=Para crear una bifurcación, conecta varias vías al mismo lado de un nodo. Los trenes eligen el ramal según su ruta.
TrainsRailsDescription5=Los nodos contiguos en línea recta se conectan automáticamente. Cada nodo nuevo consume una unidad de {item:SteelRail}. Al quitar un nodo también se eliminan las vías conectadas a él. Los planos conservan los nodos y sus conexiones.
TrainsRailsDescription6=Los trenes reducen la velocidad en las curvas cerradas. En las subidas, la velocidad depende del peso del tren y de la fuerza de tracción de sus locomotoras.
TrainsStations=Estaciones
TrainsStationsDescription1=Cada bloque {item:RailStation} añade un andén para una locomotora o un vagón. Para detenerse en una estación, el tren debe entrar por el extremo sin luces y avanzar hacia las luces del extremo opuesto.
TrainsStationsDescription2=Coloca los andenes uno a continuación del otro, orientados en el mismo sentido, para formar una sola estación. Construye un andén por locomotora y vagón para atender a todo el tren.
TrainsStationsDescription3=La <yellow>luz amarilla</> se enciende cuando un tren se dirige a la estación. La <red>luz roja</> permanece encendida durante la parada y la <green>luz verde</> durante la salida. Una luz roja intermitente indica que la salida se retrasa, por ejemplo por falta de combustible.
TrainsStationsDescription4=Apunta a un andén y pulsa <blue>{key:ActionSecondary}</> para abrir la ventana de la estación.
TrainsStationsDescription5=<blue>1) Nombre de la estación</>\n\nEl itinerario identifica las estaciones por su nombre. Si varias comparten nombre, el tren elige una según la longitud de la ruta y la ocupación de las vías y los andenes.
TrainsStationsDescription6=<blue>2) Vehículo en el andén</>\n\nLa ventana del andén muestra el contenido del vehículo que se encuentra junto a él. Los cargadores y brazos robóticos transfieren objetos a través del andén, mientras que las bombas llenan y vacían las cisternas. En una locomotora se muestra el combustible, que también se puede suministrar a través del andén.
TrainsStationsDescription7=<blue>3) Ajustes del bloque</>\n\nEl botón del engranaje abre los ajustes de las señales que emite la estación. Consulta «Condiciones de salida» para más información.
TrainsStationsDescription8=<blue>4) Estaciones</>\n\nMuestra las estaciones y sus coordenadas. Si hay un tren en una estación, su número aparece junto a ella.
TrainsStationsDescription9=<blue>5) Detalles de la estación</>\n\nAquí puedes cambiar el nombre de la estación y consultar sus coordenadas y su número de andenes. Debajo se indica cuántos trenes usan ese nombre de estación en su itinerario.
TrainsStationsDescription10=<blue>6) Abrir el tren</>\n\nAbre el itinerario del tren que está en la estación.
TrainsConsist=Locomotoras y vagones
TrainsConsistDescription1=Con una locomotora o un vagón en la mano, apunta a una vía o estación y pulsa <blue>{key:ActionPrimary}</>. Comprueba su orientación antes de colocarlo. Pulsa <blue>{key:ActionRotate}</> para darle la vuelta. Para añadir un vagón a un tren, colócalo detrás del tren mientras este se encuentre en una estación.
TrainsConsistDescription2=Un tren puede avanzar en una dirección si al menos una locomotora está orientada en ese sentido. Con una sola locomotora necesita un bucle para regresar. Para viajar entre dos vías sin salida, coloca dos locomotoras orientadas en sentidos opuestos.
TrainsConsistDescription3=Una locomotora tiene dos ranuras para el mismo combustible que usan los hornos. Cada locomotora con combustible orientada en el sentido de la marcha aumenta la fuerza de tracción. El tren se vuelve más pesado a medida que se cargan los vagones.
TrainsConsistDescription4=Un {item:CargoWagon} admite 10 pilas de objetos. Un {item:TankWagon} transporta un solo tipo de fluido a la vez.
TrainsConsistDescription5=Apunta a un vehículo y pulsa <blue>{key:ActionSecondary}</> para abrir su ventana. Para desmontar un tren en una estación, usa {item:Multitool}: devuelve el vehículo seleccionado a tu inventario.
TrainsConsistDescription6=<blue>1) Interruptor</>\n\nAl apagar un tren, este frena y permanece en su sitio. Vuelve a encenderlo para que continúe su itinerario.
TrainsConsistDescription7=<blue>2) Estado</>\n\nBajo el nombre o número del tren aparecen el número del vehículo y el estado del tren. También se indica en qué estación está detenido o a cuál se dirige.
TrainsConsistDescription8=<blue>3) Contenido</>\n\nEl combustible de la locomotora o la carga del vagón.
TrainsConsistDescription9=<blue>4) Itinerario</>\n\nAbre el itinerario de este tren en la ventana de trenes.
TrainsConsistDescription10=<blue>5) Información al apuntar</>\n\nApunta a un vehículo para ver su contenido y el estado del tren.
TrainsSchedule=Itinerario
TrainsScheduleDescription1=Abre la ventana de trenes con <blue>{key:Trains}</> o con el botón «Itinerario» de la ventana de un vehículo. La estación donde colocaste un tren nuevo ya figura en su itinerario. Añade otra parada para definir su ruta.
TrainsScheduleDescription2=<blue>1) Trenes</>\n\nSelecciona un tren de la lista para abrir su itinerario. Búscalo por nombre, número (como #12) o por el nombre de una estación de su ruta.
TrainsScheduleDescription3=<blue>2) Nombre del tren</>\n\nIntroduce aquí el nombre del tren. Mientras el campo esté vacío, la lista mostrará su número.
TrainsScheduleDescription4=<blue>3) Repetir el itinerario</>\n\nCon la repetición activada, el tren regresa a la primera parada después de la última. Desactívala para terminar el trayecto en la última estación.
TrainsScheduleDescription5=<blue>4) Salir ahora</>\n\n«Salir ahora» omite la condición de salida de la parada actual. Está disponible cuando el tren está en su estación y tiene otra parada en su itinerario.
TrainsScheduleDescription6=<blue>5) Mostrar ruta</>\n\n«Mostrar ruta» abre un esquema de la ruta hasta la siguiente estación.
TrainsScheduleDescription7=<blue>6) Seleccionar parada</>\n\nHaz clic en la flecha junto a una parada para enviar allí el tren. Puedes cambiar el destino durante la marcha. La parada actual aparece resaltada, con el estado del tren debajo.
TrainsScheduleDescription8=<blue>7) Estación</>\n\nElige en la lista la estación a la que debe ir el tren.
TrainsScheduleDescription9=<blue>8) Orden de las paradas</>\n\nLas flechas suben o bajan una parada y la cruz la elimina. El botón <blue>+ Añadir parada</> está debajo de la lista.
TrainsScheduleDescription10=<blue>9) Condición de salida</>\n\nDefine cuándo puede salir el tren de esta parada. Consulta «Condiciones de salida» para más información.
TrainsScheduleDescription11=El panel «Composición», a la derecha, muestra las locomotoras, los vagones y su contenido.
TrainsConditions=Condiciones de salida
TrainsConditionsDescription1=Cada parada puede tener una condición de salida, como esperar a una carga completa o durante un tiempo determinado. Las condiciones pueden usar las señales de la propia estación y las que recibe por los cables conectados a sus andenes.
TrainsConditionsDescription2=<blue>1) Modo</>\n\nElige <blue>Expr</> para comparar una señal con un número u otra señal. Para combinar condiciones, elige <blue>And</>, <blue>Or</> o <blue>Xor</> y añádelas con el botón +.\n\nAnd exige que se cumplan todas las condiciones, Or que se cumpla al menos una y Xor que se cumpla un número impar. <blue>Always</> permite salir en cuanto llega el tren.
TrainsConditionsDescription3=<blue>2) Indicador</>\n\nEl indicador se pone verde cuando se cumple la condición y rojo en caso contrario.
TrainsConditionsDescription4=<blue>3) Señal</>\n\nHaz clic para elegir una señal que comparar. También puedes elegir un objeto para comparar su cantidad.
TrainsConditionsDescription5=<blue>4) Comparación</>\n\nElige si los valores deben ser iguales (=), distintos (!=), o si el primero debe ser mayor (>) o menor (<) que el segundo. Los signos >= y <= también admiten la igualdad.
TrainsConditionsDescription6=<blue>5) Valor</>\n\nUn número o una segunda señal con la que comparar la primera.
TrainsConditionsDescription7=<blue>6) Señales de la estación</>\n\nActiva las señales que necesites en los ajustes de la estación. «Contenido almacenado» emite la cantidad de cada objeto y fluido en los vagones como una señal independiente.\n\nPor defecto, <blue>P</> indica el tiempo en la estación en ticks e <blue>I</> los ticks desde el último cambio en la carga. <blue>F</> indica la cantidad total de objetos de combustible en las locomotoras.\n\nCuando el tren está completamente cargado, <blue>L</> vale 1; cuando está vacío, <blue>E</> vale 1. Estas señales tienen en cuenta todos los vagones de carga y cisterna del tren.
TrainsConditionsDescription8=<blue>7) Valores</>\n\nLos valores actuales de las señales que emite la estación.
TrainsConditionsDescription9=Usa <blue>L = 1</> para salir tras completar la carga y <blue>E = 1</> tras la descarga. Para esperar a que cese la carga aunque el vagón solo esté parcialmente lleno, usa <blue>I >= 100</>: el tren saldrá después de cinco segundos sin cambios en la carga.\n\nEl tiempo se mide en ticks, a razón de 20 por segundo. Por tanto, la condición <blue>P >= 600</> mantiene el tren en la estación durante 30 segundos.
TrainsSignals=Señales ferroviarias
TrainsSignalsDescription1=Las señales dividen las vías en bloques. Antes de entrar en un bloque, el tren lo reserva y los demás esperan a que quede libre. Al sostener una señal, los bloques aparecen resaltados con distintos colores.
TrainsSignalsDescription2=Con una señal en la mano, apunta a la vía. La vista previa aparece en el nodo más cercano, a la derecha en el sentido de circulación. Pulsa <blue>{key:ActionRotate}</> para invertir el sentido y <blue>{key:ActionPrimary}</> para colocarla.\n\nPara quitarla, vuelve a hacer clic en ella con una señal en la mano o usa {item:Multitool}.
TrainsSignalsDescription3={item:RailSignal} permite entrar en un bloque libre. {item:RailChainSignal} comprueba la ruta del tren hasta la siguiente señal normal, incluido el bloque que hay tras ella.\n\nColoca una señal en cadena antes de una bifurcación y una normal después. Así el tren esperará a que la salida quede libre antes de entrar en la bifurcación. El bloque tras la señal de salida debe ser lo bastante largo para todo el tren.
TrainsSignalsDescription4=Una señal establece el sentido permitido a través de su nodo. En una vía de doble sentido, coloca dos señales orientadas en sentidos opuestos en el mismo nodo.
TrainsSignalsDescription5=La <red>luz roja</> impide el paso y la <green>verde</> lo permite. La <yellow>amarilla</> se enciende cuando el bloque está reservado por un tren que pasará por esa señal.\n\nEn una señal en cadena, el verde significa que al menos una salida está libre. El tren avanzará cuando esté libre la salida de su propia ruta.
TrainsSignalsDescription6=<blue>1) Ventana del nodo de vía</>\n\nApunta a un nodo de vía y pulsa <blue>{key:ActionSecondary}</> para abrir su ventana. Cada señal tiene una fila de tres indicadores que reproducen sus luces. El interruptor cierra todas las señales del nodo; al encenderlo de nuevo recuperan su funcionamiento normal.
TrainsSignalsDescription7=<blue>2) Ajustes del bloque</>\n\nEl botón del engranaje abre los ajustes de señales lógicas. El nodo emite <blue>R</>, <blue>Y</> y <blue>G</>, que indican cuántas señales tienen luz roja, amarilla y verde, respectivamente.\n\nPara controlar las señales mediante un cable, activa la entrada «Funcionamiento» (<blue>W</>). Un valor mayor que 0 permite el paso, pero las señales siguen comprobando si la vía está ocupada.
TrainsWaiting=Estados del tren
TrainsWaitingDescription1=El estado del tren aparece en la lista de trenes, en la parada actual y al apuntar a un vehículo. Si se retrasa durante el trayecto, el tren busca periódicamente otras rutas hacia su destino.
TrainsWaitingDescription2=<blue>1) Mostrar ruta</>\n\nUna línea verde con flechas muestra la ruta prevista. Si no se ha encontrado ninguna, las líneas rojas muestran las vías exploradas durante la búsqueda. Una marca roja indica dónde no pudo continuar la búsqueda.
TrainsWaitingDescription3=<blue>2) Estado</>\n\nIndica qué hace el tren o qué le impide avanzar.
TrainsWaitingDescription4=<blue>Condición de salida</> significa que el tren espera a la carga, la descarga u otra condición de su itinerario. Si muestra <blue>Sin próxima parada</>, comprueba el itinerario: ha terminado o contiene el nombre de una estación que ya no existe.\n\nCon <blue>Sin ruta</>, revisa las conexiones de las vías, el sentido de las estaciones y señales y la orientación de las locomotoras. <blue>Andenes ocupados</> significa que las estaciones con el nombre requerido ya están reservadas por otros trenes.\n\n<blue>Señal roja</> y <blue>Tren delante</> explican una parada durante el trayecto: una señal impide el paso o hay otro tren bloqueando la vía.\n\nSi aparece <blue>Detenido</>, enciende el tren desde la ventana de un vehículo. <blue>Sin locomotora</> indica que necesita una locomotora orientada en el sentido de la marcha. <blue>Sin combustible</> significa que hay que reabastecer las locomotoras que tiran del tren.
