[tips]
StackTransfers=Stack transfers
StackTransfersDescription=<blue>Shift + Left-click</>: Transfers a single stack\n<blue>Shift + Right-click</>: Transfers a half of stack\n\n<blue>Control + Left-click</>: Transfers all stacks of the given type\n<blue>Control + Right-click</>: Transfers half of items of the given type\n\n<blue>Control + Left-click on empty slot</>: transfer the whole inventory\n<blue>Control + Right-click on empty slot</>: transfer a half of whole inventory\n\n<blue>Alt + Left-click</>: transfer five items\n<blue>Alt + Right-click</>: transfer one item
ChestLimiting=Chest limiting
ChestLimitingDescription=
Screwdriver=Screwdriver
ScrewdriverDescription=Press <blue>Left Mouse Button</> while holding a <blue>Screwdriver</> and drag to one of arrow directions then release button to rotate block. At the moment only single cell blocks can be rotatared with this method.\n\nRotation depends on the plane you are hovering over.\nAfter releasing the button, the plane will rotate in such a way that it replaces the plane indicated by the selected arrow
RotationWhileBuilding=Rotation while building
RotationWhileBuildingDescription=Press <blue>R</> to rotate the block around vertical axis.\nYou can change this axis by holding <blue>Shift</> or <blue>Alt</> key.\nActive axis will be shown with green arrow and axis like in piclure above.\n\nWhile holding some buildable item you can hold <blue>Right Mouse Button</> and drag to one of arrow directions then release button to rotate block. This method allows rotation of blocks with any size.
BlockPipette=Block pipette
BlockPipetteDescription=Press <blue>Q</> to copy hovered block with its rotation. Press <blue>Q</> again to clear selection.\nIt is always working in Creative mode and only when you have same item in inventory in Normal mode\n\nPress <blue>Ctrl+C</> to copy settings from hovered block\nPress <blue>Ctrl+V</> to paste setting from clipboard to hovered block\n\nBlock settings availible not for all blocks. All block settings is just a text.
FirstSteps=First steps
FirstStepsDescription=Finding and Smelting Copper Ore (Malachite, Chalcopyrite)\n\n1. First, locate copper ore: Malachite or Chalcopyrite. Areas where ore is visible on the ground usually have more deposits nearby or just below the surface.\n2. Gather the copper ore.\n3. Use basic blocks from your inventory to create a platform for convenience.\n4. Craft a furnace and a smelter. Place the smelter above the furnace.\n5. Put fuel in the furnace and place the copper ore in the smelter.\n6. Once the smelting process is complete, collect the copper ingots.\n\nBuilding Essential Machinery\n\n1. Create another furnace, a Stirling engine, a compact generator, and a computer.\n2. Arrange these components according to their inputs and outputs.\n3. Once the computer is operational, you can start researching new technologies.
Interface=Interface
Map=Map
InterfaceDescription1=<blue>1) Hotbar</>\n\nAt the beginning, the currently held item is displayed along with its name above it.\nAfter it, quick access slots are shown. These can be selected by mouse click or the corresponding number key.\nThe hotbar holds items by type and draws them directly from the player's inventory.\n
InterfaceDescription2=<blue>2) Player Inventory</>\n\nThe main section consists of a grid of item slots.\nLeft-click an item to pick it up. Click on a slot again to place the item there. Click on another item to swap them.\n\nAt the bottom, there are dedicated slots for the jetpack, lighting, inventory sorting, and dropping items on the ground.\nBelow that are the tools: a multitool for digging and a screwdriver for rotating blocks.\n
InterfaceDescription3=<blue>3) Miscellaneous</>\n\nThe top row contains time control buttons for the in-game time. Currently, these only affect visuals. At the end of the row is a button that stops the day-night cycle.\n\nThe second row includes a button showing research progress, followed by the tutorial button that opens this guide.\nNext is the creative mode toggle (invisible in non-creative games), then a flight mode toggle, and finally a button to highlight block inputs and outputs.\n
InterfaceDescription4=<blue>4) Player Crafting Window</>\n\nThis row contains the tab selection for the section below.\nFirst is the list of all unlocked items. Next is the Favorites tab. To add or remove an item from Favorites, right-click the item in the list below and select Toggle Favourite from the dropdown menu.\nThen comes the tab for all items available in the game. Finally, there is the Search Results tab and a text field for item search.\n
InterfaceDescription5=<blue>5) Selected Tab Contents</>\n\nDisplays the items from the selected tab, grouped into categories.\nThe number in each cell shows how many of that item can currently be crafted.\n\nLeft-clicking an item will queue 1 unit if enough resources are available, Shift + left-click queues as many as the resources allow.\n\nRight-clicking opens a context menu where you can queue multiple items, open the recipe window (Show Recipes), add all components of the item to the search (Context Search), or mark the item as a favorite (Toggle Favourite).\n
InterfaceDescription6=<blue>6) Selected Block Window</>\n\nRight-clicking a block while aiming at it opens the block's interface.\nAt the top, you'll find the power toggle and settings buttons, followed by the block’s name and tier.\nBelow that is the input inventory, along with a status indicator and a current recipe indicator (hover over it for details).\nNext comes the progress bar for the active recipe. Some machines also have a second bar that shows bonus production.\nWhen the main progress bar is full, the recipe is completed. When the bonus bar is full, a bonus item is produced.\nBelow that is the output inventory.\nAt the very bottom, other block statuses are displayed.\n
InterfaceDescription7=<blue>7) Block Minipanel (Under Crosshair)</>\n\nDisplays the name, icon, and brief information about the block the player is currently looking at.\n
MapDescription=Press <blue>M</> to open the map. The map shows explored regions, your position, and any markers.
Research=Research
ResearchDescription=Research unlocks new recipes and blocks. Earn research points to progress through the tech tree.
ResearchComputersDescription1=Research points are produced by computers only. A computer consumes electricity and adds points to the selected research once per second. Without electricity it produces nothing.
ResearchComputersDescription2=The rate depends on the computer tier: {item:CopperComputer} — 1 point per second, {item:SteelComputer} — 2, each next tier twice as much. Points of all working computers go into the same research and sum up.
ResearchComputersDescription3=Every computer has a chip slot for 3 chips of its own tier: {item:Circuit} for {item:CopperComputer}, {item:AdvancedCircuit} for {item:SteelComputer}. One chip is consumed per 30 seconds of boost, and the next chip is taken only after the current boost ends.
ResearchComputersDescription4=Boosted rate: {item:CopperComputer} — 10 points per second, {item:SteelComputer} — 100, each next tier ten times as much.
Productivity=Productivity
ProductivityDescription1=The second progress bar next to the recipe bar is Productivity. The bar fills while the machine works, and when it is full the machine gives one extra output. The extra output costs no input.
ProductivityDescription2=Productivity works on ore recipes of {machine:AutomaticHammer}, {machine:Macerator}, {machine:OreWasher}. Ore processed in them gives more plates than ore smelted directly.
BuildingModes=Building modes
BuildingModesDescription1=Machines and most blocks are built in a line: hold <blue>Left Mouse Button</> and drag away from the first cell, release to place the whole line at once.
BuildingModesDescription2=Platforms and other simple blocks fill a plane: hold <blue>Left Mouse Button</> and drag, the plane is picked by the direction you move first.
BuildingModesDescription3=Conveyors, pipes and cables are built as a run in two clicks: the first click anchors the start, the second builds the run, <blue>Right Mouse Button</> cancels it. Hold <blue>Shift</> to route the run around obstacles.\n\n<blue>Mouse Wheel</> raises and lowers the aim in every mode.
Trains=Vonatok
TrainsDescription1=A {research:Railway} kutatás feloldja a következők receptjeit: {item:SteelRail}, {item:RailStation}, {item:Locomotive}, {item:CargoWagon} és {item:TankWagon}. A {item:RailSignal} és {item:RailChainSignal} jelzők a {research:RailSignals} kutatás után válnak elérhetővé.
TrainsDescription2=<blue>Az első vonal</>\n\nKezdj két állomással, amelyeket egy zárt sínpálya köt össze. Mindkét állomáson helyezz el két peront közvetlenül egymás után, azonos irányba fordítva. Az állomásokat úgy tájold, hogy a vonat a lámpák nélküli végükön hajtson be, és a lámpák felé haladjon.\n\nAz első állomásra egy {item:Locomotive}, mögé pedig egy {item:CargoWagon} kerüljön. Mindkét állomáson tegyél rakodót vagy robotkart a tehervagon peronja mellé: az elsőn berakodáshoz, a másodikon kirakodáshoz.\n\nAdd a második állomást a menetrendhez, és kapcsold be „A menetrend ismétlése” lehetőséget. A rakodóállomáson <blue>L = 1</>, a kirakodóállomáson <blue>E = 1</> legyen az indulási feltétel. Így a vonat indulás előtt megvárja a teljes berakodást, illetve kirakodást. A beállításról az „Indulási feltételek” részben olvashatsz.\n\nTegyél tüzelőanyagot a mozdonyba a vonat elindításához.
TrainsDescription3=A vonatok és állomások listáját a <blue>{key:Trains}</> megnyomásával nyithatod meg.
TrainsRails=Sínek
TrainsRailsDescription1=Vedd kézbe a {item:SteelRail} tárgyat, majd a kiválasztott helyen nyomd meg a <blue>{key:ActionPrimary}</> gombot egy síncsomópont elhelyezéséhez. Minden új csomópont az előzőhöz csatlakozik. Új lánc kezdésekor a játék megpróbálja az első csomópontot a legközelebbi, 24 cellán belüli csomóponthoz kapcsolni.\n\nElhelyezés előtt ellenőrizd az előnézetet: a zöld megépíthető kapcsolatot jelent, a piros azt, hogy a kapcsolat nem megfelelő. Az építési magasságot az <blue>egérgörgővel</> állíthatod.
TrainsRailsDescription2=A láncot a <blue>{key:ActionSecondary}</> megnyomásával zárhatod le. Ha egy meglévő csomópontból szeretnéd folytatni a pályát, célozz rá, és nyomd meg a <blue>{key:ActionPrimary}</> gombot. Ezután kattints egy másik csomópontra az összekötésükhöz. Ha már össze vannak kötve, a kattintás eltávolítja ezt a pályaszakaszt.
TrainsRailsDescription3=A csomópontok 1–32 cellás vízszintes távolságban köthetők össze. A kanyarokhoz legalább 3 cellás sugár kell, egy szakasz legfeljebb 120°-ot fordulhat. A legnagyobb emelkedés 25%. Ha egy kapcsolat nem építhető meg, egy üzenet jelzi az okát.
TrainsRailsDescription4=Elágazás építéséhez csatlakoztass több pályát a csomópont ugyanazon oldalához. A vonatok az útvonaluknak megfelelő ágat választják.
TrainsRailsDescription5=Az egy egyenesbe eső szomszédos csomópontok automatikusan összekapcsolódnak. Minden új csomópont egy {item:SteelRail} tárgyat használ fel. Egy csomópont eltávolításakor a hozzá kapcsolódó sínszakaszok is eltűnnek. A tervrajzok a csomópontokat a kapcsolataikkal együtt tárolják.
TrainsRailsDescription6=A vonatok az éles kanyarokban lassítanak. Emelkedőn a sebesség a szerelvény tömegétől és a mozdonyok vonóerejétől függ.
TrainsStations=Állomások
TrainsStationsDescription1=Minden {item:RailStation} blokk egy mozdonynak vagy vagonnak megfelelő peront ad. Az állomási megálláshoz a vonatnak a lámpák nélküli végén kell behajtania, a túlsó vég lámpái felé haladva.
TrainsStationsDescription2=Az egy irányba néző, közvetlenül egymás után elhelyezett peronok egy állomást alkotnak. Építs minden mozdonynak és vagonnak egy peront, hogy a teljes szerelvényt kiszolgálhasd.
TrainsStationsDescription3=A <yellow>sárga lámpa</> akkor világít, ha egy vonat az állomás felé tart. A <red>piros lámpa</> a megállás alatt, a <green>zöld lámpa</> induláskor világít. A villogó piros késleltetett indulást jelez, például tüzelőanyaghiány miatt.
TrainsStationsDescription4=Célozz egy peronra, és nyomd meg a <blue>{key:ActionSecondary}</> gombot az állomás ablakának megnyitásához.
TrainsStationsDescription5=<blue>1) Az állomás neve</>\n\nA menetrend név alapján azonosítja az állomásokat. Ha több állomás neve azonos, a vonat az útvonal hossza, valamint a pályák és peronok foglaltsága alapján választ közülük.
TrainsStationsDescription6=<blue>2) Jármű a peronnál</>\n\nA peron ablaka az ott álló jármű tartalmát mutatja. A rakodók és robotkarok a peronon keresztül adnak át tárgyakat, a szivattyúk pedig a tartálykocsikat töltik és ürítik. Mozdonynál a tüzelőanyag látható itt; ezt szintén a peronon át lehet betölteni.
TrainsStationsDescription7=<blue>3) Blokkbeállítások</>\n\nA fogaskerék gomb az állomás által kiadott jelek beállításait nyitja meg. További részletek az „Indulási feltételek” részben.
TrainsStationsDescription8=<blue>4) Állomások</>\n\nAz állomásokat és a koordinátáikat mutatja. Ha egy vonat az állomáson áll, a száma is megjelenik mellette.
TrainsStationsDescription9=<blue>5) Az állomás adatai</>\n\nItt átnevezheted az állomást, és megnézheted a koordinátáit, illetve a peronok számát. Alatta látható, hány vonat menetrendjében szerepel ez az állomásnév.
TrainsStationsDescription10=<blue>6) A vonat megnyitása</>\n\nMegnyitja az állomáson álló vonat menetrendjét.
TrainsConsist=Mozdonyok és vagonok
TrainsConsistDescription1=Vedd kézbe a mozdonyt vagy vagont, célozz a pályára vagy egy állomásra, és nyomd meg a <blue>{key:ActionPrimary}</> gombot. Elhelyezés előtt ellenőrizd, merre néz. A <blue>{key:ActionRotate}</> megnyomásával megfordíthatod. Ha vagont szeretnél hozzáadni egy vonathoz, tedd az állomáson álló szerelvény mögé.
TrainsConsistDescription2=A vonat akkor tud egy adott irányba haladni, ha legalább egy mozdonya arra néz. Egyetlen mozdonnyal a visszatéréshez hurok kell. Két zsákvágány közötti közlekedéshez helyezz el két, ellentétes irányba néző mozdonyt.
TrainsConsistDescription3=A mozdonynak két tüzelőanyaghelye van, és ugyanazt a tüzelőanyagot használja, mint a kemence. Minden feltöltött, menetirányba néző mozdony növeli a vonóerőt. A vagonok feltöltésével a szerelvény egyre nehezebb lesz.
TrainsConsistDescription4=A {item:CargoWagon} 10 tárgyhalmot tárol. A {item:TankWagon} egyszerre egyféle folyadékot szállít.
TrainsConsistDescription5=Célozz egy járműre, és nyomd meg a <blue>{key:ActionSecondary}</> gombot az ablakának megnyitásához. Az állomáson álló szerelvényt a {item:Multitool} eszközzel bonthatod szét: a kiválasztott jármű visszakerül a készletedbe.
TrainsConsistDescription6=<blue>1) Kapcsoló</>\n\nA kikapcsolt vonat lefékez, majd egy helyben marad. Kapcsold vissza, hogy folytassa a menetrendjét.
TrainsConsistDescription7=<blue>2) Állapot</>\n\nA vonat neve vagy száma alatt a jármű száma és a vonat állapota látható. Itt jelenik meg az állomás is, ahol áll, vagy ahová tart.
TrainsConsistDescription8=<blue>3) Tartalom</>\n\nA mozdony tüzelőanyaga vagy a vagon rakománya.
TrainsConsistDescription9=<blue>4) Menetrend</>\n\nMegnyitja ennek a vonatnak a menetrendjét a vonatok ablakában.
TrainsConsistDescription10=<blue>5) Információ célzáskor</>\n\nCélozz egy járműre, hogy lásd a tartalmát és a vonat állapotát.
TrainsSchedule=Menetrend
TrainsScheduleDescription1=A vonatok ablakát a <blue>{key:Trains}</> megnyomásával vagy a jármű ablakának „Menetrend” gombjával nyithatod meg. Az állomás, ahol az új vonatot elhelyezted, már szerepel a menetrendjében. Adj hozzá egy másik megállót az útvonal kijelöléséhez.
TrainsScheduleDescription2=<blue>1) Vonatok</>\n\nVálassz egy vonatot a listából a menetrend megnyitásához. Kereshetsz név, szám (például #12) vagy az útvonal egyik állomásának neve alapján.
TrainsScheduleDescription3=<blue>2) A vonat neve</>\n\nItt adhatsz nevet a vonatnak. Amíg a mező üres, a listában a száma jelenik meg.
TrainsScheduleDescription4=<blue>3) A menetrend ismétlése</>\n\nBekapcsolt ismétlésnél a vonat az utolsó megálló után visszatér az elsőhöz. Kapcsold ki, ha az útvonalat az utolsó állomáson szeretnéd befejezni.
TrainsScheduleDescription5=<blue>4) Indulás most</>\n\nAz „Indulás most” átugorja az aktuális megálló indulási feltételét. Akkor használható, ha a vonat az állomásán áll, és van következő megállója a menetrendben.
TrainsScheduleDescription6=<blue>5) Útvonal megjelenítése</>\n\nAz „Útvonal megjelenítése” megnyitja a következő állomásig vezető útvonal ábráját.
TrainsScheduleDescription7=<blue>6) Megálló kiválasztása</>\n\nKattints a megálló melletti nyílra, hogy odaküldd a vonatot. A célállomást menet közben is módosíthatod. Az aktuális megálló ki van emelve, alatta a vonat állapota látható.
TrainsScheduleDescription8=<blue>7) Állomás</>\n\nVálaszd ki a listából, melyik állomásra menjen a vonat.
TrainsScheduleDescription9=<blue>8) A megállók sorrendje</>\n\nA nyilak feljebb vagy lejjebb mozgatják a megállót, a kereszt törli. A <blue>+ Megálló hozzáadása</> gomb a lista alatt található.
TrainsScheduleDescription10=<blue>9) Indulási feltétel</>\n\nMegadja, mikor hagyhatja el a vonat ezt a megállót. További részletek az „Indulási feltételek” részben.
TrainsScheduleDescription11=A jobb oldali „Szerelvény” panel mutatja a mozdonyokat, a vagonokat és a tartalmukat.
TrainsConditions=Indulási feltételek
TrainsConditionsDescription1=Minden megállóhoz beállíthatsz indulási feltételt, például teljes berakodást vagy meghatározott várakozási időt. A feltételek az állomás saját jeleit és a peronokra kötött vezetékeken érkező jeleket használhatják.
TrainsConditionsDescription2=<blue>1) Mód</>\n\nAz <blue>Expr</> móddal egy jelet számmal vagy másik jellel hasonlíthatsz össze. Több feltétel összekapcsolásához válaszd az <blue>And</>, <blue>Or</> vagy <blue>Xor</> módot, és a + gombbal adj hozzá feltételeket.\n\nAnd esetén minden feltételnek teljesülnie kell, Or esetén legalább egynek, Xor esetén páratlan számúnak. Az <blue>Always</> megérkezés után azonnal engedélyezi az indulást.
TrainsConditionsDescription3=<blue>2) Visszajelző</>\n\nA visszajelző zöld, ha a feltétel teljesül, egyébként piros.
TrainsConditionsDescription4=<blue>3) Jel</>\n\nKattints ide az összehasonlítandó jel kiválasztásához. Tárgyat is választhatsz, ekkor annak mennyiségét hasonlítod össze.
TrainsConditionsDescription5=<blue>4) Összehasonlítás</>\n\nVálaszd ki, hogy az értékek egyenlők (=), különbözők (!=), vagy az első nagyobb (>) vagy kisebb (<) legyen-e a másodiknál. A >= és <= jelek az egyenlőséget is megengedik.
TrainsConditionsDescription6=<blue>5) Érték</>\n\nEgy szám vagy egy másik jel, amellyel az elsőt összehasonlítod.
TrainsConditionsDescription7=<blue>6) Az állomás jelei</>\n\nAz állomás beállításaiban engedélyezd a szükséges jeleket. A „Tároló” minden, a vagonokban lévő tárgy és folyadék mennyiségét külön jelként adja ki.\n\nAlapértelmezés szerint a <blue>P</> az állomáson töltött időt mutatja tickben, az <blue>I</> pedig a rakomány legutóbbi változása óta eltelt tickek számát. Az <blue>F</> a mozdonyokban tárolt tüzelőanyagok összes darabszámát mutatja.\n\nTeljesen megrakott vonatnál az <blue>L</> értéke 1, üres vonatnál az <blue>E</> értéke 1. Ezek a jelek a szerelvény minden tehervagonját és tartálykocsiját figyelembe veszik.
TrainsConditionsDescription8=<blue>7) Értékek</>\n\nAz állomás által kiadott jelek aktuális értékei.
TrainsConditionsDescription9=A teljes berakodás utáni induláshoz használd az <blue>L = 1</>, a kirakodás utánihoz az <blue>E = 1</> feltételt. Ha a berakodás végére szeretnél várni akkor is, ha a vagon csak részben telt meg, állítsd be az <blue>I >= 100</> feltételt: a vonat öt másodperccel a rakomány utolsó változása után indul.\n\nAz időt tickben mérjük, másodpercenként 20 tickkel. A <blue>P >= 600</> feltétel ezért 30 másodperces állomási várakozást jelent.
TrainsSignals=Vasúti jelzők
TrainsSignalsDescription1=A jelzők blokkokra osztják a pályát. Belépés előtt a vonat lefoglalja a blokkot; a többi vonat megvárja, amíg az felszabadul. Amíg jelzőt tartasz a kezedben, a blokkok különböző színekkel látszanak.
TrainsSignalsDescription2=Vedd kézbe a jelzőt, és célozz a pályára. Az előnézet a legközelebbi csomópontnál, menetirány szerint a jobb oldalon jelenik meg. A <blue>{key:ActionRotate}</> megfordítja az irányát, a <blue>{key:ActionPrimary}</> elhelyezi.\n\nEltávolításához kattints rá újra, miközben jelzőt tartasz a kezedben, vagy használd a {item:Multitool} eszközt.
TrainsSignalsDescription3=A {item:RailSignal} szabad blokkba engedi be a vonatot. A {item:RailChainSignal} a következő normál jelzőig ellenőrzi a vonat útvonalát, beleértve a jelző utáni blokkot is.\n\nAz elágazás elé láncjelzőt, utána normál jelzőt helyezz. Így a vonat az elágazás előtt várja meg a szabad kijáratot. A kijárati jelző utáni blokkban el kell férnie a teljes szerelvénynek.
TrainsSignalsDescription4=A jelző meghatározza a csomóponton megengedett haladási irányt. Kétirányú pályán ugyanahhoz a csomóponthoz helyezz két, ellentétes irányú jelzőt.
TrainsSignalsDescription5=A <red>piros fény</> lezárja az áthaladást, a <green>zöld</> engedélyezi. A <yellow>sárga</> akkor világít, ha a blokkot egy olyan vonat foglalta le, amely ennél a jelzőnél fog áthaladni.\n\nLáncjelzőnél a zöld azt jelenti, hogy legalább egy kijárat szabad. A vonat akkor halad tovább, ha a saját útvonalának kijárata szabad.
TrainsSignalsDescription6=<blue>1) A síncsomópont ablaka</>\n\nCélozz a síncsomópontra, és nyomd meg a <blue>{key:ActionSecondary}</> gombot az ablak megnyitásához. Minden jelzőnek három lámpából álló sora van, amely a jelző fényeit mutatja. A kapcsoló lezárja a csomópont összes jelzőjét; visszakapcsolása helyreállítja a normál működést.
TrainsSignalsDescription7=<blue>2) Blokkbeállítások</>\n\nA fogaskerék gomb a logikai jelek beállításait nyitja meg. A csomópont <blue>R</>, <blue>Y</> és <blue>G</> jelei a piros, sárga, illetve zöld fényt mutató jelzők számát adják meg.\n\nVezetékes vezérléshez engedélyezd a „Működés” bemenetet (<blue>W</>). A 0-nál nagyobb érték megengedi az áthaladást, de a jelzők továbbra is ellenőrzik a pálya foglaltságát.
TrainsWaiting=A vonat állapotai
TrainsWaitingDescription1=A vonat állapota a vonatlistában, az aktuális megállónál és a járműre célzáskor látható. Ha útközben várakoznia kell, a vonat időnként más útvonalakat keres a célállomáshoz.
TrainsWaitingDescription2=<blue>1) Útvonal megjelenítése</>\n\nA tervezett útvonalat zöld vonal és nyilak jelzik. Ha a keresés nem talált útvonalat, piros vonalak mutatják a megvizsgált pályákat. A piros jelölő azt mutatja, ahol a keresés nem tudott továbbhaladni.
TrainsWaitingDescription3=<blue>2) Állapot</>\n\nMegmutatja, mit csinál a vonat, vagy mi akadályozza a továbbhaladását.
TrainsWaitingDescription4=Az <blue>Indulási feltétel</> azt jelenti, hogy a vonat berakodásra, kirakodásra vagy a menetrend más feltételére vár. A <blue>Nincs következő megálló</> esetén ellenőrizd a menetrendet: véget ért, vagy már nem létező állomást nevez meg.\n\nA <blue>Nincs útvonal</> esetén ellenőrizd a sínkapcsolatokat, az állomások és jelzők irányát, valamint a mozdonyok tájolását. A <blue>Foglalt peronok</> azt jelenti, hogy a szükséges nevű állomásokat más vonatok már lefoglalták.\n\nA <blue>Piros jelző</> és <blue>Vonat van előtte</> az útközbeni megállás okát mutatja: vagy egy jelző zárta le az áthaladást, vagy egy másik vonat áll az útban.\n\nA <blue>Leállítva</> esetén kapcsold be a vonatot egy jármű ablakában. A <blue>Nincs mozdony</> azt jelenti, hogy menetirányba néző mozdonyra van szükség. A <blue>Nincs tüzelőanyag</> azt jelzi, hogy a vonatot húzó mozdonyoknak tüzelőanyag kell.
