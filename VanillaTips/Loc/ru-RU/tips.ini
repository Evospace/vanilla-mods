[tips]
StackTransfers=Перенос стопок
StackTransfersDescription=<blue>Shift + левый клик</>: перенести одну стопку\n<blue>Shift + правый клик</>: перенести половину стопки\n\n<blue>Control + левый клик</>: перенести все стопки этого предмета\n<blue>Control + правый клик</>: перенести половину предметов этого типа\n\n<blue>Control + левый клик по пустому слоту</>: перенести весь инвентарь\n<blue>Control + правый клик по пустому слоту</>: перенести половину всего инвентаря\n\n<blue>Alt + левый клик</>: перенести пять предметов\n<blue>Alt + правый клик</>: перенести один предмет
ChestLimiting=Ограничение сундука
ChestLimitingDescription=
Screwdriver=Отвёртка
ScrewdriverDescription=Держа <blue>Отвёртку</>, зажмите <blue>левую кнопку мыши</>, потяните в сторону одной из стрелок и отпустите кнопку — блок повернётся. Пока так поворачиваются только блоки размером в одну клетку.\n\nПоворот зависит от грани, на которую наведён курсор.\nПосле отпускания кнопки блок поворачивается так, что эта грань встаёт на место грани, на которую указывает выбранная стрелка
RotationWhileBuilding=Поворот при строительстве
RotationWhileBuildingDescription=<blue>R</> поворачивает блок вокруг вертикальной оси.\nОсь меняется удержанием <blue>Shift</> или <blue>Alt</>.\nАктивная ось показана зелёной стрелкой и осью, как на картинке выше.\n\nДержа в руке строительный предмет, можно зажать <blue>правую кнопку мыши</>, потянуть в сторону одной из стрелок и отпустить кнопку — блок повернётся. Так поворачиваются блоки любого размера.
Accessors1=Входы и выходы I
Accessors1Description=У большинства блоков есть входы и/или выходы. Их цвет показывает вид энергии:\nжёлтый — <yellow>кинетика</>, синий — <blue>электричество</>, красный — <red>тепло</>.\n\nОтдельной пометки, вход это или выход, на блоке нет, но обычно это понятно по назначению блока. Кроме того, это сказано в описании предмета.\n\nПри строительстве входы и выходы видны так, как на картинке выше. Чтобы передать энергию от блока к блоку, их ставят так, чтобы входы и выходы одного вида касались друг друга. Для каждого вида энергии есть свои проводники: кабели для электричества, тепловые трубы для тепла и маховики для кинетики.
BlockPipette=Пипетка блоков
BlockPipetteDescription=<blue>Q</> копирует блок под курсором вместе с его поворотом. Повторное <blue>Q</> сбрасывает выбор.\nВ творческом режиме работает всегда, в обычном — только если такой предмет есть в инвентаре\n\n<blue>Ctrl+C</> копирует настройки блока под курсором\n<blue>Ctrl+V</> вставляет настройки из буфера обмена в блок под курсором\n\nНастройки есть не у всех блоков. Настройки блока — это обычный текст.
FirstSteps=Первые шаги
FirstStepsDescription=Поиск и выплавка медной руды (малахит, халькопирит)\n\n1. Найдите медную руду: малахит или халькопирит. Там, где руда видна на поверхности, обычно рядом или чуть глубже есть ещё.\n2. Добудьте медную руду.\n3. Для удобства постройте площадку из базовых блоков из инвентаря.\n4. Скрафтите печь и плавильню. Поставьте плавильню на печь.\n5. Положите топливо в печь, а медную руду — в плавильню.\n6. Когда плавка закончится, заберите медные слитки.\n\nПервые машины\n\n1. Сделайте ещё одну печь, двигатель Стирлинга, компактный генератор и компьютер.\n2. Расставьте их так, чтобы входы и выходы совпали.\n3. Когда компьютер заработает, можно начинать исследования.
Interface=Интерфейс
Map=Карта
InterfaceDescription1=<blue>1) Панель быстрого доступа</>\n\nВ начале панели показан предмет в руке, над ним — его название.\nДальше идут слоты быстрого доступа. Они выбираются кликом мыши или цифровой клавишей.\nПанель хранит предметы по типу и берёт их прямо из инвентаря игрока.\n
InterfaceDescription2=<blue>2) Инвентарь игрока</>\n\nОсновная часть — сетка слотов.\nЛевый клик по предмету берёт его. Клик по слоту кладёт предмет туда. Клик по другому предмету меняет их местами.\n\nВнизу — отдельные слоты для джетпака и освещения, кнопки сортировки инвентаря и выброса предметов на землю.\nНиже — инструменты: мультитул для копания и отвёртка для поворота блоков.\n
InterfaceDescription3=<blue>3) Разное</>\n\nВ верхнем ряду — кнопки управления игровым временем. Пока они влияют только на картинку. В конце ряда — кнопка, останавливающая смену дня и ночи.\n\nВо втором ряду — кнопка прогресса исследований, за ней кнопка обучения, которая открывает это руководство.\nДальше — переключатель творческого режима (не виден в обычной игре), переключатель полёта и кнопка подсветки входов и выходов блоков.\n
InterfaceDescription4=<blue>4) Окно крафта игрока</>\n\nВ этом ряду выбирается вкладка для раздела ниже.\nПервая — список всех открытых предметов. Следующая — «Избранное». Чтобы добавить предмет в избранное или убрать его оттуда, кликните по нему правой кнопкой в списке ниже и выберите Toggle Favourite в выпадающем меню.\nДальше — вкладка со всеми предметами игры. Последняя — результаты поиска и поле для поиска предметов.\n
InterfaceDescription5=<blue>5) Содержимое вкладки</>\n\nПоказывает предметы выбранной вкладки, разбитые по категориям.\nЧисло в клетке — сколько таких предметов можно скрафтить сейчас.\n\nПравый клик по предмету ставит в очередь 1 штуку, если хватает ресурсов.\n\nЛевый клик открывает контекстное меню: поставить в очередь несколько штук, открыть окно рецептов (Show Recipes), добавить все компоненты предмета в поиск (Context Search) или отметить предмет как избранный (Toggle Favourite).\n
InterfaceDescription6=<blue>6) Окно блока</>\n\nПравый клик по блоку под прицелом открывает его интерфейс.\nВверху — кнопки питания и настроек, затем название блока и его уровень.\nНиже — входной инвентарь, индикатор состояния и индикатор текущего рецепта (подробности — при наведении).\nДальше — полоса прогресса рецепта. У некоторых машин есть вторая полоса — бонусного производства.\nКогда заполняется основная полоса, рецепт завершён. Когда заполняется бонусная, машина выдаёт бонусный предмет.\nНиже — выходной инвентарь.\nВ самом низу — прочие состояния блока.\n
InterfaceDescription7=<blue>7) Мини-панель блока (под прицелом)</>\n\nПоказывает название, иконку и краткие сведения о блоке, на который смотрит игрок.\n
MapDescription=<blue>M</> открывает карту. На карте видны исследованные области, ваше положение и метки.
Research=Исследования
ResearchDescription=Исследования открывают новые рецепты и блоки. Очки исследований продвигают по дереву технологий.
ResearchComputers=Исследовательские компьютеры
ResearchComputersDescription1=Очки исследований дают только компьютеры. Компьютер потребляет электричество и раз в секунду добавляет очки к выбранному исследованию. Без электричества он ничего не даёт.
ResearchComputersDescription2=Скорость зависит от уровня компьютера: {item:CopperComputer} — 1 очко в секунду, {item:SteelComputer} — 2, каждый следующий уровень вдвое больше. Очки всех работающих компьютеров идут в одно исследование и складываются.
ResearchComputersDescription3=У каждого компьютера есть слот на 3 чипа своего уровня: {item:Circuit} для {item:CopperComputer}, {item:AdvancedCircuit} для {item:SteelComputer}. Один чип расходуется за 30 секунд ускорения, следующий берётся только после окончания текущего ускорения.
ResearchComputersDescription4=Скорость с ускорением: {item:CopperComputer} — 10 очков в секунду, {item:SteelComputer} — 100, каждый следующий уровень в десять раз больше.
Productivity=Продуктивность
ProductivityDescription1=Вторая полоса рядом с полосой рецепта — продуктивность. Она заполняется, пока машина работает, и когда заполнится, машина выдаёт один дополнительный результат. Дополнительный результат не тратит сырья.
ProductivityDescription2=Продуктивность работает на рудных рецептах машин {machine:AutomaticHammer}, {machine:Macerator}, {machine:OreWasher}. Руда, прошедшая через них, даёт больше пластин, чем руда, переплавленная сразу.
BuildingModes=Режимы строительства
BuildingModesDescription1=Машины и большинство блоков строятся линией: зажмите <blue>левую кнопку мыши</> и тяните от первой клетки, отпустите — встанет вся линия сразу.
BuildingModesDescription2=Платформы и другие простые блоки заполняют плоскость: зажмите <blue>левую кнопку мыши</> и тяните, плоскость выбирается по первому направлению движения.
BuildingModesDescription3=Конвейеры, трубы и кабели прокладываются трассой в два клика: первый клик задаёт начало, второй строит трассу, <blue>правая кнопка мыши</> отменяет. Удержание <blue>Shift</> ведёт трассу в обход препятствий.\n\n<blue>Колесо мыши</> поднимает и опускает прицел в любом режиме.
