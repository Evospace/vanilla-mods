[tips]
StackTransfers=Перенос стопок
StackTransfersDescription=<blue>Shift + левый клик</>: перенести 1 стопку\n<blue>Shift + правый клик</>: перенести предметы из этого слота, но не больше половины полной стопки\n\n<blue>Control + левый клик</>: перенести все предметы этого типа\n<blue>Control + правый клик</>: перенести половину предметов этого типа\n\n<blue>Control + левый клик по пустому слоту</>: перенести весь инвентарь\n<blue>Control + правый клик по пустому слоту</>: перенести половину предметов каждого типа из инвентаря\n\n<blue>Alt + левый клик</>: перенести 5 предметов\n<blue>Alt + правый клик</>: перенести 1 предмет
ChestLimiting=Ограничение сундука
ChestLimitingDescription=
Screwdriver=Отвёртка
ScrewdriverDescription=Держа <blue>Отвёртку</>, зажмите <blue>левую кнопку мыши</>, потяните в сторону одной из стрелок и отпустите кнопку — блок повернётся. Пока так поворачиваются только блоки размером в 1 клетку.\n\nНаправление поворота зависит от того, на какую грань блока наведён курсор.\nПосле отпускания кнопки блок поворачивается так, что эта грань встаёт на место грани, на которую указывает выбранная стрелка.
RotationWhileBuilding=Поворот при строительстве
RotationWhileBuildingDescription=<blue>R</> поворачивает блок вокруг вертикальной оси.\nОсь меняется удержанием <blue>Shift</> или <blue>Alt</>.\nЗелёный указатель показывает текущую ось вращения.\n\nДержа в руке строительный предмет, можно зажать <blue>правую кнопку мыши</>, потянуть в сторону одной из стрелок и отпустить кнопку — блок повернётся. Так поворачиваются блоки любого размера.
BlockPipette=Пипетка блоков
BlockPipetteDescription=Нажмите <blue>Q</>, чтобы выбрать для строительства блок под прицелом и сохранить его ориентацию. Нажмите <blue>Q</> ещё раз, чтобы сбросить выбор.\nВ творческом режиме это работает всегда, в обычном — только если такой предмет есть в инвентаре.\n\n<blue>Ctrl+C</> копирует настройки блока под прицелом.\n<blue>Ctrl+V</> вставляет настройки из буфера обмена в блок под прицелом.\n\nНе все блоки поддерживают копирование и вставку настроек. Скопированные настройки блока сохраняются в буфере обмена как текст.
FirstSteps=Первые шаги
FirstStepsDescription=Поиск медной руды и выплавка меди (малахит, халькопирит)\n\n1. Найдите медную руду: малахит или халькопирит. Там, где руда видна на поверхности, обычно рядом или чуть глубже есть ещё.\n2. Добудьте медную руду.\n3. Для удобства постройте площадку из базовых блоков из инвентаря.\n4. Скрафтите печь и плавильню. Поставьте плавильню на печь.\n5. Положите топливо в печь, а медную руду — в плавильню.\n6. Когда плавка закончится, заберите медные пластины.\n\nПервые машины\n\n1. Сделайте ещё одну печь, двигатель Стирлинга, компактный генератор и компьютер.\n2. Расставьте их так, чтобы входы и выходы совпали.\n3. Когда компьютер заработает, можно начинать исследования.
Interface=Интерфейс
Map=Карта
InterfaceDescription1=<blue>1) Панель быстрого доступа</>\n\nВ начале панели показан предмет в руке, над ним — его название.\nДальше идут слоты быстрого доступа. Они выбираются кликом мыши или цифровой клавишей.\nКаждому слоту панели назначается тип предмета. Сами предметы берутся из вашего инвентаря.\n
InterfaceDescription2=<blue>2) Инвентарь игрока</>\n\nОсновная часть — сетка слотов.\nЛевый клик по предмету берёт его. Клик по слоту кладёт предмет туда. Клик по другому предмету меняет их местами.\n\nВнизу — отдельные слоты для джетпака и освещения, кнопки сортировки инвентаря и выброса предметов на землю.\nНиже — инструменты: мультитул для копания и отвёртка для поворота блоков.\n
InterfaceDescription3=<blue>3) Разное</>\n\nВ верхнем ряду — кнопки управления игровым временем. Пока они влияют только на картинку. В конце ряда — кнопка, останавливающая смену дня и ночи.\n\nВо втором ряду — кнопка прогресса исследований, за ней кнопка обучения, которая открывает это руководство.\nДальше — переключатель творческого режима (не виден в обычной игре), переключатель полёта и кнопка подсветки входов и выходов блоков.\n
InterfaceDescription4=<blue>4) Окно крафта игрока</>\n\nВ этом ряду выбирается вкладка для раздела ниже.\nПервая — список всех открытых предметов. Следующая — «Избранное». Чтобы добавить предмет в избранное или убрать его оттуда, кликните по нему правой кнопкой в списке ниже и выберите Toggle Favourite в выпадающем меню.\nДальше — вкладка со всеми предметами игры. Последняя — результаты поиска и поле для поиска предметов.\n
InterfaceDescription5=<blue>5) Содержимое вкладки</>\n\nПоказывает предметы выбранной вкладки, разбитые по категориям.\nЧисло в клетке — сколько таких предметов можно скрафтить сейчас.\n\nЛевый клик по предмету ставит в очередь одну штуку, если хватает материалов. Shift + левый клик — сколько позволяют материалы, но не больше одной стопки.\n\nПравый клик открывает контекстное меню: поставить в очередь несколько штук, открыть окно рецептов (Show Recipes), добавить все компоненты предмета в поиск (Context Search) или отметить предмет как избранный (Toggle Favourite).\n
InterfaceDescription6=<blue>6) Окно блока</>\n\nПравый клик по блоку под прицелом открывает его интерфейс.\nВверху — кнопки питания и настроек, затем название блока и его уровень.\nНиже — входной инвентарь, индикатор состояния и индикатор текущего рецепта (подробности — при наведении).\nДальше — полоса прогресса рецепта. У некоторых машин есть вторая полоса — продуктивности.\nКогда заполняется основная полоса, изготовление завершено. Когда заполняется полоса продуктивности, машина выдаёт дополнительный предмет.\nНиже — выходной инвентарь.\nВ самом низу — прочие состояния блока.\n
InterfaceDescription7=<blue>7) Мини-панель блока (под прицелом)</>\n\nПоказывает название, иконку и краткие сведения о блоке, на который смотрит игрок.\n
MapDescription=<blue>M</> открывает карту. На карте видны исследованные области, ваше положение и метки.
Research=Исследования
ResearchDescription=Исследования открывают новые рецепты и блоки. Для завершения исследований нужны очки, которые производят компьютеры.
ResearchDescription1=<blue>1) Очередь исследований</>\n\nКомпьютеры работают над первым исследованием в очереди. Когда оно завершено, начинается следующее. Наведите курсор на исследование в очереди и нажмите красный крестик, чтобы удалить его. Зависимые от него исследования тоже удалятся из очереди.\n
ResearchDescription2=<blue>2) Кнопка запуска</>\n\nСтавит выбранное исследование в конец очереди. Исследование можно добавить в очередь, если все необходимые для него исследования завершены или уже стоят в очереди. Так можно заранее составить цепочку исследований, не дожидаясь завершения каждого.\n
ResearchDescription3=<blue>3) Дерево исследований</>\n\nВыбранное исследование, над ним — то, чего оно требует, под ним — то, что оно открывает.\n
ResearchComputersDescription1=Очки исследований дают только компьютеры. При наличии питания компьютер раз в секунду добавляет очки первому исследованию в очереди. Без электричества он не производит очков исследований.
ResearchComputersDescription2=Скорость исследований зависит от уровня компьютера: {item:CopperComputer} — 1 очко в секунду, {item:SteelComputer} — 2. С каждым уровнем количество очков в секунду удваивается. Все работающие компьютеры вносят очки в одно исследование, и их скорости складываются.
ResearchComputersDescription3=У каждого компьютера есть слот на 3 микросхемы своего уровня: {item:Circuit} для {item:CopperComputer}, {item:AdvancedCircuit} для {item:SteelComputer}. Каждая микросхема даёт 30 секунд ускоренных исследований. Следующая расходуется, когда заканчивается действие предыдущей.
ResearchComputersDescription4=При использовании микросхем: {item:CopperComputer} — 10 очков в секунду, {item:SteelComputer} — 100. С каждым уровнем количество очков в секунду увеличивается в 10 раз.
ResearchComputersDescription5=Подавайте микросхемы из конструктора в компьютер с помощью манипулятора ({item:CopperRobotArm}), чтобы поддерживать ускорение исследований. Конструктор изготавливает 1 микросхему ({item:Circuit}) за 7,5 секунды, а компьютер расходует 1 микросхему за 30 секунд ускоренных исследований.
Productivity=Продуктивность
ProductivityDescription1=Вторая полоса рядом с полосой прогресса рецепта показывает продуктивность. Она заполняется, пока машина работает. Когда полоса продуктивности заполняется, машина выдаёт дополнительный продукт, указанный в рецепте, без дополнительного расхода сырья.
ProductivityDescription2=Продуктивность работает на рудных рецептах машин {machine:AutomaticHammer}, {machine:Macerator}, {machine:OreWasher}. Руда, прошедшая через них, даёт больше пластин, чем руда, переплавленная сразу.
BuildingModes=Режимы строительства
BuildingModesDescription1=Машины и большинство блоков строятся в ряд. Зажмите <blue>левую кнопку мыши</> и переместите прицел от начальной клетки. Отпустите кнопку, чтобы построить весь ряд.
BuildingModesDescription2=Платформы и другие простые блоки заполняют плоскость: зажмите <blue>левую кнопку мыши</> и тяните, плоскость выбирается по первому направлению движения.
BuildingModesDescription3=Конвейеры, трубы и кабели прокладываются трассой в два клика: первый клик задаёт начало, второй строит трассу, <blue>правая кнопка мыши</> отменяет. Удержание <blue>Shift</> ведёт трассу в обход препятствий.\n\n<blue>Колесом мыши</> можно изменить высоту размещения блоков.
ItemDatabase=База предметов
ItemDatabaseDescription1=База предметов — правая половина инвентаря (<blue>{key:ToggleInventory}</>).
ItemDatabaseDescription2=<blue>1) Вкладки</>\n\nОткрытые предметы, избранное, все предметы игры и результаты поиска. Вкладка со звездой показывает избранные предметы — в базе и в окне выбора предмета для настройки блока.\n
ItemDatabaseDescription3=<blue>2) Поиск</>\n\nВведите название предмета в поле поиска. Подходящие предметы появятся на вкладке результатов поиска. Очистка поля возвращает на прежнюю вкладку. <blue>Enter</> сохраняет запрос в историю рядом с полем.\n
ItemDatabaseDescription4=<blue>3) Предметы</>\n\nЧисло на значке показывает, сколько предметов можно создать из материалов в инвентаре. Правый клик открывает меню предмета: заказ, рецепты или исследование, добавление в избранное и удаление из него.\n
Recipes=Рецепты
RecipesDescription1=Наведите курсор на предмет и нажмите <blue>{key:Recipe}</>, чтобы открыть его рецепты. Эта же клавиша открывает рецепты блока под прицелом. В тексте можно нажать на ссылку на предмет.
RecipesDescription2=«Получение» — рецепты получения предмета, «Использование» — рецепты, в которых он используется, «Рецепты машины» — рецепты выбранной машины. В меню ингредиента можно открыть его рецепты. Клавиши <blue>{key:NeiLeft}</> и <blue>{key:NeiRight}</> перемещают назад и вперёд по истории просмотра.
CraftQueue=Очередь крафта
CraftQueueDescription1=Левый клик по предмету в базе ставит в очередь одну штуку. <blue>Shift</> + левый клик — сколько позволяют материалы, но не больше одной стопки. В меню по правому клику можно заказать 5, 25 или 100 предметов.
CraftQueueDescription2=Материалы списываются из инвентаря при заказе. Недостающие детали создаются в том же заказе. Отмена заказа возвращает материалы. Крафт приостанавливается, если в инвентаре нет места для результата.
Energy=Энергия
EnergyDescription1={item:StoneFurnace} сжигает топливо и даёт <red>тепло</>. {item:CopperStirlingEngine} превращает тепло в <yellow>кинетику</>. {item:CopperCompactGenerator} превращает кинетику в <blue>электричество</>. {item:CopperComputer} потребляет электричество.
EnergyDescription2=Эта установка преобразует тепло в кинетическую энергию, а затем в электричество и выдаёт до 1 кВт электрической мощности. Компьютер потребляет 400 Вт.
DockingDescription1=Возьмите новую машину в руку и наведите прицел на уже построенную. Она пристыкуется к подходящему порту. <blue>{key:ActionRotate}</> переключает положения стыковки.
DockingDescription2=Цвета портов: <red>тепло</>, <yellow>кинетика</>, <blue>электричество</>. <blue>{key:ToggleSideIcons}</> показывает порты всех блоков.
DockingDescription3=Энергия передаётся между машинами, чьи порты соприкасаются. Кабели и тепловые трубы открываются после исследований.
NoPower=Нет питания
NoPowerDescription1=Наведите прицел на машину, чтобы увидеть её состояние. Проверяйте машины по очереди, от компьютера к печи.
NoPowerDescription2=<red>Требуется ресурс</> — машине не хватает энергии. Проверьте соединение с предыдущей машиной и её работу.\n\n<blue>Ресурса достаточно</> — энергия на выходе не расходуется достаточно быстро. Это бывает при неверном подключении, а также когда следующая машина выключена или требует меньше энергии.\n\n<blue>Простой</> у печи — нет топлива.
NoPowerDescription3={item:CopperComputer} с питанием показывает <blue>Простой</>, если исследование не выбрано. Откройте дерево клавишей <blue>{key:Journal}</> и запустите исследование.
Constructor=Конструктор
ConstructorDescription1={item:CopperConstructor} автоматически изготавливает предметы по рецептам ручного крафта. Работает от электричества и потребляет 800 Вт.
ConstructorDescription2=<blue>1) Кнопка рецепта</>\n\nОткрывает список рецептов. Заодно сбрасывает текущий рецепт и возвращает его предметы в инвентарь.\n
ConstructorDescription3=<blue>2) Входные слоты</>\n\nКаждый слот предназначен для одного из ингредиентов выбранного рецепта. Ингредиенты можно загружать вручную или с помощью манипулятора ({item:CopperRobotArm}).\n
ConstructorDescription4=<blue>3) Выходной слот</>\n\nРезультат рецепта. Его забирает манипулятор ({item:CopperRobotArm}).\n
ConstructorDescription5=<blue>4) Список рецептов</>\n\nРецепты ручного крафта, открытые исследованиями. Нажмите на рецепт, чтобы выбрать его.\n
ConstructorDescription6=Время сборки: {item:CopperWire} — 4 с, {item:Triod} — 2,5 с, {item:CircuitBoard} — 1 с, {item:Circuit} — 7,5 с. Для 1 микросхемы нужны 1 плата и 3 триода. На изготовление этих триодов уходит 9 единиц медной проволоки. Если на каждый компонент выделить по 1 конструктору, выпуск всей линии будет ограничен производством проволоки.
ConstructorDescription7={item:CopperComputer} расходует 1 микросхему за 30 секунд ускоренных исследований. 2 конструктора проволоки и по 1 конструктору остальных компонентов обеспечат 1 компьютер микросхемами для непрерывного ускорения исследований.
Trains=Поезда
TrainsDescription1=Исследование {research:Railway} открывает строительство железных дорог. После него становятся доступны {item:SteelRail}, {item:RailStation}, {item:Locomotive}, {item:CargoWagon} и {item:TankWagon}. Для светофоров {item:RailSignal} и {item:RailChainSignal} завершите исследование {research:RailSignals}.
TrainsDescription2=<blue>Первая линия</>\n\nНачните с двух станций, соединённых рельсами в кольцо. На каждой поставьте по две платформы вплотную, одну за другой, в одном направлении. Расположите станции так, чтобы поезд въезжал со стороны без фонарей и двигался к фонарям.\n\nНа первую станцию поставьте {item:Locomotive}, а за ним — {item:CargoWagon}. Рядом с платформой грузового вагона установите погрузчик или роборуку. На первой станции они будут загружать вагон, на второй — разгружать.\n\nДобавьте вторую станцию в расписание и включите «Повторять расписание». На станции загрузки задайте условие отправления <blue>L = 1</>, на станции разгрузки — <blue>E = 1</>. Так поезд будет ждать полной загрузки и разгрузки перед отправлением. Настройка этих условий описана в разделе «Условия отправления».\n\nПоложите топливо в локомотив, чтобы запустить поезд.
TrainsDescription3=Нажмите <blue>{key:Trains}</>, чтобы открыть список поездов и станций.
TrainsRails=Рельсы
TrainsRailsDescription1=Возьмите {item:SteelRail} и нажмите <blue>{key:ActionPrimary}</> на выбранном месте, чтобы поставить рельсовый узел. Каждый следующий узел соединяется с предыдущим. В начале новой цепочки игра пытается соединить первый узел с ближайшим в пределах 24 клеток.\n\nПеред установкой проверьте предпросмотр: зелёный означает, что путь можно построить, красный — что соединение не подходит. Высота установки меняется <blue>колесом мыши</>.
TrainsRailsDescription2=Нажмите <blue>{key:ActionSecondary}</>, чтобы закончить цепочку. Продолжить путь можно от любого существующего узла: наведитесь на него и нажмите <blue>{key:ActionPrimary}</>. Затем нажмите на другой узел, чтобы соединить их. Нажатие на уже соединённый узел удаляет этот участок пути.
TrainsRailsDescription3=Узлы можно соединить на расстоянии от 1 до 32 клеток по горизонтали. Для поворота нужен радиус хотя бы 3 клетки; один участок может повернуть не более чем на 120°. Допустимый уклон составляет 25%. Если путь построить не удаётся, причина появится в сообщениях.
TrainsRailsDescription4=Чтобы сделать развилку, проведите несколько путей с одной стороны узла. Поезд выбирает ветку по своему маршруту.
TrainsRailsDescription5=Соседние узлы на одной прямой соединяются автоматически. На каждый новый узел расходуется один предмет {item:SteelRail}. При разборке узла удаляются и присоединённые к нему участки пути. Чертежи сохраняют узлы вместе с соединениями.
TrainsRailsDescription6=На крутых поворотах поезд снижает скорость. На подъёмах скорость зависит от массы состава и тяги локомотивов.
TrainsStations=Станции
TrainsStationsDescription1=Каждый блок {item:RailStation} добавляет платформу для одного локомотива или вагона. Для остановки поезд должен въезжать со стороны без фонарей и двигаться к фонарям на противоположном конце станции.
TrainsStationsDescription2=Поставьте платформы вплотную в ряд и поверните их в одну сторону — они объединятся в станцию. Чтобы обслуживать весь состав, постройте по платформе на каждый локомотив и вагон.
TrainsStationsDescription3=Когда к станции направляется поезд, горит <yellow>жёлтый огонь</>. Во время стоянки загорается <red>красный</>, а при отправлении — <green>зелёный</>. Мигающий красный означает задержку отправления, например из-за нехватки топлива.
TrainsStationsDescription4=Наведитесь на платформу и нажмите <blue>{key:ActionSecondary}</>, чтобы открыть окно станции.
TrainsStationsDescription5=<blue>1) Название станции</>\n\nВ расписании станция выбирается по названию. Если дать одно название нескольким станциям, поезд сам выберет одну из них с учётом длины маршрута и занятости путей и платформ.
TrainsStationsDescription6=<blue>2) Вагон у платформы</>\n\nВ окне платформы показано содержимое стоящего у неё вагона. Погрузчики и роборуки передают через платформу предметы, а помпы заполняют и опустошают цистерны. У локомотива вместо груза показано топливо; его тоже можно подавать через платформу.
TrainsStationsDescription7=<blue>3) Настройки блока</>\n\nКнопка с шестерёнкой открывает настройки сигналов, которые выдаёт станция. Подробнее — в «Условиях отправления».
TrainsStationsDescription8=<blue>4) Станции</>\n\nСписок станций с их координатами. Если у станции стоит поезд, рядом указан его номер.
TrainsStationsDescription9=<blue>5) Сведения о станции</>\n\nЗдесь можно изменить название станции, посмотреть её координаты и число платформ. Ниже указано, сколько поездов используют это название в расписании.
TrainsStationsDescription10=<blue>6) Открыть окно поезда</>\n\nОткрывает расписание поезда, стоящего на станции.
TrainsConsist=Локомотивы и вагоны
TrainsConsistDescription1=Возьмите локомотив или вагон, наведитесь на рельсы или станцию и нажмите <blue>{key:ActionPrimary}</>. Перед установкой проверьте, куда он направлен. Клавиша <blue>{key:ActionRotate}</> разворачивает его. Чтобы добавить вагон к составу, поставьте его за поездом, стоящим на станции.
TrainsConsistDescription2=Поезд может двигаться в ту сторону, куда направлен хотя бы один из его локомотивов. С одним локомотивом для возвращения нужна петля. Для поездок между тупиками поставьте два локомотива, направленных в противоположные стороны.
TrainsConsistDescription3=В два топливных слота локомотива можно положить то же топливо, что и в печь. Каждый заправленный локомотив, направленный по ходу движения, добавляет тяги. По мере загрузки вагонов состав становится тяжелее.
TrainsConsistDescription4={item:CargoWagon} вмещает 10 стопок предметов, {item:TankWagon} — жидкость одного вида.
TrainsConsistDescription5=Наведитесь на вагон и нажмите <blue>{key:ActionSecondary}</>, чтобы открыть его окно. Для разборки состава на станции используйте {item:Multitool}: он возвращает выбранный вагон в инвентарь.
TrainsConsistDescription6=<blue>1) Выключатель</>\n\nВыключенный поезд затормозит и останется на месте. Включите его снова, чтобы продолжить движение по расписанию.
TrainsConsistDescription7=<blue>2) Состояние</>\n\nПод названием или номером поезда показаны номер вагона и состояние состава. Здесь же видно, на какой станции он стоит или куда направляется.
TrainsConsistDescription8=<blue>3) Содержимое</>\n\nТопливо локомотива или груз вагона.
TrainsConsistDescription9=<blue>4) Расписание</>\n\nОткрывает расписание выбранного поезда в окне «Поезда».
TrainsConsistDescription10=<blue>5) Карточка при наведении</>\n\nНаведите прицел на вагон, чтобы увидеть его содержимое и состояние поезда.
TrainsSchedule=Расписание
TrainsScheduleDescription1=Откройте окно «Поезда» клавишей <blue>{key:Trains}</> или кнопкой «Расписание» в окне вагона. Станция, на которой вы поставили новый поезд, уже добавлена в его расписание. Укажите следующую остановку, чтобы задать маршрут.
TrainsScheduleDescription2=<blue>1) Поезда</>\n\nВыберите поезд в списке, чтобы открыть его расписание. Найти его можно по названию, номеру (например, #12) или названию станции на маршруте.
TrainsScheduleDescription3=<blue>2) Название поезда</>\n\nЗдесь можно дать поезду название. Пока поле пустое, в списке отображается его номер.
TrainsScheduleDescription4=<blue>3) Повторять расписание</>\n\nПри включённом повторении поезд после последней остановки снова едет к первой. Если выключить повторение, он завершит маршрут на последней станции.
TrainsScheduleDescription5=<blue>4) Отправить сейчас</>\n\nПропускает ожидание условия отправления на текущей остановке. Кнопка доступна, когда поезд стоит на станции и в расписании есть следующая остановка.
TrainsScheduleDescription6=<blue>5) Показать маршрут</>\n\nОткрывает схему маршрута до следующей станции.
TrainsScheduleDescription7=<blue>6) Выбрать остановку</>\n\nНажмите стрелку у нужной остановки, чтобы направить к ней поезд. Маршрут можно изменить и во время движения. Текущая остановка выделена в расписании; под ней показано состояние поезда.
TrainsScheduleDescription8=<blue>7) Станция</>\n\nВыберите из списка станцию, на которую поезд должен приехать.
TrainsScheduleDescription9=<blue>8) Порядок остановок</>\n\nСтрелки перемещают остановку вверх или вниз, крестик удаляет её. Кнопка <blue>+ Добавить остановку</> находится под списком.
TrainsScheduleDescription10=<blue>9) Условие отправления</>\n\nЗадаёт, когда поезд может покинуть эту остановку. Подробнее — в «Условиях отправления».
TrainsScheduleDescription11=Справа, в разделе «Состав», показаны локомотивы, вагоны и их содержимое.
TrainsConditions=Условия отправления
TrainsConditionsDescription1=Для каждой остановки можно задать условие отправления: например, дождаться полной загрузки или простоять заданное время. В условии доступны сигналы самой станции и сигналы, поступающие по проводам на её платформы.
TrainsConditionsDescription2=<blue>1) Режим</>\n\nДля сравнения сигнала с числом или другим сигналом выберите <blue>Expr</>. Чтобы объединить несколько условий, выберите <blue>And</>, <blue>Or</> или <blue>Xor</> и добавьте условия кнопкой +.\n\nВ режиме And должны выполниться все условия, в Or достаточно одного, а в Xor — нечётного числа. Режим <blue>Always</> разрешает отправление сразу после прибытия.
TrainsConditionsDescription3=<blue>2) Индикатор</>\n\nКогда условие выполняется, индикатор загорается зелёным, иначе — красным.
TrainsConditionsDescription4=<blue>3) Сигнал</>\n\nНажмите, чтобы выбрать сигнал для сравнения. Можно выбрать и предмет — тогда сравнивается его количество.
TrainsConditionsDescription5=<blue>4) Сравнение</>\n\nВыберите, как сравнивать значения: проверить равенство (=), различие (!=), большее (>) или меньшее (<) значение. Знаки >= и <= также допускают равенство.
TrainsConditionsDescription6=<blue>5) Значение</>\n\nЧисло или второй сигнал, с которым сравнивается первый.
TrainsConditionsDescription7=<blue>6) Сигналы станции</>\n\nВ настройках станции включите сигналы, которые хотите использовать. «Хранилище» передаёт количество каждого предмета и жидкости в вагонах отдельным сигналом.\n\nПо умолчанию сигнал <blue>P</> показывает время стоянки в тиках, а <blue>I</> — сколько тиков прошло с последнего изменения груза. Сигнал <blue>F</> показывает общее количество предметов топлива в локомотивах.\n\nПри полной загрузке сигнал <blue>L</> равен 1, при полной разгрузке <blue>E</> равен 1. Эти сигналы учитывают все грузовые вагоны и цистерны состава.
TrainsConditionsDescription8=<blue>7) Значения</>\n\nТекущие значения сигналов, которые выдаёт станция.
TrainsConditionsDescription9=Для отправления после полной загрузки задайте <blue>L = 1</>, после полной разгрузки — <blue>E = 1</>. Если нужно дождаться окончания погрузки, даже когда вагон заполнен лишь частично, подойдёт <blue>I >= 100</>: поезд отправится после пяти секунд без изменения груза.\n\nВремя измеряется в тиках: в одной секунде их 20. Поэтому условие <blue>P >= 600</> задаёт стоянку на 30 секунд.
TrainsSignals=Светофоры
TrainsSignalsDescription1=Светофоры разделяют пути на блоки. Перед въездом поезд резервирует блок, а остальные поезда ждут, пока он освободится. Когда вы держите светофор в руке, блоки на путях выделяются разными цветами.
TrainsSignalsDescription2=Возьмите светофор и наведитесь на рельсы. Предпросмотр появится у ближайшего узла, справа по ходу движения поезда. Клавиша <blue>{key:ActionRotate}</> меняет направление, а <blue>{key:ActionPrimary}</> устанавливает светофор.\n\nЧтобы снять его, нажмите на него ещё раз с выбранным светофором в руке или используйте {item:Multitool}.
TrainsSignalsDescription3={item:RailSignal} разрешает въезд в свободный блок. {item:RailChainSignal} проверяет весь путь по маршруту поезда до следующего обычного светофора, включая блок за ним.\n\nПеред развилкой поставьте цепной светофор, а после неё — обычный. Тогда поезд дождётся свободного выезда перед развилкой. Участок за выходным светофором должен вмещать весь состав.
TrainsSignalsDescription4=Светофор задаёт разрешённое направление проезда через узел. На двустороннем пути ставьте в одном узле пару светофоров для противоположных направлений.
TrainsSignalsDescription5=<red>Красный огонь</> закрывает проезд, <green>зелёный</> разрешает его. <yellow>Жёлтый</> загорается, когда блок зарезервирован поездом, который пройдёт через этот светофор.\n\nУ цепного светофора зелёный означает, что открыт хотя бы один выезд. Поезд проедет, когда будет открыт выезд по его маршруту.
TrainsSignalsDescription6=<blue>1) Окно узла рельса</>\n\nНаведитесь на рельсовый узел и нажмите <blue>{key:ActionSecondary}</>, чтобы открыть его окно. У каждого светофора здесь своя строка из трёх ламп, повторяющих его огни. Выключатель закрывает все светофоры узла; после включения они снова регулируют движение.
TrainsSignalsDescription7=<blue>2) Настройки блока</>\n\nКнопка с шестерёнкой открывает настройки логических сигналов. Узел выдаёт сигналы <blue>R</>, <blue>Y</> и <blue>G</>, показывающие число светофоров с красным, жёлтым и зелёным огнём соответственно.\n\nДля управления по проводу включите импорт «Работа» (<blue>W</>). Значение W больше 0 разрешает проезд; светофоры при этом продолжают учитывать занятость пути.
TrainsWaiting=Состояния поезда
TrainsWaitingDescription1=Состояние поезда показано в списке поездов, у текущей остановки и при наведении на вагон. При задержке в пути поезд периодически проверяет другие маршруты к нужной станции.
TrainsWaitingDescription2=<blue>1) Показать маршрут</>\n\nЗелёная линия со стрелками показывает найденный маршрут. Если маршрут построить не удалось, красным отмечаются пути, проверенные при поиске. Красная метка указывает место, где поиск пути прервался.
TrainsWaitingDescription3=<blue>2) Состояние</>\n\nЗдесь указано, что делает поезд или что мешает ему продолжить движение.
TrainsWaitingDescription4=Состояние <blue>«Условие отправления»</> означает, что поезд ждёт загрузки, разгрузки или другого условия, заданного в расписании. Если показано <blue>«Нет следующей остановки»</>, проверьте расписание: оно закончилось или в нём указано название станции, которой больше нет.\n\nПри состоянии <blue>«Нет маршрута»</> проверьте соединения рельсов, направление станции и светофоров, ориентацию локомотивов. Состояние <blue>«Платформы заняты»</> означает, что станции с нужным названием уже зарезервированы другими поездами.\n\n<blue>«Красный сигнал»</> и <blue>«Впереди поезд»</> объясняют остановку в пути: в первом случае проезд закрывает светофор, во втором мешает другой состав.\n\nЕсли поезд <blue>«Остановлен»</>, включите его в окне вагона. При состоянии <blue>«Нет локомотива»</> нужен локомотив, направленный по ходу маршрута. Сообщение <blue>«Нет топлива»</> подсказывает, что пора заправить локомотивы, которые тянут поезд.
