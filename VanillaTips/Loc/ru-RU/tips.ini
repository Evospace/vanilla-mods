[tips]
StackTransfers=Перенос стопок
StackTransfersDescription=<blue>Shift + левый клик</>: перенести 1 стопку\n<blue>Shift + правый клик</>: перенести предметы из этого слота, но не больше половины полной стопки\n\n<blue>Control + левый клик</>: перенести все предметы этого типа\n<blue>Control + правый клик</>: перенести половину предметов этого типа\n\n<blue>Control + левый клик по пустому слоту</>: перенести весь инвентарь\n<blue>Control + правый клик по пустому слоту</>: перенести половину предметов каждого типа из инвентаря\n\n<blue>Alt + левый клик</>: перенести 5 предметов\n<blue>Alt + правый клик</>: перенести 1 предмет
ChestLimiting=Ограничение сундука
ChestLimitingDescription=
Screwdriver=Отвёртка
ScrewdriverDescription=Держа <blue>Отвёртку</>, зажмите <blue>левую кнопку мыши</>, потяните в сторону одной из стрелок и отпустите кнопку — блок повернётся. Пока так поворачиваются только блоки размером в 1 клетку.\n\nНаправление поворота зависит от того, на какую грань блока наведён курсор.\nПосле отпускания кнопки блок поворачивается так, что эта грань встаёт на место грани, на которую указывает выбранная стрелка.
RotationWhileBuilding=Поворот при строительстве
RotationWhileBuildingDescription=<blue>R</> поворачивает блок вокруг вертикальной оси.\nОсь меняется удержанием <blue>Shift</> или <blue>Alt</>.\nЗелёный указатель показывает текущую ось вращения.\n\nДержа в руке строительный предмет, можно зажать <blue>правую кнопку мыши</>, потянуть в сторону одной из стрелок и отпустить кнопку — блок повернётся. Так поворачиваются блоки любого размера.
BlockPipette=Пипетка блоков
BlockPipetteDescription=Нажмите <blue>Q</>, чтобы выбрать для строительства блок под прицелом и сохранить его ориентацию. Нажмите <blue>Q</> ещё раз, чтобы сбросить выбор.\nВ творческом режиме это работает всегда, в обычном — только если такой предмет есть в инвентаре.\n\n<blue>Ctrl+C</> копирует настройки блока под прицелом.\n<blue>Ctrl+V</> вставляет настройки из буфера обмена в блок под прицелом.\n\nНе все блоки поддерживают копирование и вставку настроек. Скопированные настройки блока сохраняются в буфере обмена как текст.
FirstSteps=Первые шаги
FirstStepsDescription=Поиск медной руды и выплавка меди (малахит, халькопирит)\n\n1. Найдите медную руду: малахит или халькопирит. Там, где руда видна на поверхности, обычно рядом или чуть глубже есть ещё.\n2. Добудьте медную руду.\n3. Для удобства постройте площадку из базовых блоков из инвентаря.\n4. Скрафтите печь и плавильню. Поставьте плавильню на печь.\n5. Положите топливо в печь, а медную руду — в плавильню.\n6. Когда плавка закончится, заберите медные пластины.\n\nПервые машины\n\n1. Сделайте ещё одну печь, двигатель Стирлинга, компактный генератор и компьютер.\n2. Расставьте их так, чтобы входы и выходы совпали.\n3. Когда компьютер заработает, можно начинать исследования.
Interface=Интерфейс
Map=Карта
InterfaceDescription1=<blue>1) Панель быстрого доступа</>\n\nВ начале панели показан предмет в руке, над ним — его название.\nДальше идут слоты быстрого доступа. Они выбираются кликом мыши или цифровой клавишей.\nКаждому слоту панели назначается тип предмета. Сами предметы берутся из вашего инвентаря.\n
InterfaceDescription2=<blue>2) Инвентарь игрока</>\n\nОсновная часть — сетка слотов.\nЛевый клик по предмету берёт его. Клик по слоту кладёт предмет туда. Клик по другому предмету меняет их местами.\n\nВнизу — отдельные слоты для джетпака и освещения, кнопки сортировки инвентаря и выброса предметов на землю.\nНиже — инструменты: мультитул для копания и отвёртка для поворота блоков.\n
InterfaceDescription3=<blue>3) Разное</>\n\nВ верхнем ряду — кнопки управления игровым временем. Пока они влияют только на картинку. В конце ряда — кнопка, останавливающая смену дня и ночи.\n\nВо втором ряду — кнопка прогресса исследований, за ней кнопка обучения, которая открывает это руководство.\nДальше — переключатель творческого режима (не виден в обычной игре), переключатель полёта и кнопка подсветки входов и выходов блоков.\n
InterfaceDescription4=<blue>4) Окно крафта игрока</>\n\nВ этом ряду выбирается вкладка для раздела ниже.\nПервая — список всех открытых предметов. Следующая — «Избранное». Чтобы добавить предмет в избранное или убрать его оттуда, кликните по нему правой кнопкой в списке ниже и выберите Toggle Favourite в выпадающем меню.\nДальше — вкладка со всеми предметами игры. Последняя — результаты поиска и поле для поиска предметов.\n
InterfaceDescription5=<blue>5) Содержимое вкладки</>\n\nПоказывает предметы выбранной вкладки, разбитые по категориям.\nЧисло в клетке — сколько таких предметов можно скрафтить сейчас.\n\nЛевый клик по предмету ставит в очередь одну штуку, если хватает материалов. Shift + левый клик — сколько позволяют материалы, но не больше одной стопки.\n\nПравый клик открывает контекстное меню: поставить в очередь несколько штук, открыть окно рецептов (Show Recipes), добавить все компоненты предмета в поиск (Context Search) или отметить предмет как избранный (Toggle Favourite).\n
InterfaceDescription6=<blue>6) Окно блока</>\n\nПравый клик по блоку под прицелом открывает его интерфейс.\nВверху — кнопки питания и настроек, затем название блока и его уровень.\nНиже — входной инвентарь, индикатор состояния и индикатор текущего рецепта (подробности — при наведении).\nДальше — полоса прогресса рецепта. У некоторых машин есть вторая полоса — продуктивности.\nКогда заполняется основная полоса, изготовление завершено. Когда заполняется полоса продуктивности, машина выдаёт дополнительный предмет.\nНиже — выходной инвентарь.\nВ самом низу — прочие состояния блока.\n
InterfaceDescription7=<blue>7) Мини-панель блока (под прицелом)</>\n\nПоказывает название, иконку и краткие сведения о блоке, на который смотрит игрок.\n
MapDescription=<blue>M</> открывает карту. На карте видны исследованные области, ваше положение и метки.
Research=Исследования
ResearchDescription=Исследования открывают новые рецепты и блоки. Для завершения исследований нужны очки, которые производят компьютеры.
ResearchDescription1=<blue>1) Очередь исследований</>\n\nКомпьютеры работают над первым исследованием в очереди. Когда оно завершено, начинается следующее. Наведите курсор на исследование в очереди и нажмите красный крестик, чтобы удалить его. Зависимые от него исследования тоже удалятся из очереди.\n
ResearchDescription2=<blue>2) Кнопка запуска</>\n\nСтавит выбранное исследование в конец очереди. Исследование можно добавить в очередь, если все необходимые для него исследования завершены или уже стоят в очереди. Так можно заранее составить цепочку исследований, не дожидаясь завершения каждого.\n
ResearchDescription3=<blue>3) Дерево исследований</>\n\nВыбранное исследование, над ним — то, чего оно требует, под ним — то, что оно открывает.\n
ResearchComputersDescription1=Очки исследований дают только компьютеры. При наличии питания компьютер раз в секунду добавляет очки первому исследованию в очереди. Без электричества он не производит очков исследований.
ResearchComputersDescription2=Скорость исследований зависит от уровня компьютера: {item:CopperComputer} — 1 очко в секунду, {item:SteelComputer} — 2. С каждым уровнем количество очков в секунду удваивается. Все работающие компьютеры вносят очки в одно исследование, и их скорости складываются.
ResearchComputersDescription3=У каждого компьютера есть слот на 3 микросхемы своего уровня: {item:Circuit} для {item:CopperComputer}, {item:AdvancedCircuit} для {item:SteelComputer}. Каждая микросхема даёт 30 секунд ускоренных исследований. Следующая расходуется, когда заканчивается действие предыдущей.
ResearchComputersDescription4=При использовании микросхем: {item:CopperComputer} — 10 очков в секунду, {item:SteelComputer} — 100. С каждым уровнем количество очков в секунду увеличивается в 10 раз.
ResearchComputersDescription5=Подавайте микросхемы из конструктора в компьютер с помощью манипулятора ({item:CopperRobotArm}), чтобы поддерживать ускорение исследований. Конструктор изготавливает 1 микросхему ({item:Circuit}) за 7,5 секунды, а компьютер расходует 1 микросхему за 30 секунд ускоренных исследований.
Productivity=Продуктивность
ProductivityDescription1=Вторая полоса рядом с полосой прогресса рецепта показывает продуктивность. Она заполняется, пока машина работает. Когда полоса продуктивности заполняется, машина выдаёт дополнительный продукт, указанный в рецепте, без дополнительного расхода сырья.
ProductivityDescription2=Продуктивность работает на рудных рецептах машин {machine:AutomaticHammer}, {machine:Macerator}, {machine:OreWasher}. Руда, прошедшая через них, даёт больше пластин, чем руда, переплавленная сразу.
BuildingModes=Режимы строительства
BuildingModesDescription1=Машины и большинство блоков строятся в ряд. Зажмите <blue>левую кнопку мыши</> и переместите прицел от начальной клетки. Отпустите кнопку, чтобы построить весь ряд.
BuildingModesDescription2=Платформы и другие простые блоки заполняют плоскость: зажмите <blue>левую кнопку мыши</> и тяните, плоскость выбирается по первому направлению движения.
BuildingModesDescription3=Конвейеры, трубы и кабели прокладываются трассой в два клика: первый клик задаёт начало, второй строит трассу, <blue>правая кнопка мыши</> отменяет. Удержание <blue>Shift</> ведёт трассу в обход препятствий.\n\n<blue>Колесом мыши</> можно изменить высоту размещения блоков.
ItemDatabase=База предметов
ItemDatabaseDescription1=База предметов — правая половина инвентаря (<blue>{key:ToggleInventory}</>).
ItemDatabaseDescription2=<blue>1) Вкладки</>\n\nОткрытые предметы, избранное, все предметы игры и результаты поиска. Вкладка со звездой показывает избранные предметы — в базе и в окне выбора предмета для настройки блока.\n
ItemDatabaseDescription3=<blue>2) Поиск</>\n\nВведите название предмета в поле поиска. Подходящие предметы появятся на вкладке результатов поиска. Очистка поля возвращает на прежнюю вкладку. <blue>Enter</> сохраняет запрос в историю рядом с полем.\n
ItemDatabaseDescription4=<blue>3) Предметы</>\n\nЧисло на значке показывает, сколько предметов можно создать из материалов в инвентаре. Правый клик открывает меню предмета: заказ, рецепты или исследование, добавление в избранное и удаление из него.\n
Recipes=Рецепты
RecipesDescription1=Наведите курсор на предмет и нажмите <blue>{key:Recipe}</>, чтобы открыть его рецепты. Эта же клавиша открывает рецепты блока под прицелом. В тексте можно нажать на ссылку на предмет.
RecipesDescription2=Made in — рецепты получения предмета, Used in — рецепты, в которых он используется, Can craft — рецепты выбранной машины. В меню ингредиента можно открыть его рецепты. Клавиши <blue>{key:NeiLeft}</> и <blue>{key:NeiRight}</> перемещают назад и вперёд по истории просмотра.
CraftQueue=Очередь крафта
CraftQueueDescription1=Левый клик по предмету в базе ставит в очередь одну штуку. <blue>Shift</> + левый клик — сколько позволяют материалы, но не больше одной стопки. В меню по правому клику можно заказать 5, 25 или 100 предметов.
CraftQueueDescription2=Материалы списываются из инвентаря при заказе. Недостающие детали создаются в том же заказе. Отмена заказа возвращает материалы. Крафт приостанавливается, если в инвентаре нет места для результата.
Energy=Энергия
EnergyDescription1={item:StoneFurnace} сжигает топливо и даёт <red>тепло</>. {item:CopperStirlingEngine} превращает тепло в <yellow>кинетику</>. {item:CopperCompactGenerator} превращает кинетику в <blue>электричество</>. {item:CopperComputer} потребляет электричество.
EnergyDescription2=Эта установка преобразует тепло в кинетическую энергию, а затем в электричество и выдаёт до 1 кВт электрической мощности. Компьютер потребляет 400 Вт.
DockingDescription1=Возьмите новую машину в руку и наведите прицел на уже построенную. Она пристыкуется к подходящему порту. <blue>{key:ActionRotate}</> переключает положения стыковки.
DockingDescription2=Цвета портов: <red>тепло</>, <yellow>кинетика</>, <blue>электричество</>. <blue>{key:ToggleSideIcons}</> показывает порты всех блоков.
DockingDescription3=Энергия передаётся между машинами, чьи порты соприкасаются. Кабели и тепловые трубы открываются после исследований.
NoPower=Нет питания
NoPowerDescription1=Наведите прицел на машину, чтобы увидеть её состояние. Проверяйте машины по очереди, от компьютера к печи.
NoPowerDescription2=<red>Требуется ресурс</> — машине не хватает энергии. Проверьте соединение с предыдущей машиной и её работу.\n\n<blue>Ресурса достаточно</> — энергия на выходе не расходуется достаточно быстро. Это бывает при неверном подключении, а также когда следующая машина выключена или требует меньше энергии.\n\n<blue>Простой</> у печи — нет топлива.
NoPowerDescription3={item:CopperComputer} с питанием показывает <blue>Простой</>, если исследование не выбрано. Откройте дерево клавишей <blue>{key:Journal}</> и запустите исследование.
Constructor=Конструктор
ConstructorDescription1={item:CopperConstructor} автоматически изготавливает предметы по рецептам ручного крафта. Работает от электричества и потребляет 800 Вт.
ConstructorDescription2=<blue>1) Кнопка рецепта</>\n\nОткрывает список рецептов. Заодно сбрасывает текущий рецепт и возвращает его предметы в инвентарь.\n
ConstructorDescription3=<blue>2) Входные слоты</>\n\nКаждый слот предназначен для одного из ингредиентов выбранного рецепта. Ингредиенты можно загружать вручную или с помощью манипулятора ({item:CopperRobotArm}).\n
ConstructorDescription4=<blue>3) Выходной слот</>\n\nРезультат рецепта. Его забирает манипулятор ({item:CopperRobotArm}).\n
ConstructorDescription5=<blue>4) Список рецептов</>\n\nРецепты ручного крафта, открытые исследованиями. Нажмите на рецепт, чтобы выбрать его.\n
ConstructorDescription6=Время сборки: {item:CopperWire} — 4 с, {item:Triod} — 2,5 с, {item:CircuitBoard} — 1 с, {item:Circuit} — 7,5 с. Для 1 микросхемы нужны 1 плата и 3 триода. На изготовление этих триодов уходит 9 единиц медной проволоки. Если на каждый компонент выделить по 1 конструктору, выпуск всей линии будет ограничен производством проволоки.
ConstructorDescription7={item:CopperComputer} расходует 1 микросхему за 30 секунд ускоренных исследований. 2 конструктора проволоки и по 1 конструктору остальных компонентов обеспечат 1 компьютер микросхемами для непрерывного ускорения исследований.
