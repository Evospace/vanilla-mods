[tips]
StackTransfers=Stack transfers
StackTransfersDescription=<blue>Shift + Left-click</>: Transfers a single stack\n<blue>Shift + Right-click</>: Transfers a half of stack\n\n<blue>Control + Left-click</>: Transfers all stacks of the given type\n<blue>Control + Right-click</>: Transfers half of items of the given type\n\n<blue>Control + Left-click on empty slot</>: transfer the whole inventory\n<blue>Control + Right-click on empty slot</>: transfer a half of whole inventory\n\n<blue>Alt + Left-click</>: transfer five items\n<blue>Alt + Right-click</>: transfer one item
ChestLimiting=Chest limiting
ChestLimitingDescription=
Screwdriver=Screwdriver
ScrewdriverDescription=Press <blue>Left Mouse Button</> while holding a <blue>Screwdriver</> and drag to one of arrow directions then release button to rotate block. At the moment only single cell blocks can be rotatared with this method.\n\nRotation depends on the plane you are hovering over.\nAfter releasing the button, the plane will rotate in such a way that it replaces the plane indicated by the selected arrow
RotationWhileBuilding=Rotation while building
RotationWhileBuildingDescription=Press <blue>R</> to rotate the block around vertical axis.\nYou can change this axis by holding <blue>Shift</> or <blue>Alt</> key.\nActive axis will be shown with green arrow and axis like in piclure above.\n\nWhile holding some buildable item you can hold <blue>Right Mouse Button</> and drag to one of arrow directions then release button to rotate block. This method allows rotation of blocks with any size.
BlockPipette=Block pipette
BlockPipetteDescription=Press <blue>Q</> to copy hovered block with its rotation. Press <blue>Q</> again to clear selection.\nIt is always working in Creative mode and only when you have same item in inventory in Normal mode\n\nPress <blue>Ctrl+C</> to copy settings from hovered block\nPress <blue>Ctrl+V</> to paste setting from clipboard to hovered block\n\nBlock settings availible not for all blocks. All block settings is just a text.
FirstSteps=First steps
FirstStepsDescription=Finding and Smelting Copper Ore (Malachite, Chalcopyrite)\n\n1. First, locate copper ore: Malachite or Chalcopyrite. Areas where ore is visible on the ground usually have more deposits nearby or just below the surface.\n2. Gather the copper ore.\n3. Use basic blocks from your inventory to create a platform for convenience.\n4. Craft a furnace and a smelter. Place the smelter above the furnace.\n5. Put fuel in the furnace and place the copper ore in the smelter.\n6. Once the smelting process is complete, collect the copper ingots.\n\nBuilding Essential Machinery\n\n1. Create another furnace, a Stirling engine, a compact generator, and a computer.\n2. Arrange these components according to their inputs and outputs.\n3. Once the computer is operational, you can start researching new technologies.
Interface=Interface
Map=Map
InterfaceDescription1=<blue>1) Hotbar</>\n\nAt the beginning, the currently held item is displayed along with its name above it.\nAfter it, quick access slots are shown. These can be selected by mouse click or the corresponding number key.\nThe hotbar holds items by type and draws them directly from the player's inventory.\n
InterfaceDescription2=<blue>2) Player Inventory</>\n\nThe main section consists of a grid of item slots.\nLeft-click an item to pick it up. Click on a slot again to place the item there. Click on another item to swap them.\n\nAt the bottom, there are dedicated slots for the jetpack, lighting, inventory sorting, and dropping items on the ground.\nBelow that are the tools: a multitool for digging and a screwdriver for rotating blocks.\n
InterfaceDescription3=<blue>3) Miscellaneous</>\n\nThe top row contains time control buttons for the in-game time. Currently, these only affect visuals. At the end of the row is a button that stops the day-night cycle.\n\nThe second row includes a button showing research progress, followed by the tutorial button that opens this guide.\nNext is the creative mode toggle (invisible in non-creative games), then a flight mode toggle, and finally a button to highlight block inputs and outputs.\n
InterfaceDescription4=<blue>4) Player Crafting Window</>\n\nThis row contains the tab selection for the section below.\nFirst is the list of all unlocked items. Next is the Favorites tab. To add or remove an item from Favorites, right-click the item in the list below and select Toggle Favourite from the dropdown menu.\nThen comes the tab for all items available in the game. Finally, there is the Search Results tab and a text field for item search.\n
InterfaceDescription5=<blue>5) Selected Tab Contents</>\n\nDisplays the items from the selected tab, grouped into categories.\nThe number in each cell shows how many of that item can currently be crafted.\n\nLeft-clicking an item will queue 1 unit if enough resources are available, Shift + left-click queues as many as the resources allow.\n\nRight-clicking opens a context menu where you can queue multiple items, open the recipe window (Show Recipes), add all components of the item to the search (Context Search), or mark the item as a favorite (Toggle Favourite).\n
InterfaceDescription6=<blue>6) Selected Block Window</>\n\nRight-clicking a block while aiming at it opens the block's interface.\nAt the top, you'll find the power toggle and settings buttons, followed by the block’s name and tier.\nBelow that is the input inventory, along with a status indicator and a current recipe indicator (hover over it for details).\nNext comes the progress bar for the active recipe. Some machines also have a second bar that shows bonus production.\nWhen the main progress bar is full, the recipe is completed. When the bonus bar is full, a bonus item is produced.\nBelow that is the output inventory.\nAt the very bottom, other block statuses are displayed.\n
InterfaceDescription7=<blue>7) Block Minipanel (Under Crosshair)</>\n\nDisplays the name, icon, and brief information about the block the player is currently looking at.\n
MapDescription=Press <blue>M</> to open the map. The map shows explored regions, your position, and any markers.
Research=Research
ResearchDescription=Research unlocks new recipes and blocks. Earn research points to progress through the tech tree.
ResearchComputersDescription1=Research points are produced by computers only. A computer consumes electricity and adds points to the selected research once per second. Without electricity it produces nothing.
ResearchComputersDescription2=The rate depends on the computer tier: {item:CopperComputer} — 1 point per second, {item:SteelComputer} — 2, each next tier twice as much. Points of all working computers go into the same research and sum up.
ResearchComputersDescription3=Every computer has a chip slot for 3 chips of its own tier: {item:Circuit} for {item:CopperComputer}, {item:AdvancedCircuit} for {item:SteelComputer}. One chip is consumed per 30 seconds of boost, and the next chip is taken only after the current boost ends.
ResearchComputersDescription4=Boosted rate: {item:CopperComputer} — 10 points per second, {item:SteelComputer} — 100, each next tier ten times as much.
Productivity=Productivity
ProductivityDescription1=The second progress bar next to the recipe bar is Productivity. The bar fills while the machine works, and when it is full the machine gives one extra output. The extra output costs no input.
ProductivityDescription2=Productivity works on ore recipes of {machine:AutomaticHammer}, {machine:Macerator}, {machine:OreWasher}. Ore processed in them gives more plates than ore smelted directly.
BuildingModes=Building modes
BuildingModesDescription1=Machines and most blocks are built in a line: hold <blue>Left Mouse Button</> and drag away from the first cell, release to place the whole line at once.
BuildingModesDescription2=Platforms and other simple blocks fill a plane: hold <blue>Left Mouse Button</> and drag, the plane is picked by the direction you move first.
BuildingModesDescription3=Conveyors, pipes and cables are built as a run in two clicks: the first click anchors the start, the second builds the run, <blue>Right Mouse Button</> cancels it. Hold <blue>Shift</> to route the run around obstacles.\n\n<blue>Mouse Wheel</> raises and lowers the aim in every mode.
Trains=열차
TrainsDescription1={research:Railway} 연구를 완료하면 {item:SteelRail}, {item:RailStation}, {item:Locomotive}, {item:CargoWagon}, {item:TankWagon} 제작법이 해금됩니다. {item:RailSignal} 및 {item:RailChainSignal} 신호기는 {research:RailSignals} 연구 후에 사용할 수 있습니다.
TrainsDescription2=<blue>첫 노선</>\n\n역 두 곳을 순환 선로로 연결하는 것부터 시작하세요. 각 역에 승강장 두 개를 같은 방향으로, 앞뒤로 붙여 놓으세요. 열차가 표시등이 없는 쪽으로 들어와 반대편 표시등을 향해 이동하도록 역의 방향을 맞춥니다.\n\n첫 역에 {item:Locomotive}를 놓고 그 뒤에 {item:CargoWagon}을 추가하세요. 두 역 모두 화차 승강장 옆에 적재기나 로봇 팔을 설치합니다. 첫 역에서는 화물을 싣고, 두 번째 역에서는 내리도록 설정하세요.\n\n운행 일정에 두 번째 역을 추가하고 '운행 일정 반복'을 켭니다. 적재역의 출발 조건은 <blue>L = 1</>, 하역역의 조건은 <blue>E = 1</>로 설정하세요. 그러면 열차는 완전히 적재되거나 하역될 때까지 기다린 뒤 출발합니다. 설정 방법은 '출발 조건'에서 확인할 수 있습니다.\n\n기관차에 연료를 넣으면 열차 운행이 시작됩니다.
TrainsDescription3=<blue>{key:Trains}</> 키를 누르면 열차와 역 목록이 열립니다.
TrainsRails=선로
TrainsRailsDescription1={item:SteelRail}을 들고 원하는 위치에서 <blue>{key:ActionPrimary}</> 버튼을 누르면 선로 노드를 놓습니다. 이후에 놓는 노드는 바로 앞의 노드와 연결됩니다. 새로 연속 배치를 시작하면, 첫 노드는 24칸 이내에서 가장 가까운 노드와 연결을 시도합니다.\n\n배치 전에 미리보기를 확인하세요. 초록색이면 연결을 만들 수 있고, 빨간색이면 연결할 수 없습니다. <blue>마우스 휠</>로 배치 높이를 조절할 수 있습니다.
TrainsRailsDescription2=<blue>{key:ActionSecondary}</> 버튼을 누르면 연속 배치가 끝납니다. 기존 노드에서 선로를 연장하려면 그 노드를 조준하고 <blue>{key:ActionPrimary}</> 버튼을 누르세요. 그런 다음 다른 노드를 클릭하면 두 노드가 연결됩니다. 이미 연결된 노드를 클릭하면 해당 선로 구간이 제거됩니다.
TrainsRailsDescription3=노드는 수평 거리 1~32칸 범위에서 연결할 수 있습니다. 커브는 반경이 최소 3칸이어야 하며, 한 구간에서 최대 120°까지 방향을 바꿀 수 있습니다. 최대 경사는 25%입니다. 연결할 수 없는 경우 메시지에 이유가 표시됩니다.
TrainsRailsDescription4=분기점을 만들려면 노드의 같은 쪽에 여러 선로를 연결하세요. 열차가 경로에 맞는 갈래를 선택합니다.
TrainsRailsDescription5=일직선으로 붙어 있는 노드는 자동으로 연결됩니다. 새 노드 하나당 {item:SteelRail} 1개를 소모합니다. 노드를 제거하면 연결된 선로도 함께 제거됩니다. 설계도에는 노드와 연결 정보가 함께 저장됩니다.
TrainsRailsDescription6=열차는 급커브에서 속도를 줄입니다. 오르막에서의 속도는 열차의 무게와 기관차의 견인력에 따라 달라집니다.
TrainsStations=역
TrainsStationsDescription1={item:RailStation} 블록 하나는 기관차나 화차 한 량을 위한 승강장입니다. 역에 정차하려면 열차가 표시등이 없는 쪽으로 들어와 반대쪽 표시등을 향해 이동해야 합니다.
TrainsStationsDescription2=승강장을 같은 방향으로, 앞뒤로 붙여 놓으면 하나의 역이 됩니다. 열차 전체를 처리하려면 기관차와 화차마다 승강장을 하나씩 마련하세요.
TrainsStationsDescription3=열차가 역으로 향하면 <yellow>노란 표시등</>이 켜집니다. 정차 중에는 <red>빨간 표시등</>, 출발할 때는 <green>초록 표시등</>이 켜집니다. 빨간 표시등이 깜박이면 연료 부족 등의 이유로 출발이 지연되고 있다는 뜻입니다.
TrainsStationsDescription4=승강장을 조준하고 <blue>{key:ActionSecondary}</> 버튼을 누르면 역 창이 열립니다.
TrainsStationsDescription5=<blue>1) 역 이름</>\n\n운행 일정에서는 이름으로 역을 지정합니다. 같은 이름의 역이 여러 곳이면 열차가 경로의 길이와 선로 및 승강장의 사용 현황을 고려해 역을 선택합니다.
TrainsStationsDescription6=<blue>2) 승강장의 차량</>\n\n승강장 창에는 그곳에 정차한 차량의 내용물이 표시됩니다. 적재기와 로봇 팔은 승강장을 통해 아이템을 옮기고, 펌프는 탱크차를 채우거나 비웁니다. 기관차의 경우 연료가 표시되며, 승강장을 통한 연료 공급도 가능합니다.
TrainsStationsDescription7=<blue>3) 블록 설정</>\n\n톱니바퀴 버튼으로 역이 출력하는 신호를 설정할 수 있습니다. 자세한 내용은 '출발 조건'을 참고하세요.
TrainsStationsDescription8=<blue>4) 역</>\n\n역과 좌표를 표시합니다. 역에 열차가 정차해 있으면 그 옆에 열차 번호도 표시됩니다.
TrainsStationsDescription9=<blue>5) 역 정보</>\n\n여기에서 역 이름을 바꾸고 좌표와 승강장 수를 확인할 수 있습니다. 아래에는 운행 일정에 이 역 이름이 들어 있는 열차의 수가 표시됩니다.
TrainsStationsDescription10=<blue>6) 열차 열기</>\n\n역에 정차한 열차의 운행 일정을 엽니다.
TrainsConsist=기관차와 화차
TrainsConsistDescription1=기관차나 화차를 들고 선로나 역을 조준한 뒤 <blue>{key:ActionPrimary}</> 버튼을 누르세요. 놓기 전에 차량이 향하는 방향을 확인하세요. <blue>{key:ActionRotate}</> 키로 방향을 뒤집을 수 있습니다. 열차에 화차를 추가하려면 역에 정차한 열차 뒤에 놓으세요.
TrainsConsistDescription2=열차가 움직이려면 진행 방향을 향하는 기관차가 적어도 한 량 있어야 합니다. 기관차가 한 량뿐이면 되돌아올 수 있는 순환 선로가 필요합니다. 양 끝이 막힌 선로를 왕복하려면 반대 방향을 향하는 기관차 두 량을 놓으세요.
TrainsConsistDescription3=기관차에는 연료 슬롯이 두 개 있으며, 화로와 같은 연료를 사용합니다. 진행 방향을 향하고 연료가 있는 기관차마다 견인력이 더해집니다. 화차에 화물을 실을수록 열차는 무거워집니다.
TrainsConsistDescription4={item:CargoWagon}에는 아이템 10스택을 실을 수 있습니다. {item:TankWagon}는 한 번에 한 종류의 유체를 운반합니다.
TrainsConsistDescription5=차량을 조준하고 <blue>{key:ActionSecondary}</> 버튼을 누르면 차량 창이 열립니다. 역에서 열차를 해체하려면 {item:Multitool}을 사용하세요. 선택한 차량이 인벤토리로 돌아옵니다.
TrainsConsistDescription6=<blue>1) 스위치</>\n\n열차를 끄면 제동한 뒤 그 자리에 멈춥니다. 다시 켜면 운행 일정을 이어갑니다.
TrainsConsistDescription7=<blue>2) 상태</>\n\n열차 이름이나 번호 아래에 차량 번호와 열차 상태가 표시됩니다. 정차 중인 역이나 향하고 있는 역도 확인할 수 있습니다.
TrainsConsistDescription8=<blue>3) 내용물</>\n\n기관차의 연료 또는 화차의 화물입니다.
TrainsConsistDescription9=<blue>4) 운행 일정</>\n\n열차 창에서 이 열차의 운행 일정을 엽니다.
TrainsConsistDescription10=<blue>5) 조준 정보</>\n\n차량을 조준하면 내용물과 열차 상태를 볼 수 있습니다.
TrainsSchedule=운행 일정
TrainsScheduleDescription1=<blue>{key:Trains}</> 키나 차량 창의 '운행 일정' 버튼으로 열차 창을 여세요. 새 열차를 놓은 역은 이미 운행 일정에 등록되어 있습니다. 다음 정차역을 추가해 경로를 지정하세요.
TrainsScheduleDescription2=<blue>1) 열차</>\n\n목록에서 열차를 선택하면 운행 일정이 열립니다. 이름, 번호(예: #12), 경로에 있는 역 이름으로 검색할 수 있습니다.
TrainsScheduleDescription3=<blue>2) 열차 이름</>\n\n여기에서 열차 이름을 지정할 수 있습니다. 비워 두면 목록에 열차 번호가 표시됩니다.
TrainsScheduleDescription4=<blue>3) 운행 일정 반복</>\n\n반복을 켜면 열차가 마지막 정차역 다음에 첫 역으로 돌아갑니다. 끄면 마지막 역에서 운행을 마칩니다.
TrainsScheduleDescription5=<blue>4) 지금 출발</>\n\n현재 정차역의 출발 조건을 기다리지 않고 넘어갑니다. 열차가 지정된 역에 정차해 있고 운행 일정에 다음 정차역이 있을 때 사용할 수 있습니다.
TrainsScheduleDescription6=<blue>5) 경로 보기</>\n\n다음 역까지의 경로도를 엽니다.
TrainsScheduleDescription7=<blue>6) 정차역 선택</>\n\n정차역 옆의 화살표를 클릭하면 열차가 그 역으로 향합니다. 이동 중에도 목적지를 바꿀 수 있습니다. 현재 정차역은 강조 표시되며, 그 아래에 열차 상태가 표시됩니다.
TrainsScheduleDescription8=<blue>7) 역</>\n\n열차가 방문할 역을 목록에서 선택하세요.
TrainsScheduleDescription9=<blue>8) 정차 순서</>\n\n화살표로 정차역을 위아래로 옮기고, X로 삭제할 수 있습니다. <blue>+ 정차역 추가</> 버튼은 목록 아래에 있습니다.
TrainsScheduleDescription10=<blue>9) 출발 조건</>\n\n열차가 이 정차역을 떠날 수 있는 조건을 지정합니다. 자세한 내용은 '출발 조건'을 참고하세요.
TrainsScheduleDescription11=오른쪽의 '편성' 패널에는 기관차, 화차와 그 내용물이 표시됩니다.
TrainsConditions=출발 조건
TrainsConditionsDescription1=정차역마다 완전 적재나 일정 시간 대기 같은 출발 조건을 지정할 수 있습니다. 역 자체의 신호와 승강장에 연결한 전선을 통해 받은 신호를 조건에 사용할 수 있습니다.
TrainsConditionsDescription2=<blue>1) 모드</>\n\n신호를 숫자나 다른 신호와 비교하려면 <blue>Expr</>를 선택하세요. 여러 조건을 조합하려면 <blue>And</>, <blue>Or</>, <blue>Xor</> 중 하나를 선택하고 + 버튼으로 조건을 추가하세요.\n\nAnd는 모든 조건이, Or는 하나 이상의 조건이, Xor는 홀수 개의 조건이 참이어야 합니다. <blue>Always</>는 도착 직후 출발을 허용합니다.
TrainsConditionsDescription3=<blue>2) 표시등</>\n\n조건을 만족하면 초록색, 그렇지 않으면 빨간색으로 표시됩니다.
TrainsConditionsDescription4=<blue>3) 신호</>\n\n클릭해서 비교할 신호를 선택하세요. 아이템을 선택해 그 수량을 비교할 수도 있습니다.
TrainsConditionsDescription5=<blue>4) 비교</>\n\n두 값이 같아야 하는지(=), 달라야 하는지(!=), 첫 값이 더 커야 하는지(>), 더 작아야 하는지(<) 선택합니다. >=와 <=는 같은 값도 허용합니다.
TrainsConditionsDescription6=<blue>5) 값</>\n\n첫 신호와 비교할 숫자나 두 번째 신호입니다.
TrainsConditionsDescription7=<blue>6) 역 신호</>\n\n역 설정에서 필요한 신호를 켜세요. '저장 내용'은 화차에 있는 각 아이템과 유체의 수량을 별도의 신호로 출력합니다.\n\n기본 설정에서 <blue>P</>는 역에 정차한 시간을 틱 단위로, <blue>I</>는 화물이 마지막으로 변한 뒤 지난 틱 수를 표시합니다. <blue>F</>는 기관차에 들어 있는 연료 아이템의 총수량입니다.\n\n열차가 완전히 적재되면 <blue>L</>이 1, 비어 있으면 <blue>E</>가 1이 됩니다. 이 신호는 편성의 모든 화차와 탱크차를 확인합니다.
TrainsConditionsDescription8=<blue>7) 값</>\n\n역이 현재 출력하는 신호의 값입니다.
TrainsConditionsDescription9=완전히 적재한 뒤 출발하려면 <blue>L = 1</>, 하역 후 출발하려면 <blue>E = 1</>을 사용하세요. 화차가 덜 찼더라도 적재가 멈추면 출발하게 하려면 <blue>I >= 100</>을 사용하세요. 화물에 변화가 없는 상태로 5초가 지나면 열차가 출발합니다.\n\n시간은 틱으로 측정하며, 1초는 20틱입니다. 따라서 <blue>P >= 600</> 조건은 역에서 30초 동안 기다리도록 합니다.
TrainsSignals=철도 신호기
TrainsSignalsDescription1=신호기는 선로를 폐색 구간으로 나눕니다. 열차는 진입 전에 구간을 예약하며, 다른 열차는 그 구간이 빌 때까지 기다립니다. 신호기를 손에 들면 구간이 서로 다른 색으로 강조 표시됩니다.
TrainsSignalsDescription2=신호기를 들고 선로를 조준하세요. 가장 가까운 노드의 진행 방향 오른쪽에 미리보기가 표시됩니다. <blue>{key:ActionRotate}</> 키로 방향을 뒤집고 <blue>{key:ActionPrimary}</> 버튼으로 설치하세요.\n\n제거하려면 신호기를 든 상태에서 다시 클릭하거나 {item:Multitool}을 사용하세요.
TrainsSignalsDescription3={item:RailSignal}는 비어 있는 구간으로의 진입을 허용합니다. {item:RailChainSignal}는 열차의 경로에서 다음 일반 신호기와 그 뒤 구간까지 확인합니다.\n\n분기점 앞에는 연동 신호기를, 뒤에는 일반 신호기를 놓으세요. 열차는 분기점에 들어가기 전에 출구가 빌 때까지 기다립니다. 출구 신호기 뒤 구간은 열차 전체가 들어갈 만큼 길어야 합니다.
TrainsSignalsDescription4=신호기는 해당 노드를 통과할 수 있는 방향을 정합니다. 양방향 선로에서는 같은 노드에 서로 반대 방향의 신호기를 한 쌍 설치하세요.
TrainsSignalsDescription5=<red>빨간불</>은 통과를 금지하고 <green>초록불</>은 진입을 허용합니다. <yellow>노란불</>은 이 신호기를 통과할 열차가 해당 구간을 예약했음을 뜻합니다.\n\n연동 신호기의 초록불은 하나 이상의 출구가 열려 있다는 뜻입니다. 열차는 자신의 경로에 있는 출구가 열렸을 때 진행합니다.
TrainsSignalsDescription6=<blue>1) 선로 노드 창</>\n\n선로 노드를 조준하고 <blue>{key:ActionSecondary}</> 버튼을 누르면 창이 열립니다. 각 신호기마다 세 개의 표시등이 한 줄로 배치되어 실제 신호등 상태를 보여 줍니다. 스위치를 끄면 노드의 모든 신호기가 닫히고, 다시 켜면 정상 작동으로 돌아갑니다.
TrainsSignalsDescription7=<blue>2) 블록 설정</>\n\n톱니바퀴 버튼으로 논리 신호 설정을 엽니다. 노드는 <blue>R</>, <blue>Y</>, <blue>G</>를 출력하며, 각각 빨간불, 노란불, 초록불인 신호기의 수를 나타냅니다.\n\n전선으로 제어하려면 '작동' 입력(<blue>W</>)을 켜세요. 값이 0보다 크면 통과를 허용하지만, 신호기는 여전히 선로 점유 여부를 확인합니다.
TrainsWaiting=열차 상태
TrainsWaitingDescription1=열차 상태는 열차 목록과 현재 정차역에 표시되며, 차량을 조준해도 볼 수 있습니다. 이동 중에 지연되면 열차는 주기적으로 목적지까지의 다른 경로를 확인합니다.
TrainsWaitingDescription2=<blue>1) 경로 보기</>\n\n화살표가 있는 초록색 선이 계획된 경로입니다. 경로를 찾지 못하면 탐색한 선로가 빨간색으로 표시됩니다. 빨간 표시는 탐색을 이어갈 수 없었던 위치입니다.
TrainsWaitingDescription3=<blue>2) 상태</>\n\n열차가 무엇을 하고 있는지, 또는 무엇이 이동을 막는지 보여 줍니다.
TrainsWaitingDescription4=<blue>출발 조건</>은 열차가 적재, 하역 또는 운행 일정에 지정된 다른 조건을 기다린다는 뜻입니다. <blue>다음 정차역 없음</>이 표시되면 운행 일정을 확인하세요. 일정이 끝났거나 지정한 이름의 역이 사라진 상태입니다.\n\n<blue>경로 없음</>이면 선로 연결, 역과 신호기의 방향, 기관차의 방향을 확인하세요. <blue>승강장 사용 중</>은 필요한 이름의 역이 다른 열차에 이미 예약되었다는 뜻입니다.\n\n<blue>빨간 신호</>와 <blue>전방에 열차</>는 이동 중 정차한 이유를 알려 줍니다. 신호기가 통과를 막거나 다른 열차가 길을 막고 있습니다.\n\n<blue>정지됨</>이면 차량 창에서 열차를 켜세요. <blue>기관차 없음</>이면 진행 방향을 향한 기관차가 필요합니다. <blue>연료 없음</>이면 열차를 끄는 기관차에 연료를 공급하세요.
