[tips]
StackTransfers=Stack transfers
StackTransfersDescription=<blue>Shift + Left-click</>: Transfers a single stack\n<blue>Shift + Right-click</>: Transfers a half of stack\n\n<blue>Control + Left-click</>: Transfers all stacks of the given type\n<blue>Control + Right-click</>: Transfers half of items of the given type\n\n<blue>Control + Left-click on empty slot</>: transfer the whole inventory\n<blue>Control + Right-click on empty slot</>: transfer a half of whole inventory\n\n<blue>Alt + Left-click</>: transfer five items\n<blue>Alt + Right-click</>: transfer one item
ChestLimiting=Chest limiting
ChestLimitingDescription=
Screwdriver=Screwdriver
ScrewdriverDescription=Press <blue>Left Mouse Button</> while holding a <blue>Screwdriver</> and drag to one of arrow directions then release button to rotate block. At the moment only single cell blocks can be rotatared with this method.\n\nRotation depends on the plane you are hovering over.\nAfter releasing the button, the plane will rotate in such a way that it replaces the plane indicated by the selected arrow
RotationWhileBuilding=Rotation while building
RotationWhileBuildingDescription=Press <blue>R</> to rotate the block around vertical axis.\nYou can change this axis by holding <blue>Shift</> or <blue>Alt</> key.\nActive axis will be shown with green arrow and axis like in piclure above.\n\nWhile holding some buildable item you can hold <blue>Right Mouse Button</> and drag to one of arrow directions then release button to rotate block. This method allows rotation of blocks with any size.
BlockPipette=Block pipette
BlockPipetteDescription=Press <blue>Q</> to copy hovered block with its rotation. Press <blue>Q</> again to clear selection.\nIt is always working in Creative mode and only when you have same item in inventory in Normal mode\n\nPress <blue>Ctrl+C</> to copy settings from hovered block\nPress <blue>Ctrl+V</> to paste setting from clipboard to hovered block\n\nBlock settings availible not for all blocks. All block settings is just a text.
FirstSteps=First steps
FirstStepsDescription=Finding and Smelting Copper Ore (Malachite, Chalcopyrite)\n\n1. First, locate copper ore: Malachite or Chalcopyrite. Areas where ore is visible on the ground usually have more deposits nearby or just below the surface.\n2. Gather the copper ore.\n3. Use basic blocks from your inventory to create a platform for convenience.\n4. Craft a furnace and a smelter. Place the smelter above the furnace.\n5. Put fuel in the furnace and place the copper ore in the smelter.\n6. Once the smelting process is complete, collect the copper ingots.\n\nBuilding Essential Machinery\n\n1. Create another furnace, a Stirling engine, a compact generator, and a computer.\n2. Arrange these components according to their inputs and outputs.\n3. Once the computer is operational, you can start researching new technologies.
Interface=Interface
Map=Map
InterfaceDescription1=<blue>1) Hotbar</>\n\nAt the beginning, the currently held item is displayed along with its name above it.\nAfter it, quick access slots are shown. These can be selected by mouse click or the corresponding number key.\nThe hotbar holds items by type and draws them directly from the player's inventory.\n
InterfaceDescription2=<blue>2) Player Inventory</>\n\nThe main section consists of a grid of item slots.\nLeft-click an item to pick it up. Click on a slot again to place the item there. Click on another item to swap them.\n\nAt the bottom, there are dedicated slots for the jetpack, lighting, inventory sorting, and dropping items on the ground.\nBelow that are the tools: a multitool for digging and a screwdriver for rotating blocks.\n
InterfaceDescription3=<blue>3) Miscellaneous</>\n\nThe top row contains time control buttons for the in-game time. Currently, these only affect visuals. At the end of the row is a button that stops the day-night cycle.\n\nThe second row includes a button showing research progress, followed by the tutorial button that opens this guide.\nNext is the creative mode toggle (invisible in non-creative games), then a flight mode toggle, and finally a button to highlight block inputs and outputs.\n
InterfaceDescription4=<blue>4) Player Crafting Window</>\n\nThis row contains the tab selection for the section below.\nFirst is the list of all unlocked items. Next is the Favorites tab. To add or remove an item from Favorites, right-click the item in the list below and select Toggle Favourite from the dropdown menu.\nThen comes the tab for all items available in the game. Finally, there is the Search Results tab and a text field for item search.\n
InterfaceDescription5=<blue>5) Selected Tab Contents</>\n\nDisplays the items from the selected tab, grouped into categories.\nThe number in each cell shows how many of that item can currently be crafted.\n\nLeft-clicking an item will queue 1 unit if enough resources are available, Shift + left-click queues as many as the resources allow.\n\nRight-clicking opens a context menu where you can queue multiple items, open the recipe window (Show Recipes), add all components of the item to the search (Context Search), or mark the item as a favorite (Toggle Favourite).\n
InterfaceDescription6=<blue>6) Selected Block Window</>\n\nRight-clicking a block while aiming at it opens the block's interface.\nAt the top, you'll find the power toggle and settings buttons, followed by the block’s name and tier.\nBelow that is the input inventory, along with a status indicator and a current recipe indicator (hover over it for details).\nNext comes the progress bar for the active recipe. Some machines also have a second bar that shows bonus production.\nWhen the main progress bar is full, the recipe is completed. When the bonus bar is full, a bonus item is produced.\nBelow that is the output inventory.\nAt the very bottom, other block statuses are displayed.\n
InterfaceDescription7=<blue>7) Block Minipanel (Under Crosshair)</>\n\nDisplays the name, icon, and brief information about the block the player is currently looking at.\n
MapDescription=Press <blue>M</> to open the map. The map shows explored regions, your position, and any markers.
Research=Research
ResearchDescription=Research unlocks new recipes and blocks. Earn research points to progress through the tech tree.
ResearchComputersDescription1=Research points are produced by computers only. A computer consumes electricity and adds points to the selected research once per second. Without electricity it produces nothing.
ResearchComputersDescription2=The rate depends on the computer tier: {item:CopperComputer} — 1 point per second, {item:SteelComputer} — 2, each next tier twice as much. Points of all working computers go into the same research and sum up.
ResearchComputersDescription3=Every computer has a chip slot for 3 chips of its own tier: {item:Circuit} for {item:CopperComputer}, {item:AdvancedCircuit} for {item:SteelComputer}. One chip is consumed per 30 seconds of boost, and the next chip is taken only after the current boost ends.
ResearchComputersDescription4=Boosted rate: {item:CopperComputer} — 10 points per second, {item:SteelComputer} — 100, each next tier ten times as much.
Productivity=Productivity
ProductivityDescription1=The second progress bar next to the recipe bar is Productivity. The bar fills while the machine works, and when it is full the machine gives one extra output. The extra output costs no input.
ProductivityDescription2=Productivity works on ore recipes of {machine:AutomaticHammer}, {machine:Macerator}, {machine:OreWasher}. Ore processed in them gives more plates than ore smelted directly.
BuildingModes=Building modes
BuildingModesDescription1=Machines and most blocks are built in a line: hold <blue>Left Mouse Button</> and drag away from the first cell, release to place the whole line at once.
BuildingModesDescription2=Platforms and other simple blocks fill a plane: hold <blue>Left Mouse Button</> and drag, the plane is picked by the direction you move first.
BuildingModesDescription3=Conveyors, pipes and cables are built as a run in two clicks: the first click anchors the start, the second builds the run, <blue>Right Mouse Button</> cancels it. Hold <blue>Shift</> to route the run around obstacles.\n\n<blue>Mouse Wheel</> raises and lowers the aim in every mode.
Trains=Züge
TrainsDescription1=Erforsche {research:Railway}, um die Rezepte für {item:SteelRail}, {item:RailStation}, {item:Locomotive}, {item:CargoWagon} und {item:TankWagon} freizuschalten. Die Signale {item:RailSignal} und {item:RailChainSignal} werden mit {research:RailSignals} verfügbar.
TrainsDescription2=<blue>Die erste Strecke</>\n\nBeginne mit zwei Bahnhöfen, die durch einen Gleisring verbunden sind. Baue an jedem Bahnhof zwei Bahnsteige direkt hintereinander mit gleicher Ausrichtung. Richte die Bahnhöfe so aus, dass der Zug an der Seite ohne Lampen einfährt und auf die Lampen zufährt.\n\nStelle am ersten Bahnhof eine {item:Locomotive} und dahinter einen {item:CargoWagon} auf. Platziere an beiden Bahnhöfen einen Lader oder Roboterarm neben dem Bahnsteig des Güterwagens: am ersten zum Beladen, am zweiten zum Entladen.\n\nFüge den zweiten Bahnhof zum Fahrplan hinzu und aktiviere „Fahrplan wiederholen“. Lege am Ladebahnhof <blue>L = 1</> und am Entladebahnhof <blue>E = 1</> als Abfahrtsbedingung fest. So wartet der Zug vor der Abfahrt auf die vollständige Be- beziehungsweise Entladung. Wie das geht, steht unter „Abfahrtsbedingungen“.\n\nLege Brennstoff in die Lokomotive, um den Zug zu starten.
TrainsDescription3=Drücke <blue>{key:Trains}</>, um die Liste der Züge und Bahnhöfe zu öffnen.
TrainsRails=Gleise
TrainsRailsDescription1=Nimm {item:SteelRail} in die Hand und drücke am gewünschten Ort <blue>{key:ActionPrimary}</>, um einen Gleisknoten zu setzen. Jeder weitere Knoten verbindet sich mit dem vorherigen. Beim Beginn einer neuen Kette versucht das Spiel, den ersten Knoten mit dem nächsten Knoten im Umkreis von 24 Zellen zu verbinden.\n\nPrüfe vor dem Platzieren die Vorschau: Grün bedeutet, dass die Verbindung gebaut werden kann; bei Rot passt sie nicht. Mit dem <blue>Mausrad</> änderst du die Bauhöhe.
TrainsRailsDescription2=Drücke <blue>{key:ActionSecondary}</>, um die Kette zu beenden. Um ein Gleis an einem vorhandenen Knoten fortzusetzen, ziele auf ihn und drücke <blue>{key:ActionPrimary}</>. Klicke dann auf einen anderen Knoten, um beide zu verbinden. Ein Klick auf einen bereits verbundenen Knoten entfernt diesen Gleisabschnitt.
TrainsRailsDescription3=Knoten lassen sich über einen horizontalen Abstand von 1 bis 32 Zellen verbinden. Kurven brauchen mindestens 3 Zellen Radius; ein einzelner Abschnitt darf um bis zu 120° abbiegen. Die maximale Steigung beträgt 25%. Kann eine Verbindung nicht gebaut werden, erklärt eine Meldung den Grund.
TrainsRailsDescription4=Für eine Abzweigung verbindest du mehrere Gleise mit derselben Seite eines Knotens. Züge wählen den passenden Zweig entsprechend ihrer Route.
TrainsRailsDescription5=Direkt benachbarte Knoten auf einer Geraden verbinden sich automatisch. Jeder neue Knoten verbraucht einmal {item:SteelRail}. Beim Entfernen eines Knotens werden auch die angeschlossenen Gleisabschnitte entfernt. Baupläne speichern die Knoten samt Verbindungen.
TrainsRailsDescription6=In engen Kurven werden Züge langsamer. An Steigungen hängt die Geschwindigkeit vom Gewicht des Zuges und der Zugkraft seiner Lokomotiven ab.
TrainsStations=Bahnhöfe
TrainsStationsDescription1=Jeder Block {item:RailStation} bildet einen Bahnsteig für eine Lokomotive oder einen Wagen. Zum Halten muss der Zug von der Seite ohne Lampen einfahren und auf die Lampen am anderen Ende zufahren.
TrainsStationsDescription2=Platziere Bahnsteige direkt hintereinander mit gleicher Ausrichtung, damit sie einen Bahnhof bilden. Baue für jede Lokomotive und jeden Wagen einen Bahnsteig, um den gesamten Zug zu versorgen.
TrainsStationsDescription3=Die <yellow>gelbe Lampe</> leuchtet, wenn ein Zug den Bahnhof ansteuert. Die <red>rote Lampe</> leuchtet während des Halts und die <green>grüne Lampe</> bei der Abfahrt. Blinkendes Rot zeigt eine verzögerte Abfahrt an, etwa wegen fehlenden Brennstoffs.
TrainsStationsDescription4=Ziele auf einen Bahnsteig und drücke <blue>{key:ActionSecondary}</>, um das Bahnhofsfenster zu öffnen.
TrainsStationsDescription5=<blue>1) Bahnhofsname</>\n\nIm Fahrplan werden Bahnhöfe anhand ihres Namens ausgewählt. Teilen sich mehrere Bahnhöfe einen Namen, wählt der Zug einen davon anhand der Streckenlänge und der Belegung von Gleisen und Bahnsteigen.
TrainsStationsDescription6=<blue>2) Wagen am Bahnsteig</>\n\nDas Bahnsteigfenster zeigt den Inhalt des dort stehenden Wagens. Lader und Roboterarme übertragen Gegenstände über den Bahnsteig; Pumpen füllen und leeren Kesselwagen. Bei einer Lokomotive wird hier ihr Brennstoff angezeigt. Auch dieser lässt sich über den Bahnsteig zuführen.
TrainsStationsDescription7=<blue>3) Blockeinstellungen</>\n\nDie Zahnradtaste öffnet die Einstellungen für die vom Bahnhof ausgegebenen Signale. Mehr dazu unter „Abfahrtsbedingungen“.
TrainsStationsDescription8=<blue>4) Bahnhöfe</>\n\nHier stehen die Bahnhöfe mit ihren Koordinaten. Steht ein Zug an einem Bahnhof, wird daneben seine Nummer angezeigt.
TrainsStationsDescription9=<blue>5) Bahnhofsdetails</>\n\nHier kannst du den Bahnhof umbenennen sowie seine Koordinaten und die Anzahl der Bahnsteige ablesen. Darunter steht, wie viele Züge diesen Bahnhofsnamen im Fahrplan haben.
TrainsStationsDescription10=<blue>6) Zug öffnen</>\n\nÖffnet den Fahrplan des Zuges, der am Bahnhof steht.
TrainsConsist=Lokomotiven und Wagen
TrainsConsistDescription1=Nimm eine Lokomotive oder einen Wagen in die Hand, ziele auf ein Gleis oder einen Bahnhof und drücke <blue>{key:ActionPrimary}</>. Prüfe vor dem Platzieren die Ausrichtung. Mit <blue>{key:ActionRotate}</> drehst du das Fahrzeug um. Um einen Wagen anzukuppeln, platziere ihn hinter dem Zug, während dieser am Bahnhof steht.
TrainsConsistDescription2=Ein Zug kann in eine Richtung fahren, wenn mindestens eine Lokomotive dorthin zeigt. Mit nur einer Lokomotive braucht er eine Schleife für die Rückfahrt. Für Fahrten zwischen zwei Stumpfgleisen stellst du zwei Lokomotiven mit entgegengesetzter Ausrichtung auf.
TrainsConsistDescription3=Eine Lokomotive hat zwei Plätze für denselben Brennstoff, den auch ein Ofen verwendet. Jede mit Brennstoff versorgte Lokomotive in Fahrtrichtung erhöht die Zugkraft. Mit zunehmender Beladung der Wagen wird der Zug schwerer.
TrainsConsistDescription4=Ein {item:CargoWagon} fasst 10 Gegenstandsstapel. Ein {item:TankWagon} transportiert jeweils eine Flüssigkeitssorte.
TrainsConsistDescription5=Ziele auf ein Fahrzeug und drücke <blue>{key:ActionSecondary}</>, um sein Fenster zu öffnen. Zum Zerlegen eines Zuges am Bahnhof verwendest du das {item:Multitool}: Es legt das ausgewählte Fahrzeug zurück ins Inventar.
TrainsConsistDescription6=<blue>1) Schalter</>\n\nEin ausgeschalteter Zug bremst und bleibt stehen. Schalte ihn wieder ein, damit er seinen Fahrplan fortsetzt.
TrainsConsistDescription7=<blue>2) Zustand</>\n\nUnter dem Namen oder der Nummer des Zuges stehen die Wagennummer und der Zustand des Zuges. Hier siehst du auch, an welchem Bahnhof er steht oder welchen er ansteuert.
TrainsConsistDescription8=<blue>3) Inhalt</>\n\nDer Brennstoff der Lokomotive oder die Ladung des Wagens.
TrainsConsistDescription9=<blue>4) Fahrplan</>\n\nÖffnet den Fahrplan dieses Zuges im Zugfenster.
TrainsConsistDescription10=<blue>5) Info beim Anvisieren</>\n\nZiele auf ein Fahrzeug, um seinen Inhalt und den Zustand des Zuges zu sehen.
TrainsSchedule=Fahrplan
TrainsScheduleDescription1=Öffne das Zugfenster mit <blue>{key:Trains}</> oder über „Fahrplan“ im Fahrzeugfenster. Der Bahnhof, an dem du einen neuen Zug aufgestellt hast, steht bereits in seinem Fahrplan. Füge einen weiteren Halt hinzu, um seine Route festzulegen.
TrainsScheduleDescription2=<blue>1) Züge</>\n\nWähle einen Zug aus der Liste, um seinen Fahrplan zu öffnen. Suche nach Name, Nummer (etwa #12) oder einem Bahnhof auf seiner Route.
TrainsScheduleDescription3=<blue>2) Zugname</>\n\nHier kannst du dem Zug einen Namen geben. Solange das Feld leer ist, zeigt die Liste seine Nummer.
TrainsScheduleDescription4=<blue>3) Fahrplan wiederholen</>\n\nMit aktivierter Wiederholung kehrt der Zug nach dem letzten Halt zum ersten zurück. Deaktiviere sie, damit die Fahrt am letzten Bahnhof endet.
TrainsScheduleDescription5=<blue>4) Sofort abfahren</>\n\n„Sofort abfahren“ überspringt die Abfahrtsbedingung am aktuellen Halt. Die Taste ist verfügbar, wenn der Zug an seinem Bahnhof steht und einen weiteren Halt im Fahrplan hat.
TrainsScheduleDescription6=<blue>5) Route anzeigen</>\n\n„Route anzeigen“ öffnet eine Übersicht der Route zum nächsten Bahnhof.
TrainsScheduleDescription7=<blue>6) Halt auswählen</>\n\nKlicke auf den Pfeil neben einem Halt, um den Zug dorthin zu schicken. Das Ziel lässt sich auch während der Fahrt ändern. Der aktuelle Halt ist hervorgehoben; darunter steht der Zustand des Zuges.
TrainsScheduleDescription8=<blue>7) Bahnhof</>\n\nWähle den gewünschten Zielbahnhof aus der Liste.
TrainsScheduleDescription9=<blue>8) Reihenfolge der Halte</>\n\nDie Pfeile verschieben einen Halt nach oben oder unten, das Kreuz entfernt ihn. Die Taste <blue>+ Halt hinzufügen</> befindet sich unter der Liste.
TrainsScheduleDescription10=<blue>9) Abfahrtsbedingung</>\n\nLegt fest, wann der Zug diesen Halt verlassen darf. Mehr dazu unter „Abfahrtsbedingungen“.
TrainsScheduleDescription11=Rechts zeigt der Bereich „Zugverband“ die Lokomotiven, Wagen und deren Inhalt.
TrainsConditions=Abfahrtsbedingungen
TrainsConditionsDescription1=Für jeden Halt lässt sich eine Abfahrtsbedingung festlegen, etwa eine volle Ladung oder eine bestimmte Wartezeit. Bedingungen können die eigenen Signale des Bahnhofs und die über Kabel an seinen Bahnsteigen eingehenden Signale verwenden.
TrainsConditionsDescription2=<blue>1) Modus</>\n\nWähle <blue>Expr</>, um ein Signal mit einer Zahl oder einem anderen Signal zu vergleichen. Zum Verknüpfen mehrerer Bedingungen wählst du <blue>And</>, <blue>Or</> oder <blue>Xor</> und fügst mit + Bedingungen hinzu.\n\nBei And müssen alle Bedingungen erfüllt sein, bei Or mindestens eine und bei Xor eine ungerade Anzahl. <blue>Always</> erlaubt die Abfahrt sofort nach der Ankunft.
TrainsConditionsDescription3=<blue>2) Anzeige</>\n\nDie Anzeige leuchtet grün, wenn die Bedingung erfüllt ist, andernfalls rot.
TrainsConditionsDescription4=<blue>3) Signal</>\n\nKlicke hier, um ein Signal für den Vergleich auszuwählen. Du kannst auch einen Gegenstand wählen, um seine Menge zu vergleichen.
TrainsConditionsDescription5=<blue>4) Vergleich</>\n\nLege fest, ob die Werte gleich (=) oder verschieden (!=) sein müssen oder ob der erste größer (>) oder kleiner (<) sein soll. Die Zeichen >= und <= erlauben auch gleiche Werte.
TrainsConditionsDescription6=<blue>5) Wert</>\n\nEine Zahl oder ein zweites Signal, mit dem das erste verglichen wird.
TrainsConditionsDescription7=<blue>6) Bahnhofssignale</>\n\nAktiviere in den Bahnhofseinstellungen die benötigten Signale. „Lagerinhalt“ gibt die Menge jedes Gegenstands und jeder Flüssigkeit in den Wagen als eigenes Signal aus.\n\nStandardmäßig zeigt <blue>P</> die Standzeit am Bahnhof in Ticks und <blue>I</> die Ticks seit der letzten Änderung der Ladung. <blue>F</> zeigt die Gesamtzahl der Brennstoffgegenstände in den Lokomotiven.\n\nBei voller Ladung ist <blue>L</> gleich 1, bei vollständig leerem Zug ist <blue>E</> gleich 1. Diese Signale berücksichtigen alle Güter- und Kesselwagen des Zuges.
TrainsConditionsDescription8=<blue>7) Werte</>\n\nDie aktuellen Werte der vom Bahnhof ausgegebenen Signale.
TrainsConditionsDescription9=Mit <blue>L = 1</> fährt der Zug nach vollständiger Beladung ab, mit <blue>E = 1</> nach vollständiger Entladung. Soll er warten, bis die Beladung aufhört, auch wenn der Wagen erst teilweise gefüllt ist, verwende <blue>I >= 100</>: Dann fährt er nach fünf Sekunden ohne Ladungsänderung ab.\n\nDie Zeit wird in Ticks gemessen; eine Sekunde hat 20 Ticks. Die Bedingung <blue>P >= 600</> hält den Zug daher 30 Sekunden am Bahnhof.
TrainsSignals=Signale
TrainsSignalsDescription1=Signale unterteilen Gleise in Blöcke. Vor der Einfahrt reserviert ein Zug den Block; andere Züge warten, bis er wieder frei ist. Hältst du ein Signal in der Hand, werden die Blöcke in unterschiedlichen Farben hervorgehoben.
TrainsSignalsDescription2=Nimm ein Signal in die Hand und ziele auf ein Gleis. Die Vorschau erscheint am nächsten Knoten rechts in Fahrtrichtung. Mit <blue>{key:ActionRotate}</> kehrst du die Richtung um; mit <blue>{key:ActionPrimary}</> platzierst du das Signal.\n\nZum Entfernen klickst du erneut darauf, während du ein Signal in der Hand hältst, oder verwendest das {item:Multitool}.
TrainsSignalsDescription3={item:RailSignal} erlaubt die Einfahrt in einen freien Block. {item:RailChainSignal} prüft die Route des Zuges bis zum nächsten normalen Signal einschließlich des dahinterliegenden Blocks.\n\nPlatziere vor einer Abzweigung ein Kettensignal und dahinter ein normales Signal. So wartet der Zug vor der Abzweigung auf eine freie Ausfahrt. Der Block hinter dem Ausfahrtsignal muss lang genug für den gesamten Zug sein.
TrainsSignalsDescription4=Ein Signal legt die erlaubte Fahrtrichtung durch seinen Knoten fest. Setze auf Gleisen mit Gegenverkehr am selben Knoten zwei Signale für entgegengesetzte Richtungen.
TrainsSignalsDescription5=Ein <red>rotes Licht</> sperrt die Durchfahrt, ein <green>grünes Licht</> gibt sie frei. <yellow>Gelb</> leuchtet, wenn der Block von einem Zug reserviert ist, der dieses Signal passieren wird.\n\nBei einem Kettensignal bedeutet Grün, dass mindestens eine Ausfahrt frei ist. Der Zug fährt weiter, wenn die Ausfahrt auf seiner eigenen Route frei ist.
TrainsSignalsDescription6=<blue>1) Gleisknotenfenster</>\n\nZiele auf einen Gleisknoten und drücke <blue>{key:ActionSecondary}</>, um sein Fenster zu öffnen. Jedes Signal hat eine Reihe mit drei Lampen, die seine Lichter wiedergeben. Der Schalter sperrt alle Signale am Knoten; erneutes Einschalten stellt den normalen Betrieb wieder her.
TrainsSignalsDescription7=<blue>2) Blockeinstellungen</>\n\nDie Zahnradtaste öffnet die Einstellungen der Logiksignale. Der Knoten gibt <blue>R</>, <blue>Y</> und <blue>G</> aus: die Anzahl seiner Signale mit rotem, gelbem beziehungsweise grünem Licht.\n\nAktiviere für die Steuerung über ein Kabel den Eingang „Betrieb“ (<blue>W</>). Ein Wert größer als 0 erlaubt die Durchfahrt; die Signale prüfen dabei weiterhin die Gleisbelegung.
TrainsWaiting=Zugzustände
TrainsWaitingDescription1=Der Zustand eines Zuges wird in der Zugliste, am aktuellen Halt und beim Anvisieren eines Fahrzeugs angezeigt. Bei Verzögerungen unterwegs sucht der Zug regelmäßig nach anderen Routen zu seinem Ziel.
TrainsWaitingDescription2=<blue>1) Route anzeigen</>\n\nEine grüne Linie mit Pfeilen zeigt die geplante Route. Wurde keine Route gefunden, markieren rote Linien die bei der Suche untersuchten Gleise. Eine rote Markierung zeigt, wo die Suche nicht weiterkam.
TrainsWaitingDescription3=<blue>2) Zustand</>\n\nZeigt, was der Zug gerade tut oder was ihn am Weiterfahren hindert.
TrainsWaitingDescription4=<blue>Abfahrtsbedingung</> bedeutet, dass der Zug auf die Be- oder Entladung oder eine andere Bedingung im Fahrplan wartet. Prüfe bei <blue>Kein nächster Halt</> den Fahrplan: Er ist zu Ende, oder er nennt einen Bahnhof, der nicht mehr existiert.\n\nPrüfe bei <blue>Keine Route</> die Gleisverbindungen sowie die Ausrichtung von Bahnhöfen, Signalen und Lokomotiven. <blue>Bahnsteige belegt</> bedeutet, dass die Bahnhöfe mit dem gesuchten Namen bereits von anderen Zügen reserviert sind.\n\n<blue>Rotes Signal</> und <blue>Zug voraus</> erklären einen Halt unterwegs: Entweder sperrt ein Signal die Durchfahrt oder ein anderer Zug steht im Weg.\n\nBei <blue>Angehalten</> schaltest du den Zug im Fahrzeugfenster wieder ein. Bei <blue>Keine Lokomotive</> fehlt eine Lokomotive in Fahrtrichtung. <blue>Kein Brennstoff</> bedeutet, dass die ziehenden Lokomotiven Brennstoff brauchen.
