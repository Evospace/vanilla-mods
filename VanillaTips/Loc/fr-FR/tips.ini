[tips]
StackTransfers=Stack transfers
StackTransfersDescription=<blue>Shift + Left-click</>: Transfers a single stack\n<blue>Shift + Right-click</>: Transfers a half of stack\n\n<blue>Control + Left-click</>: Transfers all stacks of the given type\n<blue>Control + Right-click</>: Transfers half of items of the given type\n\n<blue>Control + Left-click on empty slot</>: transfer the whole inventory\n<blue>Control + Right-click on empty slot</>: transfer a half of whole inventory\n\n<blue>Alt + Left-click</>: transfer five items\n<blue>Alt + Right-click</>: transfer one item
ChestLimiting=Chest limiting
ChestLimitingDescription=
Screwdriver=Screwdriver
ScrewdriverDescription=Press <blue>Left Mouse Button</> while holding a <blue>Screwdriver</> and drag to one of arrow directions then release button to rotate block. At the moment only single cell blocks can be rotatared with this method.\n\nRotation depends on the plane you are hovering over.\nAfter releasing the button, the plane will rotate in such a way that it replaces the plane indicated by the selected arrow
RotationWhileBuilding=Rotation while building
RotationWhileBuildingDescription=Press <blue>R</> to rotate the block around vertical axis.\nYou can change this axis by holding <blue>Shift</> or <blue>Alt</> key.\nActive axis will be shown with green arrow and axis like in piclure above.\n\nWhile holding some buildable item you can hold <blue>Right Mouse Button</> and drag to one of arrow directions then release button to rotate block. This method allows rotation of blocks with any size.
BlockPipette=Block pipette
BlockPipetteDescription=Press <blue>Q</> to copy hovered block with its rotation. Press <blue>Q</> again to clear selection.\nIt is always working in Creative mode and only when you have same item in inventory in Normal mode\n\nPress <blue>Ctrl+C</> to copy settings from hovered block\nPress <blue>Ctrl+V</> to paste setting from clipboard to hovered block\n\nBlock settings availible not for all blocks. All block settings is just a text.
FirstSteps=First steps
FirstStepsDescription=Finding and Smelting Copper Ore (Malachite, Chalcopyrite)\n\n1. First, locate copper ore: Malachite or Chalcopyrite. Areas where ore is visible on the ground usually have more deposits nearby or just below the surface.\n2. Gather the copper ore.\n3. Use basic blocks from your inventory to create a platform for convenience.\n4. Craft a furnace and a smelter. Place the smelter above the furnace.\n5. Put fuel in the furnace and place the copper ore in the smelter.\n6. Once the smelting process is complete, collect the copper ingots.\n\nBuilding Essential Machinery\n\n1. Create another furnace, a Stirling engine, a compact generator, and a computer.\n2. Arrange these components according to their inputs and outputs.\n3. Once the computer is operational, you can start researching new technologies.
Interface=Interface
Map=Map
InterfaceDescription1=<blue>1) Hotbar</>\n\nAt the beginning, the currently held item is displayed along with its name above it.\nAfter it, quick access slots are shown. These can be selected by mouse click or the corresponding number key.\nThe hotbar holds items by type and draws them directly from the player's inventory.\n
InterfaceDescription2=<blue>2) Player Inventory</>\n\nThe main section consists of a grid of item slots.\nLeft-click an item to pick it up. Click on a slot again to place the item there. Click on another item to swap them.\n\nAt the bottom, there are dedicated slots for the jetpack, lighting, inventory sorting, and dropping items on the ground.\nBelow that are the tools: a multitool for digging and a screwdriver for rotating blocks.\n
InterfaceDescription3=<blue>3) Miscellaneous</>\n\nThe top row contains time control buttons for the in-game time. Currently, these only affect visuals. At the end of the row is a button that stops the day-night cycle.\n\nThe second row includes a button showing research progress, followed by the tutorial button that opens this guide.\nNext is the creative mode toggle (invisible in non-creative games), then a flight mode toggle, and finally a button to highlight block inputs and outputs.\n
InterfaceDescription4=<blue>4) Player Crafting Window</>\n\nThis row contains the tab selection for the section below.\nFirst is the list of all unlocked items. Next is the Favorites tab. To add or remove an item from Favorites, right-click the item in the list below and select Toggle Favourite from the dropdown menu.\nThen comes the tab for all items available in the game. Finally, there is the Search Results tab and a text field for item search.\n
InterfaceDescription5=<blue>5) Selected Tab Contents</>\n\nDisplays the items from the selected tab, grouped into categories.\nThe number in each cell shows how many of that item can currently be crafted.\n\nLeft-clicking an item will queue 1 unit if enough resources are available, Shift + left-click queues as many as the resources allow.\n\nRight-clicking opens a context menu where you can queue multiple items, open the recipe window (Show Recipes), add all components of the item to the search (Context Search), or mark the item as a favorite (Toggle Favourite).\n
InterfaceDescription6=<blue>6) Selected Block Window</>\n\nRight-clicking a block while aiming at it opens the block's interface.\nAt the top, you'll find the power toggle and settings buttons, followed by the block’s name and tier.\nBelow that is the input inventory, along with a status indicator and a current recipe indicator (hover over it for details).\nNext comes the progress bar for the active recipe. Some machines also have a second bar that shows bonus production.\nWhen the main progress bar is full, the recipe is completed. When the bonus bar is full, a bonus item is produced.\nBelow that is the output inventory.\nAt the very bottom, other block statuses are displayed.\n
InterfaceDescription7=<blue>7) Block Minipanel (Under Crosshair)</>\n\nDisplays the name, icon, and brief information about the block the player is currently looking at.\n
MapDescription=Press <blue>M</> to open the map. The map shows explored regions, your position, and any markers.
Research=Research
ResearchDescription=Research unlocks new recipes and blocks. Earn research points to progress through the tech tree.
ResearchComputersDescription1=Research points are produced by computers only. A computer consumes electricity and adds points to the selected research once per second. Without electricity it produces nothing.
ResearchComputersDescription2=The rate depends on the computer tier: {item:CopperComputer} — 1 point per second, {item:SteelComputer} — 2, each next tier twice as much. Points of all working computers go into the same research and sum up.
ResearchComputersDescription3=Every computer has a chip slot for 3 chips of its own tier: {item:Circuit} for {item:CopperComputer}, {item:AdvancedCircuit} for {item:SteelComputer}. One chip is consumed per 30 seconds of boost, and the next chip is taken only after the current boost ends.
ResearchComputersDescription4=Boosted rate: {item:CopperComputer} — 10 points per second, {item:SteelComputer} — 100, each next tier ten times as much.
Productivity=Productivity
ProductivityDescription1=The second progress bar next to the recipe bar is Productivity. The bar fills while the machine works, and when it is full the machine gives one extra output. The extra output costs no input.
ProductivityDescription2=Productivity works on ore recipes of {machine:AutomaticHammer}, {machine:Macerator}, {machine:OreWasher}. Ore processed in them gives more plates than ore smelted directly.
BuildingModes=Building modes
BuildingModesDescription1=Machines and most blocks are built in a line: hold <blue>Left Mouse Button</> and drag away from the first cell, release to place the whole line at once.
BuildingModesDescription2=Platforms and other simple blocks fill a plane: hold <blue>Left Mouse Button</> and drag, the plane is picked by the direction you move first.
BuildingModesDescription3=Conveyors, pipes and cables are built as a run in two clicks: the first click anchors the start, the second builds the run, <blue>Right Mouse Button</> cancels it. Hold <blue>Shift</> to route the run around obstacles.\n\n<blue>Mouse Wheel</> raises and lowers the aim in every mode.
Trains=Trains
TrainsDescription1=Terminez la recherche {research:Railway} pour débloquer les recettes de {item:SteelRail}, {item:RailStation}, {item:Locomotive}, {item:CargoWagon} et {item:TankWagon}. Les signaux {item:RailSignal} et {item:RailChainSignal} deviennent disponibles après la recherche {research:RailSignals}.
TrainsDescription2=<blue>Première ligne</>\n\nCommencez par deux gares reliées par une boucle de rails. Construisez deux quais par gare, placés bout à bout et orientés dans le même sens. Orientez les gares pour que le train entre du côté sans feux et avance vers les feux.\n\nPlacez une {item:Locomotive} dans la première gare, puis un {item:CargoWagon} derrière elle. Installez un chargeur ou un bras robotisé à côté du quai du wagon dans chaque gare : pour le chargement dans la première et le déchargement dans la seconde.\n\nAjoutez la seconde gare au programme et activez « Répéter le programme ». Réglez la condition de départ sur <blue>L = 1</> à la gare de chargement et sur <blue>E = 1</> à celle de déchargement. Le train attendra d'être entièrement chargé ou déchargé avant de partir. La rubrique « Conditions de départ » explique ces réglages.\n\nMettez du combustible dans la locomotive pour démarrer le train.
TrainsDescription3=Appuyez sur <blue>{key:Trains}</> pour ouvrir la liste des trains et des gares.
TrainsRails=Rails
TrainsRailsDescription1=Prenez {item:SteelRail} en main et appuyez sur <blue>{key:ActionPrimary}</> à l'endroit choisi pour placer un nœud ferroviaire. Chaque nouveau nœud se relie au précédent. Au début d'une nouvelle chaîne, le jeu essaie de relier le premier nœud au plus proche dans un rayon de 24 cases.\n\nVérifiez l'aperçu avant de placer un nœud : en vert, la liaison peut être construite ; en rouge, elle ne convient pas. La <blue>molette de la souris</> règle la hauteur de construction.
TrainsRailsDescription2=Appuyez sur <blue>{key:ActionSecondary}</> pour terminer la chaîne. Pour prolonger une voie depuis un nœud existant, visez-le et appuyez sur <blue>{key:ActionPrimary}</>. Cliquez ensuite sur un autre nœud pour les relier. Cliquer sur un nœud déjà relié supprime ce tronçon de voie.
TrainsRailsDescription3=Les nœuds peuvent être reliés sur une distance horizontale de 1 à 32 cases. Les courbes demandent un rayon d'au moins 3 cases, et un tronçon peut tourner de 120° au maximum. La pente maximale est de 25%. Si une liaison ne peut pas être construite, un message en explique la raison.
TrainsRailsDescription4=Pour créer une bifurcation, reliez plusieurs voies au même côté d'un nœud. Les trains choisissent la branche qui correspond à leur itinéraire.
TrainsRailsDescription5=Les nœuds adjacents alignés se relient automatiquement. Chaque nouveau nœud consomme un {item:SteelRail}. Supprimer un nœud supprime aussi les voies qui lui sont reliées. Les plans conservent les nœuds et leurs liaisons.
TrainsRailsDescription6=Les trains ralentissent dans les courbes serrées. En montée, leur vitesse dépend du poids du convoi et de la force de traction des locomotives.
TrainsStations=Gares
TrainsStationsDescription1=Chaque bloc {item:RailStation} ajoute un quai pour une locomotive ou un wagon. Pour s'arrêter en gare, le train doit entrer du côté sans feux et avancer vers les feux à l'autre extrémité.
TrainsStationsDescription2=Placez les quais bout à bout, dans le même sens, pour former une seule gare. Prévoyez un quai par locomotive et par wagon afin de desservir tout le convoi.
TrainsStationsDescription3=Le <yellow>feu jaune</> s'allume lorsqu'un train se dirige vers la gare. Le <red>feu rouge</> s'allume pendant l'arrêt, et le <green>feu vert</> au départ. Un feu rouge clignotant indique un départ retardé, par exemple par manque de combustible.
TrainsStationsDescription4=Visez un quai et appuyez sur <blue>{key:ActionSecondary}</> pour ouvrir la fenêtre de la gare.
TrainsStationsDescription5=<blue>1) Nom de la gare</>\n\nLe programme désigne les gares par leur nom. Si plusieurs gares portent le même nom, le train en choisit une selon la longueur du trajet et l'occupation des voies et des quais.
TrainsStationsDescription6=<blue>2) Véhicule à quai</>\n\nLa fenêtre du quai affiche le contenu du véhicule qui s'y trouve. Les chargeurs et les bras robotisés transfèrent les objets par le quai, tandis que les pompes remplissent et vident les wagons-citernes. Pour une locomotive, cette fenêtre affiche le combustible, qui peut lui aussi être fourni par le quai.
TrainsStationsDescription7=<blue>3) Réglages du bloc</>\n\nLe bouton en forme d'engrenage ouvre les réglages des signaux émis par la gare. Consultez « Conditions de départ » pour en savoir plus.
TrainsStationsDescription8=<blue>4) Gares</>\n\nAffiche les gares et leurs coordonnées. Si un train est à quai, son numéro apparaît à côté de la gare.
TrainsStationsDescription9=<blue>5) Détails de la gare</>\n\nVous pouvez ici renommer la gare et consulter ses coordonnées ainsi que son nombre de quais. Plus bas figure le nombre de trains dont le programme utilise ce nom de gare.
TrainsStationsDescription10=<blue>6) Ouvrir le train</>\n\nOuvre le programme du train présent en gare.
TrainsConsist=Locomotives et wagons
TrainsConsistDescription1=Prenez une locomotive ou un wagon en main, visez une voie ou une gare et appuyez sur <blue>{key:ActionPrimary}</>. Vérifiez son orientation avant de le placer. Appuyez sur <blue>{key:ActionRotate}</> pour le retourner. Pour ajouter un wagon à un train, placez-le derrière celui-ci pendant qu'il est en gare.
TrainsConsistDescription2=Un train peut avancer dans une direction si au moins une locomotive est orientée dans ce sens. Avec une seule locomotive, il lui faut une boucle pour revenir. Pour circuler entre deux voies en impasse, placez deux locomotives orientées en sens opposés.
TrainsConsistDescription3=Une locomotive dispose de deux emplacements pour le même combustible que celui des fours. Chaque locomotive alimentée et orientée dans le sens de la marche ajoute de la force de traction. Plus les wagons sont chargés, plus le train est lourd.
TrainsConsistDescription4=Un {item:CargoWagon} contient 10 piles d'objets. Un {item:TankWagon} transporte un seul type de fluide à la fois.
TrainsConsistDescription5=Visez un véhicule et appuyez sur <blue>{key:ActionSecondary}</> pour ouvrir sa fenêtre. Pour démonter un train en gare, utilisez {item:Multitool} : le véhicule sélectionné retourne dans votre inventaire.
TrainsConsistDescription6=<blue>1) Interrupteur</>\n\nUn train désactivé freine puis reste sur place. Réactivez-le pour qu'il reprenne son programme.
TrainsConsistDescription7=<blue>2) État</>\n\nSous le nom ou le numéro du train figurent le numéro du véhicule et l'état du train. Vous y voyez aussi la gare où il est arrêté ou celle vers laquelle il se dirige.
TrainsConsistDescription8=<blue>3) Contenu</>\n\nLe combustible de la locomotive ou le chargement du wagon.
TrainsConsistDescription9=<blue>4) Programme</>\n\nOuvre le programme de ce train dans la fenêtre des trains.
TrainsConsistDescription10=<blue>5) Fiche au survol</>\n\nVisez un véhicule pour voir son contenu et l'état du train.
TrainsSchedule=Programme
TrainsScheduleDescription1=Ouvrez la fenêtre des trains avec <blue>{key:Trains}</> ou le bouton « Programme » dans la fenêtre d'un véhicule. La gare où vous avez placé un nouveau train figure déjà dans son programme. Ajoutez un autre arrêt pour définir son itinéraire.
TrainsScheduleDescription2=<blue>1) Trains</>\n\nSélectionnez un train dans la liste pour ouvrir son programme. Recherchez-le par son nom, son numéro (par exemple #12) ou le nom d'une gare de son itinéraire.
TrainsScheduleDescription3=<blue>2) Nom du train</>\n\nDonnez ici un nom au train. Tant que le champ est vide, la liste affiche son numéro.
TrainsScheduleDescription4=<blue>3) Répéter le programme</>\n\nLorsque la répétition est activée, le train retourne au premier arrêt après le dernier. Désactivez-la pour terminer le trajet à la dernière gare.
TrainsScheduleDescription5=<blue>4) Partir maintenant</>\n\n« Partir maintenant » ignore la condition de départ à l'arrêt actuel. Ce bouton est disponible quand le train est à sa gare et qu'un autre arrêt est prévu dans son programme.
TrainsScheduleDescription6=<blue>5) Afficher l'itinéraire</>\n\n« Afficher l'itinéraire » ouvre un schéma du trajet jusqu'à la prochaine gare.
TrainsScheduleDescription7=<blue>6) Choisir un arrêt</>\n\nCliquez sur la flèche à côté d'un arrêt pour y envoyer le train. La destination peut être modifiée pendant le trajet. L'arrêt actuel est mis en évidence, avec l'état du train affiché en dessous.
TrainsScheduleDescription8=<blue>7) Gare</>\n\nChoisissez dans la liste la gare où le train doit se rendre.
TrainsScheduleDescription9=<blue>8) Ordre des arrêts</>\n\nLes flèches déplacent un arrêt vers le haut ou le bas ; la croix le supprime. Le bouton <blue>+ Ajouter un arrêt</> se trouve sous la liste.
TrainsScheduleDescription10=<blue>9) Condition de départ</>\n\nDéfinit quand le train peut quitter cet arrêt. Consultez « Conditions de départ » pour en savoir plus.
TrainsScheduleDescription11=Le panneau « Composition », à droite, affiche les locomotives, les wagons et leur contenu.
TrainsConditions=Conditions de départ
TrainsConditionsDescription1=Chaque arrêt peut avoir une condition de départ, comme attendre un chargement complet ou une durée donnée. Les conditions peuvent utiliser les signaux de la gare et ceux reçus par les fils raccordés à ses quais.
TrainsConditionsDescription2=<blue>1) Mode</>\n\nChoisissez <blue>Expr</> pour comparer un signal à un nombre ou à un autre signal. Pour combiner des conditions, choisissez <blue>And</>, <blue>Or</> ou <blue>Xor</> et ajoutez des conditions avec le bouton +.\n\nAnd exige que toutes les conditions soient remplies, Or qu'au moins une le soit, et Xor qu'un nombre impair le soit. <blue>Always</> autorise le départ dès l'arrivée du train.
TrainsConditionsDescription3=<blue>2) Voyant</>\n\nLe voyant passe au vert lorsque la condition est remplie, et au rouge sinon.
TrainsConditionsDescription4=<blue>3) Signal</>\n\nCliquez pour choisir un signal à comparer. Vous pouvez aussi choisir un objet pour comparer sa quantité.
TrainsConditionsDescription5=<blue>4) Comparaison</>\n\nChoisissez si les valeurs doivent être égales (=), différentes (!=), ou si la première doit être supérieure (>) ou inférieure (<) à la seconde. Les signes >= et <= acceptent aussi l'égalité.
TrainsConditionsDescription6=<blue>5) Valeur</>\n\nUn nombre ou un second signal auquel comparer le premier.
TrainsConditionsDescription7=<blue>6) Signaux de la gare</>\n\nActivez les signaux souhaités dans les réglages de la gare. « Contenu stocké » émet la quantité de chaque objet et de chaque fluide dans les wagons sous forme de signal distinct.\n\nPar défaut, <blue>P</> indique le temps passé en gare, en ticks, et <blue>I</> le nombre de ticks depuis le dernier changement de chargement. <blue>F</> indique la quantité totale d'objets combustibles dans les locomotives.\n\nQuand le train est entièrement chargé, <blue>L</> vaut 1 ; quand il est vide, <blue>E</> vaut 1. Ces signaux prennent en compte tous les wagons de marchandises et les wagons-citernes du train.
TrainsConditionsDescription8=<blue>7) Valeurs</>\n\nLes valeurs actuelles des signaux émis par la gare.
TrainsConditionsDescription9=Utilisez <blue>L = 1</> pour partir après un chargement complet et <blue>E = 1</> après le déchargement. Pour attendre la fin du chargement même si le wagon n'est que partiellement rempli, utilisez <blue>I >= 100</> : le train part après cinq secondes sans changement de chargement.\n\nLe temps se mesure en ticks, à raison de 20 ticks par seconde. La condition <blue>P >= 600</> retient donc le train en gare pendant 30 secondes.
TrainsSignals=Signaux ferroviaires
TrainsSignalsDescription1=Les signaux divisent les voies en cantons. Avant d'entrer dans un canton, un train le réserve ; les autres attendent qu'il se libère. Lorsque vous tenez un signal en main, les cantons sont surlignés de différentes couleurs.
TrainsSignalsDescription2=Prenez un signal en main et visez une voie. L'aperçu apparaît au nœud le plus proche, à droite dans le sens de circulation. Appuyez sur <blue>{key:ActionRotate}</> pour inverser son sens et sur <blue>{key:ActionPrimary}</> pour le placer.\n\nPour le retirer, cliquez à nouveau dessus avec un signal en main, ou utilisez {item:Multitool}.
TrainsSignalsDescription3={item:RailSignal} autorise l'entrée dans un canton libre. {item:RailChainSignal} vérifie l'itinéraire du train jusqu'au prochain signal ordinaire, y compris le canton situé après celui-ci.\n\nPlacez un signal de chaîne avant une bifurcation et un signal ordinaire après. Le train attendra ainsi que la sortie soit libre avant de s'engager. Le canton après le signal de sortie doit pouvoir accueillir le train entier.
TrainsSignalsDescription4=Un signal détermine le sens autorisé à travers son nœud. Sur une voie à double sens, placez deux signaux de sens opposés au même nœud.
TrainsSignalsDescription5=Un <red>feu rouge</> interdit le passage et un <green>feu vert</> l'autorise. Le <yellow>jaune</> s'allume quand le canton est réservé par un train qui passera ce signal.\n\nPour un signal de chaîne, le vert signifie qu'au moins une sortie est libre. Le train passe lorsque la sortie de son propre itinéraire est libre.
TrainsSignalsDescription6=<blue>1) Fenêtre du nœud ferroviaire</>\n\nVisez un nœud ferroviaire et appuyez sur <blue>{key:ActionSecondary}</> pour ouvrir sa fenêtre. Chaque signal dispose d'une rangée de trois voyants reproduisant ses feux. L'interrupteur ferme tous les signaux du nœud ; sa réactivation rétablit leur fonctionnement normal.
TrainsSignalsDescription7=<blue>2) Réglages du bloc</>\n\nLe bouton en forme d'engrenage ouvre les réglages des signaux logiques. Le nœud émet <blue>R</>, <blue>Y</> et <blue>G</>, qui indiquent respectivement le nombre de signaux affichant un feu rouge, jaune et vert.\n\nPour commander les signaux par un fil, activez l'entrée « Fonctionnement » (<blue>W</>). Une valeur supérieure à 0 autorise le passage ; les signaux continuent toutefois de vérifier l'occupation de la voie.
TrainsWaiting=États du train
TrainsWaitingDescription1=L'état du train apparaît dans la liste des trains, à l'arrêt actuel et lorsque vous visez un véhicule. En cas de retard en route, le train recherche régulièrement d'autres itinéraires vers sa destination.
TrainsWaitingDescription2=<blue>1) Afficher l'itinéraire</>\n\nUne ligne verte avec des flèches indique l'itinéraire prévu. Si aucun trajet n'a été trouvé, les lignes rouges montrent les voies explorées pendant la recherche. Un repère rouge indique où la recherche n'a pas pu continuer.
TrainsWaitingDescription3=<blue>2) État</>\n\nIndique ce que fait le train ou ce qui l'empêche d'avancer.
TrainsWaitingDescription4=<blue>Condition de départ</> signifie que le train attend le chargement, le déchargement ou une autre condition de son programme. S'il affiche <blue>Aucun arrêt suivant</>, vérifiez le programme : il est terminé ou désigne une gare qui n'existe plus.\n\nPour <blue>Aucun itinéraire</>, vérifiez les liaisons des voies, le sens des gares et des signaux ainsi que l'orientation des locomotives. <blue>Quais occupés</> signifie que les gares portant le nom demandé sont déjà réservées par d'autres trains.\n\n<blue>Signal rouge</> et <blue>Train devant</> expliquent un arrêt en route : soit un signal ferme le passage, soit un autre train bloque la voie.\n\nSi le train affiche <blue>Arrêté</>, réactivez-le dans la fenêtre d'un véhicule. <blue>Aucune locomotive</> indique qu'il faut une locomotive orientée dans le sens du trajet. <blue>Aucun combustible</> indique que les locomotives qui tirent le train doivent être ravitaillées.
