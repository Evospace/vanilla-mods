[tips]
StackTransfers=Stack transfers
StackTransfersDescription=<blue>Shift + Left-click</>: Transfers a single stack\n<blue>Shift + Right-click</>: Transfers a half of stack\n\n<blue>Control + Left-click</>: Transfers all stacks of the given type\n<blue>Control + Right-click</>: Transfers half of items of the given type\n\n<blue>Control + Left-click on empty slot</>: transfer the whole inventory\n<blue>Control + Right-click on empty slot</>: transfer a half of whole inventory\n\n<blue>Alt + Left-click</>: transfer five items\n<blue>Alt + Right-click</>: transfer one item
ChestLimiting=Chest limiting
ChestLimitingDescription=
Screwdriver=Screwdriver
ScrewdriverDescription=Press <blue>Left Mouse Button</> while holding a <blue>Screwdriver</> and drag to one of arrow directions then release button to rotate block. At the moment only single cell blocks can be rotatared with this method.\n\nRotation depends on the plane you are hovering over.\nAfter releasing the button, the plane will rotate in such a way that it replaces the plane indicated by the selected arrow
RotationWhileBuilding=Rotation while building
RotationWhileBuildingDescription=Press <blue>R</> to rotate the block around vertical axis.\nYou can change this axis by holding <blue>Shift</> or <blue>Alt</> key.\nActive axis will be shown with green arrow and axis like in piclure above.\n\nWhile holding some buildable item you can hold <blue>Right Mouse Button</> and drag to one of arrow directions then release button to rotate block. This method allows rotation of blocks with any size.
BlockPipette=Block pipette
BlockPipetteDescription=Press <blue>Q</> to copy hovered block with its rotation. Press <blue>Q</> again to clear selection.\nIt is always working in Creative mode and only when you have same item in inventory in Normal mode\n\nPress <blue>Ctrl+C</> to copy settings from hovered block\nPress <blue>Ctrl+V</> to paste setting from clipboard to hovered block\n\nBlock settings availible not for all blocks. All block settings is just a text.
FirstSteps=First steps
FirstStepsDescription=Finding and Smelting Copper Ore (Malachite, Chalcopyrite)\n\n1. First, locate copper ore: Malachite or Chalcopyrite. Areas where ore is visible on the ground usually have more deposits nearby or just below the surface.\n2. Gather the copper ore.\n3. Use basic blocks from your inventory to create a platform for convenience.\n4. Craft a furnace and a smelter. Place the smelter above the furnace.\n5. Put fuel in the furnace and place the copper ore in the smelter.\n6. Once the smelting process is complete, collect the copper ingots.\n\nBuilding Essential Machinery\n\n1. Create another furnace, a Stirling engine, a compact generator, and a computer.\n2. Arrange these components according to their inputs and outputs.\n3. Once the computer is operational, you can start researching new technologies.
Interface=Interface
Map=Map
InterfaceDescription1=<blue>1) Hotbar</>\n\nAt the beginning, the currently held item is displayed along with its name above it.\nAfter it, quick access slots are shown. These can be selected by mouse click or the corresponding number key.\nThe hotbar holds items by type and draws them directly from the player's inventory.\n
InterfaceDescription2=<blue>2) Player Inventory</>\n\nThe main section consists of a grid of item slots.\nLeft-click an item to pick it up. Click on a slot again to place the item there. Click on another item to swap them.\n\nAt the bottom, there are dedicated slots for the jetpack, lighting, inventory sorting, and dropping items on the ground.\nBelow that are the tools: a multitool for digging and a screwdriver for rotating blocks.\n
InterfaceDescription3=<blue>3) Miscellaneous</>\n\nThe top row contains time control buttons for the in-game time. Currently, these only affect visuals. At the end of the row is a button that stops the day-night cycle.\n\nThe second row includes a button showing research progress, followed by the tutorial button that opens this guide.\nNext is the creative mode toggle (invisible in non-creative games), then a flight mode toggle, and finally a button to highlight block inputs and outputs.\n
InterfaceDescription4=<blue>4) Player Crafting Window</>\n\nThis row contains the tab selection for the section below.\nFirst is the list of all unlocked items. Next is the Favorites tab. To add or remove an item from Favorites, right-click the item in the list below and select Toggle Favourite from the dropdown menu.\nThen comes the tab for all items available in the game. Finally, there is the Search Results tab and a text field for item search.\n
InterfaceDescription5=<blue>5) Selected Tab Contents</>\n\nDisplays the items from the selected tab, grouped into categories.\nThe number in each cell shows how many of that item can currently be crafted.\n\nLeft-clicking an item will queue 1 unit if enough resources are available, Shift + left-click queues as many as the resources allow.\n\nRight-clicking opens a context menu where you can queue multiple items, open the recipe window (Show Recipes), add all components of the item to the search (Context Search), or mark the item as a favorite (Toggle Favourite).\n
InterfaceDescription6=<blue>6) Selected Block Window</>\n\nRight-clicking a block while aiming at it opens the block's interface.\nAt the top, you'll find the power toggle and settings buttons, followed by the block’s name and tier.\nBelow that is the input inventory, along with a status indicator and a current recipe indicator (hover over it for details).\nNext comes the progress bar for the active recipe. Some machines also have a second bar that shows bonus production.\nWhen the main progress bar is full, the recipe is completed. When the bonus bar is full, a bonus item is produced.\nBelow that is the output inventory.\nAt the very bottom, other block statuses are displayed.\n
InterfaceDescription7=<blue>7) Block Minipanel (Under Crosshair)</>\n\nDisplays the name, icon, and brief information about the block the player is currently looking at.\n
MapDescription=Press <blue>M</> to open the map. The map shows explored regions, your position, and any markers.
Research=Research
ResearchDescription=Research unlocks new recipes and blocks. Earn research points to progress through the tech tree.
ResearchComputersDescription1=Research points are produced by computers only. A computer consumes electricity and adds points to the selected research once per second. Without electricity it produces nothing.
ResearchComputersDescription2=The rate depends on the computer tier: {item:CopperComputer} — 1 point per second, {item:SteelComputer} — 2, each next tier twice as much. Points of all working computers go into the same research and sum up.
ResearchComputersDescription3=Every computer has a chip slot for 3 chips of its own tier: {item:Circuit} for {item:CopperComputer}, {item:AdvancedCircuit} for {item:SteelComputer}. One chip is consumed per 30 seconds of boost, and the next chip is taken only after the current boost ends.
ResearchComputersDescription4=Boosted rate: {item:CopperComputer} — 10 points per second, {item:SteelComputer} — 100, each next tier ten times as much.
Productivity=Productivity
ProductivityDescription1=The second progress bar next to the recipe bar is Productivity. The bar fills while the machine works, and when it is full the machine gives one extra output. The extra output costs no input.
ProductivityDescription2=Productivity works on ore recipes of {machine:AutomaticHammer}, {machine:Macerator}, {machine:OreWasher}. Ore processed in them gives more plates than ore smelted directly.
BuildingModes=Building modes
BuildingModesDescription1=Machines and most blocks are built in a line: hold <blue>Left Mouse Button</> and drag away from the first cell, release to place the whole line at once.
BuildingModesDescription2=Platforms and other simple blocks fill a plane: hold <blue>Left Mouse Button</> and drag, the plane is picked by the direction you move first.
BuildingModesDescription3=Conveyors, pipes and cables are built as a run in two clicks: the first click anchors the start, the second builds the run, <blue>Right Mouse Button</> cancels it. Hold <blue>Shift</> to route the run around obstacles.\n\n<blue>Mouse Wheel</> raises and lowers the aim in every mode.
Trains=Trens
TrainsDescription1=Conclua a pesquisa {research:Railway} para liberar as receitas de {item:SteelRail}, {item:RailStation}, {item:Locomotive}, {item:CargoWagon} e {item:TankWagon}. Os sinais {item:RailSignal} e {item:RailChainSignal} ficam disponíveis após a pesquisa {research:RailSignals}.
TrainsDescription2=<blue>Primeira linha</>\n\nComece com duas estações ligadas por um circuito de trilhos. Construa duas plataformas em cada estação, uma após a outra e voltadas para a mesma direção. Posicione as estações para que o trem entre pela ponta sem luzes e siga em direção às luzes.\n\nColoque uma {item:Locomotive} na primeira estação e um {item:CargoWagon} atrás dela. Instale um carregador ou braço robótico ao lado da plataforma do vagão em cada estação: para carregar na primeira e descarregar na segunda.\n\nAdicione a segunda estação à programação e ative “Repetir a programação”. Defina a condição de partida como <blue>L = 1</> na estação de carga e <blue>E = 1</> na de descarga. Assim, o trem aguardará a carga ou descarga completa antes de partir. Veja como configurar isso em “Condições de partida”.\n\nColoque combustível na locomotiva para iniciar a viagem.
TrainsDescription3=Pressione <blue>{key:Trains}</> para abrir a lista de trens e estações.
TrainsRails=Trilhos
TrainsRailsDescription1=Com {item:SteelRail} na mão, pressione <blue>{key:ActionPrimary}</> no local escolhido para colocar um nó ferroviário. Cada novo nó se conecta ao anterior. Ao iniciar uma nova sequência, o jogo tenta conectar o primeiro nó ao mais próximo em um raio de 24 células.\n\nConfira a prévia antes de colocar o nó: verde indica que a conexão pode ser construída; vermelho, que ela não se encaixa. Use a <blue>roda do mouse</> para ajustar a altura.
TrainsRailsDescription2=Pressione <blue>{key:ActionSecondary}</> para encerrar a sequência. Para estender os trilhos a partir de um nó existente, mire nele e pressione <blue>{key:ActionPrimary}</>. Depois, clique em outro nó para conectar os dois. Clicar em um nó já conectado remove esse trecho de trilhos.
TrainsRailsDescription3=Os nós podem ser conectados a uma distância horizontal de 1 a 32 células. As curvas precisam de um raio mínimo de 3 células, e cada trecho pode virar até 120°. A inclinação máxima é de 25%. Quando uma conexão não pode ser construída, uma mensagem explica o motivo.
TrainsRailsDescription4=Para criar uma bifurcação, conecte vários trilhos ao mesmo lado de um nó. Os trens escolhem o ramal de acordo com a rota.
TrainsRailsDescription5=Nós adjacentes em linha reta se conectam automaticamente. Cada novo nó consome uma unidade de {item:SteelRail}. Remover um nó também remove os trilhos conectados a ele. Os projetos preservam os nós e suas conexões.
TrainsRailsDescription6=Os trens reduzem a velocidade em curvas fechadas. Nas subidas, a velocidade depende do peso do trem e da força de tração das locomotivas.
TrainsStations=Estações
TrainsStationsDescription1=Cada bloco {item:RailStation} acrescenta uma plataforma para uma locomotiva ou vagão. Para parar na estação, o trem deve entrar pela ponta sem luzes e seguir em direção às luzes na ponta oposta.
TrainsStationsDescription2=Coloque as plataformas uma após a outra, voltadas para a mesma direção, para formar uma estação. Construa uma plataforma para cada locomotiva e vagão, de modo a atender o trem inteiro.
TrainsStationsDescription3=A <yellow>luz amarela</> acende quando um trem está a caminho da estação. A <red>luz vermelha</> acende durante a parada, e a <green>luz verde</> durante a partida. Uma luz vermelha piscando indica um atraso na partida, por exemplo por falta de combustível.
TrainsStationsDescription4=Mire em uma plataforma e pressione <blue>{key:ActionSecondary}</> para abrir a janela da estação.
TrainsStationsDescription5=<blue>1) Nome da estação</>\n\nA programação identifica as estações pelo nome. Se várias tiverem o mesmo nome, o trem escolhe uma delas levando em conta a distância da rota e a ocupação dos trilhos e plataformas.
TrainsStationsDescription6=<blue>2) Veículo na plataforma</>\n\nA janela da plataforma mostra o conteúdo do veículo parado ao lado dela. Carregadores e braços robóticos transferem itens pela plataforma, enquanto bombas enchem e esvaziam vagões-tanque. No caso de uma locomotiva, aparece o combustível, que também pode ser fornecido pela plataforma.
TrainsStationsDescription7=<blue>3) Configurações do bloco</>\n\nO botão de engrenagem abre as configurações dos sinais emitidos pela estação. Saiba mais em “Condições de partida”.
TrainsStationsDescription8=<blue>4) Estações</>\n\nMostra as estações e suas coordenadas. Se houver um trem na estação, seu número aparece ao lado dela.
TrainsStationsDescription9=<blue>5) Detalhes da estação</>\n\nAqui você pode renomear a estação e consultar suas coordenadas e o número de plataformas. Abaixo aparece quantos trens usam esse nome de estação na programação.
TrainsStationsDescription10=<blue>6) Abrir o trem</>\n\nAbre a programação do trem que está na estação.
TrainsConsist=Locomotivas e vagões
TrainsConsistDescription1=Com uma locomotiva ou vagão na mão, mire nos trilhos ou em uma estação e pressione <blue>{key:ActionPrimary}</>. Confira a direção antes de colocar. Pressione <blue>{key:ActionRotate}</> para virar o veículo. Para adicionar um vagão a um trem, coloque-o atrás do trem enquanto ele estiver em uma estação.
TrainsConsistDescription2=Um trem pode seguir em uma direção se pelo menos uma locomotiva estiver voltada para ela. Com apenas uma locomotiva, ele precisa de um circuito de retorno. Para viajar entre duas pontas sem saída, coloque duas locomotivas voltadas para direções opostas.
TrainsConsistDescription3=A locomotiva tem dois espaços para o mesmo combustível usado nas fornalhas. Cada locomotiva abastecida e voltada para o sentido da viagem aumenta a força de tração. Conforme os vagões recebem carga, o trem fica mais pesado.
TrainsConsistDescription4=Um {item:CargoWagon} comporta 10 pilhas de itens. Um {item:TankWagon} transporta um tipo de fluido por vez.
TrainsConsistDescription5=Mire em um veículo e pressione <blue>{key:ActionSecondary}</> para abrir sua janela. Para desmontar um trem na estação, use {item:Multitool}: o veículo selecionado volta para o inventário.
TrainsConsistDescription6=<blue>1) Interruptor</>\n\nAo ser desligado, o trem freia e permanece no lugar. Ligue-o novamente para continuar a programação.
TrainsConsistDescription7=<blue>2) Estado</>\n\nAbaixo do nome ou número do trem aparecem o número do veículo e o estado do trem. Também é possível ver em qual estação ele está parado ou para qual está indo.
TrainsConsistDescription8=<blue>3) Conteúdo</>\n\nO combustível da locomotiva ou a carga do vagão.
TrainsConsistDescription9=<blue>4) Programação</>\n\nAbre a programação deste trem na janela de trens.
TrainsConsistDescription10=<blue>5) Informações ao mirar</>\n\nMire em um veículo para ver seu conteúdo e o estado do trem.
TrainsSchedule=Programação
TrainsScheduleDescription1=Abra a janela de trens com <blue>{key:Trains}</> ou pelo botão “Programação” na janela de um veículo. A estação onde você colocou um trem novo já está na programação dele. Adicione outra parada para definir a rota.
TrainsScheduleDescription2=<blue>1) Trens</>\n\nSelecione um trem na lista para abrir sua programação. Pesquise pelo nome, número (como #12) ou pelo nome de uma estação da rota.
TrainsScheduleDescription3=<blue>2) Nome do trem</>\n\nDê um nome ao trem aqui. Enquanto o campo estiver vazio, a lista mostra o número dele.
TrainsScheduleDescription4=<blue>3) Repetir a programação</>\n\nCom a repetição ativada, o trem retorna à primeira parada depois da última. Desative-a para encerrar a viagem na última estação.
TrainsScheduleDescription5=<blue>4) Partir agora</>\n\n“Partir agora” ignora a condição de partida da parada atual. O botão fica disponível quando o trem está na sua estação e tem outra parada na programação.
TrainsScheduleDescription6=<blue>5) Mostrar rota</>\n\n“Mostrar rota” abre um diagrama do caminho até a próxima estação.
TrainsScheduleDescription7=<blue>6) Selecionar parada</>\n\nClique na seta ao lado de uma parada para enviar o trem até ela. Você pode mudar o destino durante a viagem. A parada atual fica destacada, com o estado do trem logo abaixo.
TrainsScheduleDescription8=<blue>7) Estação</>\n\nEscolha na lista a estação que o trem deve visitar.
TrainsScheduleDescription9=<blue>8) Ordem das paradas</>\n\nAs setas movem uma parada para cima ou para baixo, e o X a remove. O botão <blue>+ Adicionar parada</> fica abaixo da lista.
TrainsScheduleDescription10=<blue>9) Condição de partida</>\n\nDefine quando o trem pode sair desta parada. Saiba mais em “Condições de partida”.
TrainsScheduleDescription11=O painel “Composição”, à direita, mostra as locomotivas, os vagões e seus conteúdos.
TrainsConditions=Condições de partida
TrainsConditionsDescription1=Cada parada pode ter uma condição de partida, como esperar a carga completa ou um tempo determinado. As condições podem usar os sinais da própria estação e os recebidos pelos fios conectados às plataformas.
TrainsConditionsDescription2=<blue>1) Modo</>\n\nEscolha <blue>Expr</> para comparar um sinal com um número ou outro sinal. Para combinar condições, escolha <blue>And</>, <blue>Or</> ou <blue>Xor</> e adicione condições com o botão +.\n\nAnd exige que todas as condições sejam atendidas, Or exige pelo menos uma e Xor exige uma quantidade ímpar. <blue>Always</> permite partir assim que o trem chega.
TrainsConditionsDescription3=<blue>2) Indicador</>\n\nO indicador fica verde quando a condição é atendida e vermelho caso contrário.
TrainsConditionsDescription4=<blue>3) Sinal</>\n\nClique para escolher um sinal a comparar. Você também pode escolher um item para comparar sua quantidade.
TrainsConditionsDescription5=<blue>4) Comparação</>\n\nEscolha se os valores devem ser iguais (=), diferentes (!=), ou se o primeiro deve ser maior (>) ou menor (<) que o segundo. Os sinais >= e <= também permitem valores iguais.
TrainsConditionsDescription6=<blue>5) Valor</>\n\nUm número ou um segundo sinal para comparar com o primeiro.
TrainsConditionsDescription7=<blue>6) Sinais da estação</>\n\nAtive os sinais desejados nas configurações da estação. “Conteúdo armazenado” emite a quantidade de cada item e fluido nos vagões como um sinal separado.\n\nPor padrão, <blue>P</> mostra o tempo na estação em ticks, e <blue>I</> mostra quantos ticks se passaram desde a última mudança na carga. <blue>F</> mostra a quantidade total de itens de combustível nas locomotivas.\n\nQuando o trem está totalmente carregado, <blue>L</> vale 1; quando está vazio, <blue>E</> vale 1. Esses sinais consideram todos os vagões de carga e vagões-tanque do trem.
TrainsConditionsDescription8=<blue>7) Valores</>\n\nOs valores atuais dos sinais emitidos pela estação.
TrainsConditionsDescription9=Use <blue>L = 1</> para partir depois da carga completa e <blue>E = 1</> após a descarga. Para esperar o carregamento parar mesmo que o vagão esteja parcialmente cheio, use <blue>I >= 100</>: o trem parte após cinco segundos sem mudanças na carga.\n\nO tempo é medido em ticks, com 20 ticks por segundo. Por isso, a condição <blue>P >= 600</> mantém o trem na estação por 30 segundos.
TrainsSignals=Sinais ferroviários
TrainsSignalsDescription1=Os sinais dividem os trilhos em blocos. Antes de entrar em um bloco, o trem o reserva, e os demais aguardam até ele ficar livre. Enquanto você segura um sinal, os blocos ficam destacados em cores diferentes.
TrainsSignalsDescription2=Com um sinal na mão, mire nos trilhos. A prévia aparece no nó mais próximo, à direita no sentido da viagem. Pressione <blue>{key:ActionRotate}</> para inverter a direção e <blue>{key:ActionPrimary}</> para colocar o sinal.\n\nPara removê-lo, clique nele novamente com um sinal na mão ou use {item:Multitool}.
TrainsSignalsDescription3={item:RailSignal} permite entrar em um bloco livre. {item:RailChainSignal} verifica a rota do trem até o próximo sinal comum, incluindo o bloco depois dele.\n\nColoque um sinal em cadeia antes de uma bifurcação e um sinal comum depois. Assim, o trem espera a saída ficar livre antes de entrar na bifurcação. O bloco após o sinal de saída precisa comportar o trem inteiro.
TrainsSignalsDescription4=Um sinal define a direção permitida pelo seu nó. Em uma via de mão dupla, coloque um par de sinais voltados para direções opostas no mesmo nó.
TrainsSignalsDescription5=A <red>luz vermelha</> bloqueia a passagem, e a <green>verde</> permite a entrada. A <yellow>amarela</> acende quando o bloco está reservado por um trem que passará por esse sinal.\n\nEm um sinal em cadeia, verde significa que pelo menos uma saída está livre. O trem avança quando a saída da sua própria rota está livre.
TrainsSignalsDescription6=<blue>1) Janela do nó ferroviário</>\n\nMire em um nó ferroviário e pressione <blue>{key:ActionSecondary}</> para abrir sua janela. Cada sinal tem uma fileira de três indicadores que reproduzem suas luzes. O interruptor fecha todos os sinais do nó; ligá-lo novamente restaura o funcionamento normal.
TrainsSignalsDescription7=<blue>2) Configurações do bloco</>\n\nO botão de engrenagem abre as configurações dos sinais lógicos. O nó emite <blue>R</>, <blue>Y</> e <blue>G</>, mostrando quantos sinais têm luz vermelha, amarela e verde, respectivamente.\n\nPara controlar os sinais por um fio, ative a entrada “Funcionamento” (<blue>W</>). Um valor maior que 0 permite a passagem, mas os sinais continuam verificando se os trilhos estão ocupados.
TrainsWaiting=Estados do trem
TrainsWaitingDescription1=O estado do trem aparece na lista de trens, na parada atual e ao mirar em um veículo. Se houver um atraso durante a viagem, o trem verifica periodicamente outras rotas até o destino.
TrainsWaitingDescription2=<blue>1) Mostrar rota</>\n\nUma linha verde com setas mostra a rota planejada. Se nenhuma rota for encontrada, linhas vermelhas mostram os trilhos explorados durante a busca. Uma marca vermelha indica onde a busca não conseguiu continuar.
TrainsWaitingDescription3=<blue>2) Estado</>\n\nMostra o que o trem está fazendo ou o que o impede de seguir.
TrainsWaitingDescription4=<blue>Condição de partida</> significa que o trem aguarda a carga, a descarga ou outra condição da programação. Se aparecer <blue>Sem próxima parada</>, confira a programação: ela terminou ou cita uma estação que não existe mais.\n\nCom <blue>Sem rota</>, verifique as conexões dos trilhos, o sentido das estações e sinais e a orientação das locomotivas. <blue>Plataformas ocupadas</> significa que as estações com o nome necessário já estão reservadas por outros trens.\n\n<blue>Sinal vermelho</> e <blue>Trem à frente</> explicam uma parada durante a viagem: um sinal fechou a passagem ou outro trem está bloqueando o caminho.\n\nSe aparecer <blue>Parado</>, ligue o trem na janela de um veículo. <blue>Sem locomotiva</> indica que é necessária uma locomotiva voltada para o sentido da viagem. <blue>Sem combustível</> indica que as locomotivas que puxam o trem precisam de combustível.
