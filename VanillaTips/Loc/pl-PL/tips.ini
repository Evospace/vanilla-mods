[tips]
StackTransfers=Stack transfers
StackTransfersDescription=<blue>Shift + Left-click</>: Transfer 1 stack\n<blue>Shift + Right-click</>: Transfer items from this slot, up to half a full stack\n\n<blue>Control + Left-click</>: Transfer all items of this type\n<blue>Control + Right-click</>: Transfer half the items of this type\n\n<blue>Control + Left-click on an empty slot</>: Transfer the entire inventory\n<blue>Control + Right-click on an empty slot</>: Transfer half the items of each type in the inventory\n\n<blue>Alt + Left-click</>: Transfer 5 items\n<blue>Alt + Right-click</>: Transfer 1 item
ChestLimiting=Chest limiting
ChestLimitingDescription=
Screwdriver=Śrubokręt
ScrewdriverDescription=While holding a <blue>Screwdriver</>, hold the <blue>Left Mouse Button</>, drag in the direction of one of the arrows, then release the button to rotate the block. Currently, this method only works on blocks that occupy 1 cell.\n\nThe rotation depends on which face of the block you point at.\nWhen you release the button, the block rotates so that this face takes the place of the face indicated by the selected arrow.
RotationWhileBuilding=Rotation while building
RotationWhileBuildingDescription=Press <blue>R</> to rotate the block around the vertical axis.\nHold <blue>Shift</> or <blue>Alt</> to change the rotation axis.\nA green indicator shows the current rotation axis.\n\nWhile holding a block for building, hold the <blue>Right Mouse Button</>, drag in the direction of one of the arrows, then release the button to rotate the block. This method works on blocks of any size.
BlockPipette=Block pipette
BlockPipetteDescription=Press <blue>Q</> to select the block you are aiming at for building, keeping its orientation. Press <blue>Q</> again to clear the selection.\nThis always works in Creative mode. In Normal mode, you need to have the same item in your inventory.\n\nPress <blue>Ctrl+C</> to copy settings from the block you are aiming at.\nPress <blue>Ctrl+V</> to paste settings from the clipboard into the block you are aiming at.\n\nNot all blocks support copying and pasting settings. Copied block settings are stored in the clipboard as text.
FirstSteps=Pierwsze kroki
FirstStepsDescription=Finding Copper Ore and Smelting Copper (Malachite, Chalcopyrite)\n\n1. First, locate copper ore: Malachite or Chalcopyrite. Areas where ore is visible on the ground usually have more deposits nearby or just below the surface.\n2. Gather the copper ore.\n3. Use basic blocks from your inventory to create a platform for convenience.\n4. Craft a furnace and a smelter. Place the smelter above the furnace.\n5. Put fuel in the furnace and place the copper ore in the smelter.\n6. Once smelting is complete, collect the copper plates.\n\nBuilding Essential Machinery\n\n1. Create another furnace, a Stirling engine, a compact generator, and a computer.\n2. Arrange these components according to their inputs and outputs.\n3. Once the computer is operational, you can start researching new technologies.
Interface=Interface
Map=Mapa
InterfaceDescription1=<blue>1) Hotbar</>\n\nAt the beginning, the currently held item is displayed along with its name above it.\nAfter it, quick access slots are shown. These can be selected by mouse click or the corresponding number key.\nEach hotbar slot is assigned an item type. Items are taken directly from your inventory.\n
InterfaceDescription2=<blue>2) Player Inventory</>\n\nThe main section consists of a grid of item slots.\nLeft-click an item to pick it up. Click on a slot again to place the item there. Click on another item to swap them.\n\nAt the bottom, there are dedicated slots for the jetpack, lighting, inventory sorting, and dropping items on the ground.\nBelow that are the tools: a multitool for digging and a screwdriver for rotating blocks.\n
InterfaceDescription3=<blue>3) Miscellaneous</>\n\nThe top row contains time control buttons for the in-game time. Currently, these only affect visuals. At the end of the row is a button that stops the day-night cycle.\n\nThe second row includes a button showing research progress, followed by the tutorial button that opens this guide.\nNext is the creative mode toggle (invisible in non-creative games), then a flight mode toggle, and finally a button to highlight block inputs and outputs.\n
InterfaceDescription4=<blue>4) Player Crafting Window</>\n\nThis row contains the tab selection for the section below.\nFirst is the list of all unlocked items. Next is the Favorites tab. To add or remove an item from Favorites, right-click the item in the list below and select Toggle Favourite from the dropdown menu.\nThen comes the tab for all items available in the game. Finally, there is the Search Results tab and a text field for item search.\n
InterfaceDescription5=<blue>5) Selected Tab Contents</>\n\nDisplays the items from the selected tab, grouped into categories.\nThe number in each cell shows how many of that item can currently be crafted.\n\nLeft-click an item to queue one if you have enough materials. Shift + left click queues as many as your materials allow, up to one stack.\n\nRight-clicking opens a context menu where you can queue multiple items, open the recipe window (Show Recipes), add all components of the item to the search (Context Search), or mark the item as a favorite (Toggle Favourite).\n
InterfaceDescription6=<blue>6) Selected Block Window</>\n\nRight-clicking a block while aiming at it opens the block's interface.\nAt the top, you'll find the power toggle and settings buttons, followed by the block’s name and tier.\nBelow that is the input inventory, along with a status indicator and a current recipe indicator (hover over it for details).\nNext comes the progress bar for the active recipe. Some machines also have a second bar that shows productivity.\nWhen the main progress bar is full, crafting is complete. When the productivity bar is full, a bonus item is produced.\nBelow that is the output inventory.\nAt the very bottom, other block statuses are displayed.\n
InterfaceDescription7=<blue>7) Block Minipanel (Under Crosshair)</>\n\nDisplays the name, icon, and brief information about the block the player is currently looking at.\n
MapDescription=Press <blue>M</> to open the map. The map shows explored regions, your position, and any markers.
Research=Badanie
ResearchDescription=Research unlocks new recipes and blocks. Computers produce the points needed to complete research.
ResearchDescription1=<blue>1) Research Queue</>\n\nComputers work on the first research project in the queue. When it is complete, the next one starts. Hover over a queued research project and click the red cross to remove it. Any queued projects that depend on it are also removed.\n
ResearchDescription2=<blue>2) Start Research</>\n\nAdds the selected research project to the end of the queue. You can queue a research project once all its prerequisites are complete or already queued. This lets you queue several projects in sequence without waiting for each one to finish.\n
ResearchDescription3=<blue>3) Research Tree</>\n\nThe selected research with the ones it requires above it and the ones it opens below it.\n
ResearchComputersDescription1=Research points are produced by computers only. A powered computer contributes research points once per second to the first project in the queue. Without electricity it produces no research points.
ResearchComputersDescription2=The research rate depends on the computer tier: {item:CopperComputer} — 1 point per second, {item:SteelComputer} — 2. Each higher tier produces twice as many points per second. All working computers contribute to the same research project, and their rates add up.
ResearchComputersDescription3=Every computer has a slot for 3 circuits of its own tier: {item:Circuit} for {item:CopperComputer}, {item:AdvancedCircuit} for {item:SteelComputer}. Each circuit provides 30 seconds of boosted research. The next circuit is consumed when the current boost runs out.
ResearchComputersDescription4=Research rate with circuits: {item:CopperComputer} — 10 points per second, {item:SteelComputer} — 100. Each higher tier produces 10 times as many points per second.
ResearchComputersDescription5=Use a {item:CopperRobotArm} to feed circuits from the constructor into the computer and maintain its research boost. The constructor makes 1 {item:Circuit} in 7.5 seconds; the computer consumes 1 circuit per 30 seconds of boosted research.
Productivity=Produktywność
ProductivityDescription1=The second progress bar next to the recipe progress bar shows productivity. It fills while the machine works. When the productivity bar fills, the machine produces the recipe's bonus output without consuming additional ingredients.
ProductivityDescription2=Productivity works on ore recipes of {machine:AutomaticHammer}, {machine:Macerator}, {machine:OreWasher}. Ore processed in them gives more plates than ore smelted directly.
BuildingModes=Building modes
BuildingModesDescription1=Machines and most blocks are built in a line. Hold the <blue>Left Mouse Button</> and move the crosshair away from the starting cell. Release the button to build the entire line.
BuildingModesDescription2=Platforms and other simple blocks fill a plane: hold <blue>Left Mouse Button</> and drag, the plane is picked by the direction you move first.
BuildingModesDescription3=Conveyors, pipes and cables are built as a run in two clicks: the first click anchors the start, the second builds the run, <blue>Right Mouse Button</> cancels it. Hold <blue>Shift</> to route the run around obstacles.\n\nUse the <blue>Mouse Wheel</> to raise or lower the placement height.
ItemDatabase=Item database
ItemDatabaseDescription1=The item database is on the right side of the inventory (<blue>{key:ToggleInventory}</>).
ItemDatabaseDescription2=<blue>1) Tabs</>\n\nUnlocked items, favorites, all items in the game and search results. The star tab shows favorite items, both here and in the item picker for block settings.\n
ItemDatabaseDescription3=<blue>2) Search</>\n\nEnter an item name in the search field. Matching items appear in the search results tab. Clear the field to return to the previous tab. <blue>Enter</> saves the query to the history next to the field.\n
ItemDatabaseDescription4=<blue>3) Items</>\n\nThe number on an icon shows how many items you can craft with the materials in your inventory. Right-click opens the item menu: order the item, view its recipes or research, add it to favorites or remove it from them.\n
Recipes=Recipes
RecipesDescription1=Hover over an item and press <blue>{key:Recipe}</> to open its recipes. Press the same key while aiming at a block to view that block's recipes. You can also click an item link in the text.
RecipesDescription2=Made in lists recipes that produce the item, Used in lists recipes that use it, and Can craft lists the selected machine's recipes. An ingredient's menu lets you open its recipes. Press <blue>{key:NeiLeft}</> and <blue>{key:NeiRight}</> to move back and forward through your viewing history.
CraftQueue=Craft queue
CraftQueueDescription1=Left-click an item in the database to queue one. <blue>Shift</> + left click queues as many as your materials allow, up to one stack. Use the right-click menu to order 5, 25 or 100 items.
CraftQueueDescription2=Materials are taken from your inventory when you place an order. Missing parts are crafted as part of the same order. Canceling the order returns the materials. Crafting pauses if there is no room in your inventory for the result.
Energy=Energy
EnergyDescription1=The {item:StoneFurnace} burns fuel to produce <red>heat</>. The {item:CopperStirlingEngine} turns heat into <yellow>kinetic energy</>. The {item:CopperCompactGenerator} turns kinetic energy into <blue>electricity</>. The {item:CopperComputer} consumes electricity.
EnergyDescription2=This setup converts heat into kinetic energy and then electricity, supplying up to 1 kW of electrical power. The computer consumes 400 W.
DockingDescription1=Hold the new machine and aim at one you have already built. The new machine docks to a matching port. <blue>{key:ActionRotate}</> switches between docking positions.
DockingDescription2=Port colors: <red>Heat</>, <yellow>Kinetic</>, <blue>Electricity</>. <blue>{key:ToggleSideIcons}</> shows the ports of every block.
DockingDescription3=Energy passes between machines whose ports touch. Research unlocks cables and heat pipes.
NoPower=No power
NoPowerDescription1=Aim at a machine to see its state. Check the machines one by one, from the computer back to the furnace.
NoPowerDescription2=<red>Requires</> — the machine needs more energy. Check its connection to the previous machine and whether that machine is running.\n\n<blue>Nothing takes</> — output energy is not being used fast enough. This can happen with a bad connection, or when the next machine is switched off or needs less energy.\n\n<blue>Idle</> on the furnace — no fuel.
NoPowerDescription3=A powered {item:CopperComputer} shows <blue>Idle</> if no research is selected. Open the tree with <blue>{key:Journal}</> and start a research project.
Constructor=Constructor
ConstructorDescription1=The {item:CopperConstructor} automatically crafts items using hand-crafting recipes. It runs on electricity and consumes 800 W.
ConstructorDescription2=<blue>1) Recipe Button</>\n\nOpens the list of recipes. It also clears the current recipe and returns its items to the inventory.\n
ConstructorDescription3=<blue>2) Input Slots</>\n\nEach slot accepts an ingredient required by the selected recipe. Add ingredients by hand or with a {item:CopperRobotArm}.\n
ConstructorDescription4=<blue>3) Output Slot</>\n\nThe result of the recipe. A {item:CopperRobotArm} takes it out.\n
ConstructorDescription5=<blue>4) Recipe List</>\n\nHand-crafting recipes unlocked by research. Click a recipe to select it.\n
ConstructorDescription6=Craft time: {item:CopperWire} — 4 s, {item:Triod} — 2.5 s, {item:CircuitBoard} — 1 s, {item:Circuit} — 7.5 s. Each circuit requires 1 circuit board and 3 triodes. Making those triodes takes 9 copper wires in total. With 1 constructor for each component, wire production limits the output of the entire line.
ConstructorDescription7=A {item:CopperComputer} consumes 1 circuit per 30 seconds of boosted research. 2 wire constructors and 1 constructor for each remaining component produce enough circuits to keep 1 computer continuously boosted.
Trains=Pociągi
TrainsDescription1=Ukończ badanie {research:Railway}, aby odblokować receptury: {item:SteelRail}, {item:RailStation}, {item:Locomotive}, {item:CargoWagon} i {item:TankWagon}. Sygnalizatory {item:RailSignal} i {item:RailChainSignal} staną się dostępne po badaniu {research:RailSignals}.
TrainsDescription2=<blue>Pierwsza linia</>\n\nZacznij od dwóch stacji połączonych pętlą torów. Na każdej zbuduj dwa perony, ustawione bezpośrednio jeden za drugim i zwrócone w tę samą stronę. Ustaw stacje tak, aby pociąg wjeżdżał od strony bez lamp i jechał w stronę lamp.\n\nNa pierwszej stacji umieść {item:Locomotive}, a za nią {item:CargoWagon}. Obok peronu wagonu na każdej stacji postaw ładowarkę lub ramię robota: na pierwszej do załadunku, na drugiej do rozładunku.\n\nDodaj drugą stację do harmonogramu i włącz „Powtórz harmonogram”. Ustaw warunek odjazdu <blue>L = 1</> na stacji załadunku i <blue>E = 1</> na stacji rozładunku. Pociąg będzie czekał na pełny załadunek lub rozładunek przed odjazdem. Sposób konfiguracji opisano w części „Warunki odjazdu”.\n\nWłóż paliwo do lokomotywy, aby uruchomić pociąg.
TrainsDescription3=Naciśnij <blue>{key:Trains}</>, aby otworzyć listę pociągów i stacji.
TrainsRails=Tory
TrainsRailsDescription1=Weź do ręki {item:SteelRail} i naciśnij <blue>{key:ActionPrimary}</> w wybranym miejscu, aby postawić węzeł toru. Każdy kolejny węzeł łączy się z poprzednim. Gdy zaczynasz nowy ciąg, gra próbuje połączyć pierwszy węzeł z najbliższym w promieniu 24 pól.\n\nPrzed postawieniem węzła sprawdź podgląd: zielony oznacza, że połączenie można zbudować, a czerwony, że nie pasuje. <blue>Kółkiem myszy</> zmienisz wysokość budowy.
TrainsRailsDescription2=Naciśnij <blue>{key:ActionSecondary}</>, aby zakończyć ciąg. Aby przedłużyć tor od istniejącego węzła, wyceluj w niego i naciśnij <blue>{key:ActionPrimary}</>. Następnie kliknij inny węzeł, aby je połączyć. Kliknięcie już połączonego węzła usuwa ten odcinek toru.
TrainsRailsDescription3=Węzły można łączyć na odległość od 1 do 32 pól w poziomie. Zakręty wymagają promienia co najmniej 3 pól, a pojedynczy odcinek może skręcić o maksymalnie 120°. Maksymalne nachylenie wynosi 25%. Jeśli połączenia nie da się zbudować, komunikat wyjaśni przyczynę.
TrainsRailsDescription4=Aby zbudować rozjazd, połącz kilka torów z tą samą stroną węzła. Pociągi wybierają odgałęzienie zgodnie ze swoją trasą.
TrainsRailsDescription5=Sąsiednie węzły na jednej prostej łączą się automatycznie. Każdy nowy węzeł zużywa jeden przedmiot {item:SteelRail}. Usunięcie węzła usuwa również podłączone do niego odcinki torów. Plany zachowują węzły wraz z połączeniami.
TrainsRailsDescription6=Pociągi zwalniają na ciasnych zakrętach. Na podjazdach prędkość zależy od masy składu i siły pociągowej lokomotyw.
TrainsStations=Stacje
TrainsStationsDescription1=Każdy blok {item:RailStation} dodaje peron dla jednej lokomotywy lub wagonu. Aby zatrzymać się na stacji, pociąg musi wjechać od strony bez lamp i jechać w stronę lamp na drugim końcu.
TrainsStationsDescription2=Ustaw perony bezpośrednio jeden za drugim, zwrócone w tę samą stronę, aby połączyły się w jedną stację. Zbuduj po jednym peronie na każdą lokomotywę i wagon, aby obsłużyć cały skład.
TrainsStationsDescription3=<yellow>Żółta lampa</> świeci, gdy pociąg jedzie do stacji. <red>Czerwona lampa</> świeci podczas postoju, a <green>zielona</> podczas odjazdu. Migająca czerwona lampa oznacza opóźnienie odjazdu, na przykład z powodu braku paliwa.
TrainsStationsDescription4=Wyceluj w peron i naciśnij <blue>{key:ActionSecondary}</>, aby otworzyć okno stacji.
TrainsStationsDescription5=<blue>1) Nazwa stacji</>\n\nHarmonogram wskazuje stacje według nazw. Jeśli kilka stacji ma tę samą nazwę, pociąg wybiera jedną z nich na podstawie długości trasy oraz zajętości torów i peronów.
TrainsStationsDescription6=<blue>2) Pojazd przy peronie</>\n\nOkno peronu pokazuje zawartość stojącego przy nim pojazdu. Ładowarki i ramiona robotów przenoszą przedmioty przez peron, a pompy napełniają i opróżniają cysterny. W przypadku lokomotywy widać tu paliwo, które również można dostarczać przez peron.
TrainsStationsDescription7=<blue>3) Ustawienia bloku</>\n\nPrzycisk z kołem zębatym otwiera ustawienia sygnałów wysyłanych przez stację. Więcej informacji znajdziesz w części „Warunki odjazdu”.
TrainsStationsDescription8=<blue>4) Stacje</>\n\nLista stacji i ich współrzędnych. Jeśli na stacji stoi pociąg, obok pojawia się jego numer.
TrainsStationsDescription9=<blue>5) Szczegóły stacji</>\n\nTutaj możesz zmienić nazwę stacji oraz sprawdzić jej współrzędne i liczbę peronów. Niżej podano liczbę pociągów, których harmonogramy zawierają tę nazwę stacji.
TrainsStationsDescription10=<blue>6) Otwórz pociąg</>\n\nOtwiera harmonogram pociągu stojącego na stacji.
TrainsConsist=Lokomotywy i wagony
TrainsConsistDescription1=Weź lokomotywę lub wagon do ręki, wyceluj w tor albo stację i naciśnij <blue>{key:ActionPrimary}</>. Przed postawieniem sprawdź kierunek pojazdu. Naciśnij <blue>{key:ActionRotate}</>, aby go odwrócić. Aby dołączyć wagon do pociągu, postaw go za składem stojącym na stacji.
TrainsConsistDescription2=Pociąg może jechać w danym kierunku, jeśli przynajmniej jedna lokomotywa jest zwrócona w tę stronę. Przy jednej lokomotywie potrzebuje pętli do powrotu. Do jazdy między ślepymi końcami toru użyj dwóch lokomotyw zwróconych w przeciwne strony.
TrainsConsistDescription3=Lokomotywa ma dwa miejsca na takie samo paliwo jak piec. Każda zatankowana lokomotywa zwrócona w kierunku jazdy zwiększa siłę pociągową. Wraz z zapełnianiem wagonów rośnie masa składu.
TrainsConsistDescription4={item:CargoWagon} mieści 10 stosów przedmiotów. {item:TankWagon} przewozi jeden rodzaj płynu naraz.
TrainsConsistDescription5=Wyceluj w pojazd i naciśnij <blue>{key:ActionSecondary}</>, aby otworzyć jego okno. Do demontażu pociągu na stacji użyj narzędzia {item:Multitool}: wybrany pojazd wróci do ekwipunku.
TrainsConsistDescription6=<blue>1) Przełącznik</>\n\nWyłączony pociąg hamuje i pozostaje w miejscu. Włącz go ponownie, aby kontynuował jazdę według harmonogramu.
TrainsConsistDescription7=<blue>2) Stan</>\n\nPod nazwą lub numerem pociągu znajdują się numer pojazdu i stan składu. Widać tu również stację, na której stoi, albo tę, do której jedzie.
TrainsConsistDescription8=<blue>3) Zawartość</>\n\nPaliwo lokomotywy lub ładunek wagonu.
TrainsConsistDescription9=<blue>4) Harmonogram</>\n\nOtwiera harmonogram tego pociągu w oknie pociągów.
TrainsConsistDescription10=<blue>5) Informacje po wskazaniu</>\n\nWyceluj w pojazd, aby zobaczyć jego zawartość i stan pociągu.
TrainsSchedule=Harmonogram
TrainsScheduleDescription1=Otwórz okno pociągów klawiszem <blue>{key:Trains}</> lub przyciskiem „Harmonogram” w oknie pojazdu. Stacja, na której postawisz nowy pociąg, jest już wpisana do jego harmonogramu. Dodaj kolejny przystanek, aby wyznaczyć trasę.
TrainsScheduleDescription2=<blue>1) Pociągi</>\n\nWybierz pociąg z listy, aby otworzyć jego harmonogram. Możesz szukać po nazwie, numerze (na przykład #12) lub nazwie stacji na trasie.
TrainsScheduleDescription3=<blue>2) Nazwa pociągu</>\n\nTutaj możesz nadać pociągowi nazwę. Gdy pole jest puste, na liście widnieje jego numer.
TrainsScheduleDescription4=<blue>3) Powtórz harmonogram</>\n\nPrzy włączonym powtarzaniu pociąg po ostatnim przystanku wraca do pierwszego. Wyłącz tę opcję, aby zakończył trasę na ostatniej stacji.
TrainsScheduleDescription5=<blue>4) Odjedź teraz</>\n\n„Odjedź teraz” pomija warunek odjazdu na bieżącym przystanku. Przycisk jest dostępny, gdy pociąg stoi na swojej stacji i ma kolejny przystanek w harmonogramie.
TrainsScheduleDescription6=<blue>5) Pokaż trasę</>\n\n„Pokaż trasę” otwiera schemat trasy do następnej stacji.
TrainsScheduleDescription7=<blue>6) Wybierz przystanek</>\n\nKliknij strzałkę przy przystanku, aby wysłać tam pociąg. Cel można zmienić również podczas jazdy. Bieżący przystanek jest wyróżniony, a pod nim widoczny jest stan pociągu.
TrainsScheduleDescription8=<blue>7) Stacja</>\n\nWybierz z listy stację, do której ma pojechać pociąg.
TrainsScheduleDescription9=<blue>8) Kolejność przystanków</>\n\nStrzałki przesuwają przystanek w górę lub w dół, a krzyżyk go usuwa. Przycisk <blue>+ Dodaj przystanek</> znajduje się pod listą.
TrainsScheduleDescription10=<blue>9) Warunek odjazdu</>\n\nOkreśla, kiedy pociąg może opuścić ten przystanek. Więcej informacji znajdziesz w części „Warunki odjazdu”.
TrainsScheduleDescription11=Panel „Skład” po prawej pokazuje lokomotywy, wagony i ich zawartość.
TrainsConditions=Warunki odjazdu
TrainsConditionsDescription1=Każdy przystanek może mieć warunek odjazdu, na przykład pełny załadunek lub określony czas postoju. Warunki mogą korzystać z sygnałów samej stacji oraz sygnałów odbieranych przez przewody podłączone do jej peronów.
TrainsConditionsDescription2=<blue>1) Tryb</>\n\nWybierz <blue>Expr</>, aby porównać sygnał z liczbą lub innym sygnałem. Aby połączyć kilka warunków, wybierz <blue>And</>, <blue>Or</> lub <blue>Xor</> i dodaj warunki przyciskiem +.\n\nAnd wymaga spełnienia wszystkich warunków, Or przynajmniej jednego, a Xor nieparzystej liczby warunków. <blue>Always</> pozwala odjechać zaraz po przyjeździe.
TrainsConditionsDescription3=<blue>2) Wskaźnik</>\n\nWskaźnik świeci na zielono, gdy warunek jest spełniony, a w przeciwnym razie na czerwono.
TrainsConditionsDescription4=<blue>3) Sygnał</>\n\nKliknij, aby wybrać sygnał do porównania. Możesz również wybrać przedmiot, aby porównać jego ilość.
TrainsConditionsDescription5=<blue>4) Porównanie</>\n\nWybierz, czy wartości mają być równe (=), różne (!=), czy pierwsza ma być większa (>) lub mniejsza (<) od drugiej. Znaki >= i <= dopuszczają także równość.
TrainsConditionsDescription6=<blue>5) Wartość</>\n\nLiczba lub drugi sygnał, z którym porównywany jest pierwszy.
TrainsConditionsDescription7=<blue>6) Sygnały stacji</>\n\nW ustawieniach stacji włącz potrzebne sygnały. „Zawartość” wysyła ilość każdego przedmiotu i płynu w wagonach jako osobny sygnał.\n\nDomyślnie <blue>P</> pokazuje czas postoju w taktach, a <blue>I</> liczbę taktów od ostatniej zmiany ładunku. <blue>F</> pokazuje łączną liczbę przedmiotów paliwa w lokomotywach.\n\nPrzy pełnym załadunku <blue>L</> ma wartość 1, a gdy skład jest pusty, <blue>E</> ma wartość 1. Sygnały uwzględniają wszystkie wagony towarowe i cysterny w składzie.
TrainsConditionsDescription8=<blue>7) Wartości</>\n\nBieżące wartości sygnałów wysyłanych przez stację.
TrainsConditionsDescription9=Ustaw <blue>L = 1</>, aby odjechać po pełnym załadunku, lub <blue>E = 1</> po rozładunku. Aby poczekać, aż załadunek ustanie, nawet gdy wagon jest częściowo pusty, użyj <blue>I >= 100</>: pociąg odjedzie po pięciu sekundach bez zmiany ładunku.\n\nCzas jest mierzony w taktach; na sekundę przypada ich 20. Warunek <blue>P >= 600</> oznacza więc 30 sekund postoju na stacji.
TrainsSignals=Sygnalizatory
TrainsSignalsDescription1=Sygnalizatory dzielą tory na bloki. Przed wjazdem pociąg rezerwuje blok, a inne czekają, aż się zwolni. Gdy trzymasz sygnalizator w ręce, bloki są wyróżnione różnymi kolorami.
TrainsSignalsDescription2=Weź sygnalizator do ręki i wyceluj w tor. Podgląd pojawi się przy najbliższym węźle, po prawej stronie względem kierunku jazdy. Naciśnij <blue>{key:ActionRotate}</>, aby odwrócić kierunek, i <blue>{key:ActionPrimary}</>, aby go postawić.\n\nAby go usunąć, kliknij ponownie, trzymając sygnalizator w ręce, lub użyj narzędzia {item:Multitool}.
TrainsSignalsDescription3={item:RailSignal} pozwala wjechać do wolnego bloku. {item:RailChainSignal} sprawdza trasę pociągu aż do następnego zwykłego sygnalizatora, łącznie z blokiem za nim.\n\nPrzed rozjazdem postaw sygnalizator łańcuchowy, a za nim zwykły. Pociąg zaczeka wtedy przed rozjazdem na wolny wyjazd. Blok za sygnalizatorem wyjazdowym musi pomieścić cały skład.
TrainsSignalsDescription4=Sygnalizator wyznacza dozwolony kierunek przejazdu przez węzeł. Na torze dwukierunkowym postaw przy tym samym węźle dwa sygnalizatory skierowane w przeciwne strony.
TrainsSignalsDescription5=<red>Czerwone światło</> zamyka przejazd, a <green>zielone</> go otwiera. <yellow>Żółte</> zapala się, gdy blok jest zarezerwowany przez pociąg, który przejedzie obok tego sygnalizatora.\n\nZielone światło sygnalizatora łańcuchowego oznacza, że przynajmniej jeden wyjazd jest wolny. Pociąg ruszy, gdy wolny będzie wyjazd na jego trasie.
TrainsSignalsDescription6=<blue>1) Okno węzła toru</>\n\nWyceluj w węzeł toru i naciśnij <blue>{key:ActionSecondary}</>, aby otworzyć jego okno. Każdy sygnalizator ma rząd trzech lampek odpowiadających jego światłom. Przełącznik zamyka wszystkie sygnalizatory węzła; ponowne włączenie przywraca normalną pracę.
TrainsSignalsDescription7=<blue>2) Ustawienia bloku</>\n\nPrzycisk z kołem zębatym otwiera ustawienia sygnałów logicznych. Węzeł wysyła <blue>R</>, <blue>Y</> i <blue>G</>, wskazujące odpowiednio liczbę sygnalizatorów ze światłem czerwonym, żółtym i zielonym.\n\nAby sterować nimi przez przewód, włącz wejście „Praca” (<blue>W</>). Wartość większa od 0 zezwala na przejazd, ale sygnalizatory nadal sprawdzają zajętość torów.
TrainsWaiting=Stany pociągu
TrainsWaitingDescription1=Stan pociągu widać na liście pociągów, przy bieżącym przystanku i po wycelowaniu w pojazd. Gdy pociąg czeka podczas jazdy, co pewien czas szuka innych tras do celu.
TrainsWaitingDescription2=<blue>1) Pokaż trasę</>\n\nZielona linia ze strzałkami pokazuje wyznaczoną trasę. Jeśli trasy nie znaleziono, czerwone linie pokazują tory sprawdzone podczas wyszukiwania. Czerwony znacznik wskazuje miejsce, w którym wyszukiwanie nie mogło ruszyć dalej.
TrainsWaitingDescription3=<blue>2) Stan</>\n\nPokazuje, co robi pociąg lub co przeszkadza mu w dalszej jeździe.
TrainsWaitingDescription4=<blue>Warunek odjazdu</> oznacza, że pociąg czeka na załadunek, rozładunek lub inny warunek z harmonogramu. Przy <blue>Brak następnego przystanku</> sprawdź harmonogram: dobiegł końca albo zawiera nazwę nieistniejącej już stacji.\n\nPrzy <blue>Brak trasy</> sprawdź połączenia torów, kierunki stacji i sygnalizatorów oraz ustawienie lokomotyw. <blue>Perony zajęte</> oznacza, że stacje o wymaganej nazwie są już zarezerwowane przez inne pociągi.\n\n<blue>Czerwony sygnał</> i <blue>Pociąg z przodu</> wyjaśniają postój na trasie: przejazd zamyka sygnalizator albo blokuje go inny pociąg.\n\nJeśli widzisz <blue>Zatrzymany</>, włącz pociąg w oknie pojazdu. <blue>Brak lokomotywy</> oznacza, że potrzebna jest lokomotywa zwrócona w kierunku jazdy. <blue>Brak paliwa</> wskazuje, że trzeba zatankować lokomotywy ciągnące skład.
