[tips]
StackTransfers=Stack transfers
StackTransfersDescription=<blue>Shift + Left-click</>: Transfer 1 stack\n<blue>Shift + Right-click</>: Transfer items from this slot, up to half a full stack\n\n<blue>Control + Left-click</>: Transfer all items of this type\n<blue>Control + Right-click</>: Transfer half the items of this type\n\n<blue>Control + Left-click on an empty slot</>: Transfer the entire inventory\n<blue>Control + Right-click on an empty slot</>: Transfer half the items of each type in the inventory\n\n<blue>Alt + Left-click</>: Transfer 5 items\n<blue>Alt + Right-click</>: Transfer 1 item
ChestLimiting=Chest limiting
ChestLimitingDescription=
Screwdriver=Screwdriver
ScrewdriverDescription=While holding a <blue>Screwdriver</>, hold the <blue>Left Mouse Button</>, drag in the direction of one of the arrows, then release the button to rotate the block. Currently, this method only works on blocks that occupy 1 cell.\n\nThe rotation depends on which face of the block you point at.\nWhen you release the button, the block rotates so that this face takes the place of the face indicated by the selected arrow.
RotationWhileBuilding=Rotation while building
RotationWhileBuildingDescription=Press <blue>R</> to rotate the block around the vertical axis.\nHold <blue>Shift</> or <blue>Alt</> to change the rotation axis.\nA green indicator shows the current rotation axis.\n\nWhile holding a block for building, hold the <blue>Right Mouse Button</>, drag in the direction of one of the arrows, then release the button to rotate the block. This method works on blocks of any size.
BlockPipette=Block pipette
BlockPipetteDescription=Press <blue>Q</> to select the block you are aiming at for building, keeping its orientation. Press <blue>Q</> again to clear the selection.\nThis always works in Creative mode. In Normal mode, you need to have the same item in your inventory.\n\nPress <blue>Ctrl+C</> to copy settings from the block you are aiming at.\nPress <blue>Ctrl+V</> to paste settings from the clipboard into the block you are aiming at.\n\nNot all blocks support copying and pasting settings. Copied block settings are stored in the clipboard as text.
FirstSteps=First steps
FirstStepsDescription=Finding Copper Ore and Smelting Copper (Malachite, Chalcopyrite)\n\n1. First, locate copper ore: Malachite or Chalcopyrite. Areas where ore is visible on the ground usually have more deposits nearby or just below the surface.\n2. Gather the copper ore.\n3. Use basic blocks from your inventory to create a platform for convenience.\n4. Craft a furnace and a smelter. Place the smelter above the furnace.\n5. Put fuel in the furnace and place the copper ore in the smelter.\n6. Once smelting is complete, collect the copper plates.\n\nBuilding Essential Machinery\n\n1. Create another furnace, a Stirling engine, a compact generator, and a computer.\n2. Arrange these components according to their inputs and outputs.\n3. Once the computer is operational, you can start researching new technologies.
Interface=Interface
Map=Map
InterfaceDescription1=<blue>1) Hotbar</>\n\nAt the beginning, the currently held item is displayed along with its name above it.\nAfter it, quick access slots are shown. These can be selected by mouse click or the corresponding number key.\nEach hotbar slot is assigned an item type. Items are taken directly from your inventory.\n
InterfaceDescription2=<blue>2) Player Inventory</>\n\nThe main section consists of a grid of item slots.\nLeft-click an item to pick it up. Click on a slot again to place the item there. Click on another item to swap them.\n\nAt the bottom, there are dedicated slots for the jetpack, lighting, inventory sorting, and dropping items on the ground.\nBelow that are the tools: a multitool for digging and a screwdriver for rotating blocks.\n
InterfaceDescription3=<blue>3) Miscellaneous</>\n\nThe top row contains time control buttons for the in-game time. Currently, these only affect visuals. At the end of the row is a button that stops the day-night cycle.\n\nThe second row includes a button showing research progress, followed by the tutorial button that opens this guide.\nNext is the creative mode toggle (invisible in non-creative games), then a flight mode toggle, and finally a button to highlight block inputs and outputs.\n
InterfaceDescription4=<blue>4) Player Crafting Window</>\n\nThis row contains the tab selection for the section below.\nFirst is the list of all unlocked items. Next is the Favorites tab. To add or remove an item from Favorites, right-click the item in the list below and select Toggle Favourite from the dropdown menu.\nThen comes the tab for all items available in the game. Finally, there is the Search Results tab and a text field for item search.\n
InterfaceDescription5=<blue>5) Selected Tab Contents</>\n\nDisplays the items from the selected tab, grouped into categories.\nThe number in each cell shows how many of that item can currently be crafted.\n\nLeft-click an item to queue one if you have enough materials. Shift + left click queues as many as your materials allow, up to one stack.\n\nRight-clicking opens a context menu where you can queue multiple items, open the recipe window (Show Recipes), add all components of the item to the search (Context Search), or mark the item as a favorite (Toggle Favourite).\n
InterfaceDescription6=<blue>6) Selected Block Window</>\n\nRight-clicking a block while aiming at it opens the block's interface.\nAt the top, you'll find the power toggle and settings buttons, followed by the block’s name and tier.\nBelow that is the input inventory, along with a status indicator and a current recipe indicator (hover over it for details).\nNext comes the progress bar for the active recipe. Some machines also have a second bar that shows productivity.\nWhen the main progress bar is full, crafting is complete. When the productivity bar is full, a bonus item is produced.\nBelow that is the output inventory.\nAt the very bottom, other block statuses are displayed.\n
InterfaceDescription7=<blue>7) Block Minipanel (Under Crosshair)</>\n\nDisplays the name, icon, and brief information about the block the player is currently looking at.\n
MapDescription=Press <blue>M</> to open the map. The map shows explored regions, your position, and any markers.
Research=Research
ResearchDescription=Research unlocks new recipes and blocks. Computers produce the points needed to complete research.
ResearchDescription1=<blue>1) Research Queue</>\n\nComputers work on the first research project in the queue. When it is complete, the next one starts. Hover over a queued research project and click the red cross to remove it. Any queued projects that depend on it are also removed.\n
ResearchDescription2=<blue>2) Start Research</>\n\nAdds the selected research project to the end of the queue. You can queue a research project once all its prerequisites are complete or already queued. This lets you queue several projects in sequence without waiting for each one to finish.\n
ResearchDescription3=<blue>3) Research Tree</>\n\nThe selected research with the ones it requires above it and the ones it opens below it.\n
ResearchComputersDescription1=Research points are produced by computers only. A powered computer contributes research points once per second to the first project in the queue. Without electricity it produces no research points.
ResearchComputersDescription2=The research rate depends on the computer tier: {item:CopperComputer} — 1 point per second, {item:SteelComputer} — 2. Each higher tier produces twice as many points per second. All working computers contribute to the same research project, and their rates add up.
ResearchComputersDescription3=Every computer has a slot for 3 circuits of its own tier: {item:Circuit} for {item:CopperComputer}, {item:AdvancedCircuit} for {item:SteelComputer}. Each circuit provides 30 seconds of boosted research. The next circuit is consumed when the current boost runs out.
ResearchComputersDescription4=Research rate with circuits: {item:CopperComputer} — 10 points per second, {item:SteelComputer} — 100. Each higher tier produces 10 times as many points per second.
ResearchComputersDescription5=Use a {item:CopperRobotArm} to feed circuits from the constructor into the computer and maintain its research boost. The constructor makes 1 {item:Circuit} in 7.5 seconds; the computer consumes 1 circuit per 30 seconds of boosted research.
Productivity=Productivity
ProductivityDescription1=The second progress bar next to the recipe progress bar shows productivity. It fills while the machine works. When the productivity bar fills, the machine produces the recipe's bonus output without consuming additional ingredients.
ProductivityDescription2=Productivity works on ore recipes of {machine:AutomaticHammer}, {machine:Macerator}, {machine:OreWasher}. Ore processed in them gives more plates than ore smelted directly.
BuildingModes=Building modes
BuildingModesDescription1=Machines and most blocks are built in a line. Hold the <blue>Left Mouse Button</> and move the crosshair away from the starting cell. Release the button to build the entire line.
BuildingModesDescription2=Platforms and other simple blocks fill a plane: hold <blue>Left Mouse Button</> and drag, the plane is picked by the direction you move first.
BuildingModesDescription3=Conveyors, pipes and cables are built as a run in two clicks: the first click anchors the start, the second builds the run, <blue>Right Mouse Button</> cancels it. Hold <blue>Shift</> to route the run around obstacles.\n\nUse the <blue>Mouse Wheel</> to raise or lower the placement height.
ItemDatabase=Item database
ItemDatabaseDescription1=The item database is on the right side of the inventory (<blue>{key:ToggleInventory}</>).
ItemDatabaseDescription2=<blue>1) Tabs</>\n\nUnlocked items, favorites, all items in the game and search results. The star tab shows favorite items, both here and in the item picker for block settings.\n
ItemDatabaseDescription3=<blue>2) Search</>\n\nEnter an item name in the search field. Matching items appear in the search results tab. Clear the field to return to the previous tab. <blue>Enter</> saves the query to the history next to the field.\n
ItemDatabaseDescription4=<blue>3) Items</>\n\nThe number on an icon shows how many items you can craft with the materials in your inventory. Right-click opens the item menu: order the item, view its recipes or research, add it to favorites or remove it from them.\n
Recipes=Recipes
RecipesDescription1=Hover over an item and press <blue>{key:Recipe}</> to open its recipes. Press the same key while aiming at a block to view that block's recipes. You can also click an item link in the text.
RecipesDescription2=Made in lists recipes that produce the item, Used in lists recipes that use it, and Can craft lists the selected machine's recipes. An ingredient's menu lets you open its recipes. Press <blue>{key:NeiLeft}</> and <blue>{key:NeiRight}</> to move back and forward through your viewing history.
CraftQueue=Craft queue
CraftQueueDescription1=Left-click an item in the database to queue one. <blue>Shift</> + left click queues as many as your materials allow, up to one stack. Use the right-click menu to order 5, 25 or 100 items.
CraftQueueDescription2=Materials are taken from your inventory when you place an order. Missing parts are crafted as part of the same order. Canceling the order returns the materials. Crafting pauses if there is no room in your inventory for the result.
Energy=Energy
EnergyDescription1=The {item:StoneFurnace} burns fuel to produce <red>heat</>. The {item:CopperStirlingEngine} turns heat into <yellow>kinetic energy</>. The {item:CopperCompactGenerator} turns kinetic energy into <blue>electricity</>. The {item:CopperComputer} consumes electricity.
EnergyDescription2=This setup converts heat into kinetic energy and then electricity, supplying up to 1 kW of electrical power. The computer consumes 400 W.
DockingDescription1=Hold the new machine and aim at one you have already built. The new machine docks to a matching port. <blue>{key:ActionRotate}</> switches between docking positions.
DockingDescription2=Port colors: <red>Heat</>, <yellow>Kinetic</>, <blue>Electricity</>. <blue>{key:ToggleSideIcons}</> shows the ports of every block.
DockingDescription3=Energy passes between machines whose ports touch. Research unlocks cables and heat pipes.
NoPower=No power
NoPowerDescription1=Aim at a machine to see its state. Check the machines one by one, from the computer back to the furnace.
NoPowerDescription2=<red>Requires</> — the machine needs more energy. Check its connection to the previous machine and whether that machine is running.\n\n<blue>Nothing takes</> — output energy is not being used fast enough. This can happen with a bad connection, or when the next machine is switched off or needs less energy.\n\n<blue>Idle</> on the furnace — no fuel.
NoPowerDescription3=A powered {item:CopperComputer} shows <blue>Idle</> if no research is selected. Open the tree with <blue>{key:Journal}</> and start a research project.
Constructor=Constructor
ConstructorDescription1=The {item:CopperConstructor} automatically crafts items using hand-crafting recipes. It runs on electricity and consumes 800 W.
ConstructorDescription2=<blue>1) Recipe Button</>\n\nOpens the list of recipes. It also clears the current recipe and returns its items to the inventory.\n
ConstructorDescription3=<blue>2) Input Slots</>\n\nEach slot accepts an ingredient required by the selected recipe. Add ingredients by hand or with a {item:CopperRobotArm}.\n
ConstructorDescription4=<blue>3) Output Slot</>\n\nThe result of the recipe. A {item:CopperRobotArm} takes it out.\n
ConstructorDescription5=<blue>4) Recipe List</>\n\nHand-crafting recipes unlocked by research. Click a recipe to select it.\n
ConstructorDescription6=Craft time: {item:CopperWire} — 4 s, {item:Triod} — 2.5 s, {item:CircuitBoard} — 1 s, {item:Circuit} — 7.5 s. Each circuit requires 1 circuit board and 3 triodes. Making those triodes takes 9 copper wires in total. With 1 constructor for each component, wire production limits the output of the entire line.
ConstructorDescription7=A {item:CopperComputer} consumes 1 circuit per 30 seconds of boosted research. 2 wire constructors and 1 constructor for each remaining component produce enough circuits to keep 1 computer continuously boosted.
Trains=Trains
TrainsDescription1=Research {research:Railway} to unlock recipes for {item:SteelRail}, {item:RailStation}, {item:Locomotive}, {item:CargoWagon} and {item:TankWagon}. The signals {item:RailSignal} and {item:RailChainSignal} become available after researching {research:RailSignals}.
TrainsDescription2=<blue>First line</>\n\nStart with two stations connected by a loop of track. Give each station two platforms, placed end to end and facing the same direction. Orient the stations so the train enters from the end without lamps and travels toward the lamps.\n\nPlace a {item:Locomotive} at the first station with a {item:CargoWagon} behind it. Put a loader or robot arm beside the wagon's platform at each station, loading at the first and unloading at the second.\n\nAdd the second station to the schedule and enable Repeat the schedule. Set <blue>L = 1</> as the departure condition at the loading station and <blue>E = 1</> at the unloading station. The train will wait for a full load and for unloading to finish before leaving. See Departure conditions for how to set these up.\n\nPut fuel in the locomotive to start the train.
TrainsDescription3=Press <blue>{key:Trains}</> to open the list of trains and stations.
TrainsRails=Rails
TrainsRailsDescription1=Hold {item:SteelRail} and press <blue>{key:ActionPrimary}</> at the chosen location to place a rail node. Each subsequent node connects to the previous one. When you start a new chain, the game tries to connect the first node to the nearest node within 24 cells.\n\nCheck the preview before placing a node: green means the connection can be built, while red means it does not fit. Use the <blue>Mouse Wheel</> to adjust the placement height.
TrainsRailsDescription2=Press <blue>{key:ActionSecondary}</> to end the chain. To extend track from an existing node, aim at it and press <blue>{key:ActionPrimary}</>. Then click another node to connect the two. Clicking an already connected node removes that section of track.
TrainsRailsDescription3=Nodes can be connected across a horizontal distance of 1 to 32 cells. Turns need a radius of at least 3 cells, and a single segment can turn up to 120°. The maximum gradient is 25%. If a connection cannot be built, a message explains why.
TrainsRailsDescription4=To build a junction, connect several tracks to the same side of a node. Trains choose a branch according to their route.
TrainsRailsDescription5=Adjacent nodes in a straight line connect automatically. Each new node costs one {item:SteelRail}. Removing a node also removes the track connected to it. Blueprints preserve nodes and their connections.
TrainsRailsDescription6=Trains slow down on tight turns. On climbs, speed depends on the weight of the train and the pull of its locomotives.
TrainsStations=Stations
TrainsStationsDescription1=Each {item:RailStation} block adds a platform for one locomotive or wagon. To stop at a station, a train must enter from the end without lamps and travel toward the lamps at the opposite end.
TrainsStationsDescription2=Place platforms end to end, facing the same direction, to join them into one station. To service the entire train, build one platform for each locomotive and wagon.
TrainsStationsDescription3=The <yellow>yellow lamp</> lights up when a train is heading to the station. The <red>red lamp</> lights up during the stop, and the <green>green lamp</> as the train leaves. A blinking red lamp indicates a departure delay, such as a lack of fuel.
TrainsStationsDescription4=Aim at a platform and press <blue>{key:ActionSecondary}</> to open the station window.
TrainsStationsDescription5=<blue>1) Station name</>\n\nSchedules identify stations by name. If several stations share a name, the train chooses one based on route length and how busy the tracks and platforms are.
TrainsStationsDescription6=<blue>2) Car at the platform</>\n\nThe platform window shows the contents of the car beside it. Loaders and robot arms transfer items through the platform, while pumps fill and empty tank wagons. A locomotive shows its fuel here; fuel can also be supplied through the platform.
TrainsStationsDescription7=<blue>3) Block settings</>\n\nThe gear button opens settings for the signals the station outputs. See Departure conditions for details.
TrainsStationsDescription8=<blue>4) Stations</>\n\nLists stations and their coordinates. If a train is at a station, its number appears beside it.
TrainsStationsDescription9=<blue>5) Station details</>\n\nHere you can rename the station and check its coordinates and platform count. Below them is the number of trains whose schedules use this station name.
TrainsStationsDescription10=<blue>6) Open the train</>\n\nOpens the schedule of the train at the station.
TrainsConsist=Locomotives and wagons
TrainsConsistDescription1=Hold a locomotive or wagon, aim at track or a station and press <blue>{key:ActionPrimary}</>. Check which way it faces before placing it. Press <blue>{key:ActionRotate}</> to turn it around. To add a wagon to a train, place it behind the train while it is at a station.
TrainsConsistDescription2=A train can move in a direction if at least one locomotive faces that way. With one locomotive, it needs a loop to return. For travel between dead ends, place two locomotives facing opposite directions.
TrainsConsistDescription3=A locomotive has two slots for the same fuel used in a furnace. Each fueled locomotive facing the direction of travel adds pulling power. As the wagons fill with cargo, the train becomes heavier.
TrainsConsistDescription4=A {item:CargoWagon} holds 10 stacks of items. A {item:TankWagon} carries one type of fluid at a time.
TrainsConsistDescription5=Aim at a car and press <blue>{key:ActionSecondary}</> to open its window. To dismantle a train at a station, use the {item:Multitool}: it returns the selected car to your inventory.
TrainsConsistDescription6=<blue>1) Switch</>\n\nA train that is switched off brakes and stays in place. Switch it on again to resume its schedule.
TrainsConsistDescription7=<blue>2) State</>\n\nBelow the train's name or number are the car number and the train's state. This also shows the station where it is stopped or the one it is heading to.
TrainsConsistDescription8=<blue>3) Contents</>\n\nThe locomotive's fuel or the wagon's cargo.
TrainsConsistDescription9=<blue>4) Schedule</>\n\nOpens this train's schedule in the Trains window.
TrainsConsistDescription10=<blue>5) Hover card</>\n\nAim at a car to see its contents and the train's state.
TrainsSchedule=Schedule
TrainsScheduleDescription1=Open the Trains window with <blue>{key:Trains}</> or the Schedule button in a car window. The station where you placed a new train is already in its schedule. Add another stop to set its route.
TrainsScheduleDescription2=<blue>1) Trains</>\n\nSelect a train in the list to open its schedule. Search by name, number (such as #12) or a station name on its route.
TrainsScheduleDescription3=<blue>2) Train name</>\n\nEnter a name for the train here. While the field is empty, the list shows its number.
TrainsScheduleDescription4=<blue>3) Repeat the schedule</>\n\nWith repetition enabled, the train returns to the first stop after the last one. Disable it to finish the route at the last station.
TrainsScheduleDescription5=<blue>4) Depart now</>\n\nSkips the departure condition at the current stop. Available when the train is at its station and has another stop in its schedule.
TrainsScheduleDescription6=<blue>5) Show route</>\n\nOpens a diagram of the route to the next station.
TrainsScheduleDescription7=<blue>6) Select stop</>\n\nClick the arrow beside a stop to send the train there. You can change the destination while the train is moving. The current stop is highlighted, with the train's state shown below it.
TrainsScheduleDescription8=<blue>7) Station</>\n\nChoose the station the train should visit from the list.
TrainsScheduleDescription9=<blue>8) Stop order</>\n\nThe arrows move a stop up or down; the cross removes it. The <blue>+ Add stop</> button is below the list.
TrainsScheduleDescription10=<blue>9) Leaves when</>\n\nSets when the train may leave this stop. See Departure conditions for details.
TrainsScheduleDescription11=The Consist panel on the right shows the locomotives, wagons and their contents.
TrainsConditions=Departure conditions
TrainsConditionsDescription1=Each stop can have a departure condition, such as waiting for a full load or a set amount of time. Conditions can use the station's own signals and signals received through wires connected to its platforms.
TrainsConditionsDescription2=<blue>1) Mode</>\n\nChoose <blue>Expr</> to compare a signal with a number or another signal. To combine conditions, choose <blue>And</>, <blue>Or</> or <blue>Xor</> and add conditions with the + button.\n\nAnd requires all conditions to be true, Or requires at least one, and Xor requires an odd number. <blue>Always</> allows departure as soon as the train arrives.
TrainsConditionsDescription3=<blue>2) Indicator</>\n\nThe indicator turns green when the condition is met and red otherwise.
TrainsConditionsDescription4=<blue>3) Signal</>\n\nClick to choose a signal to compare. You can also choose an item to compare its quantity.
TrainsConditionsDescription5=<blue>4) Comparison</>\n\nChoose whether the values must be equal (=), different (!=), greater than (>) or less than (<). The >= and <= signs also allow equal values.
TrainsConditionsDescription6=<blue>5) Value</>\n\nA number or a second signal to compare with the first.
TrainsConditionsDescription7=<blue>6) Station signals</>\n\nEnable the signals you want to use in the station settings. Storage outputs the quantity of each item and fluid in the wagons as a separate signal.\n\nBy default, <blue>P</> shows time spent at the station in ticks, and <blue>I</> shows the ticks since the cargo last changed. <blue>F</> shows the total number of fuel items in the locomotives.\n\nWhen the train is fully loaded, <blue>L</> equals 1; when it is empty, <blue>E</> equals 1. These signals account for every cargo wagon and tank wagon in the train.
TrainsConditionsDescription8=<blue>7) Values</>\n\nThe current values of the station's output signals.
TrainsConditionsDescription9=Use <blue>L = 1</> to leave after a full load and <blue>E = 1</> to leave after unloading. To wait until loading stops even if the wagon is only partly full, use <blue>I >= 100</>: the train leaves after five seconds without a change in cargo.\n\nTime is measured in ticks, with 20 ticks per second. A condition of <blue>P >= 600</> therefore keeps the train at the station for 30 seconds.
TrainsSignals=Signals
TrainsSignalsDescription1=Signals divide track into blocks. Before entering a block, a train reserves it, and other trains wait until it becomes free. While you hold a signal, the blocks are highlighted in different colors.
TrainsSignalsDescription2=Hold a signal and aim at track. The preview appears at the nearest node, on the right of the direction of travel. Press <blue>{key:ActionRotate}</> to reverse its direction and <blue>{key:ActionPrimary}</> to place it.\n\nTo remove it, click it again while holding a signal, or use the {item:Multitool}.
TrainsSignalsDescription3={item:RailSignal} allows entry into a free block. {item:RailChainSignal} checks the train's route up to the next ordinary signal, including the block beyond it.\n\nPlace a chain signal before a junction and an ordinary signal after it. The train will then wait for a clear exit before entering the junction. The block beyond the exit signal must be long enough for the whole train.
TrainsSignalsDescription4=A signal sets the permitted direction through its node. On two-way track, place a pair of signals facing opposite directions at the same node.
TrainsSignalsDescription5=A <red>red light</> closes the passage, and a <green>green light</> allows entry. <yellow>Yellow</> appears when the block is reserved by a train that will pass through this signal.\n\nAt a chain signal, green means at least one exit is open. The train proceeds when the exit on its own route is open.
TrainsSignalsDescription6=<blue>1) Rail node window</>\n\nAim at a rail node and press <blue>{key:ActionSecondary}</> to open its window. Each signal has a row of three lamps that mirrors its lights. The switch closes all signals at the node; switching it on restores normal operation.
TrainsSignalsDescription7=<blue>2) Block settings</>\n\nThe gear button opens the logic signal settings. The node outputs <blue>R</>, <blue>Y</> and <blue>G</>, showing how many signals have red, yellow and green lights respectively.\n\nTo control the signals through a wire, enable the Working import (<blue>W</>). A value greater than 0 permits passage, while the signals still check whether the track is occupied.
TrainsWaiting=Train states
TrainsWaitingDescription1=The train's state appears in the train list, at the current stop and when you aim at a car. When delayed en route, the train periodically checks for other routes to its destination.
TrainsWaitingDescription2=<blue>1) Show route</>\n\nA green line with arrows shows the planned route. If no route was found, red lines show the tracks explored during the search. A red marker indicates where the search could not continue.
TrainsWaitingDescription3=<blue>2) State</>\n\nShows what the train is doing or what is preventing it from moving.
TrainsWaitingDescription4=<blue>Departure condition</> means the train is waiting for loading, unloading or another condition in its schedule. If it shows <blue>No next stop</>, check the schedule: it has ended, or it names a station that no longer exists.\n\nFor <blue>No route</>, check track connections, station and signal directions, and locomotive orientation. <blue>Platforms taken</> means stations with the required name are already reserved by other trains.\n\n<blue>Red signal</> and <blue>Train ahead</> explain a delay en route: either a signal has closed the passage or another train is blocking the way.\n\nIf the train is <blue>Stopped</>, switch it on in a car window. <blue>No locomotive</> means it needs a locomotive facing the direction of travel. <blue>No fuel</> means the locomotives pulling the train need refueling.
